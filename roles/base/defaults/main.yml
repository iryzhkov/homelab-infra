---
# The SMART collector runs every 15 minutes. Where it reports to, and the
# Gatus heartbeat that catches it going quiet, are in group_vars/all.yml,
# because the Gatus stack on another host reads them too.
smart_on_calendar: "*:0/15"

# A drive is reported unhealthy at or above these. The Crucial P3s are QLC with
# 110 TBW (500 GB) and 440 TBW (2 TB) ratings, so wear is the number to watch.
smart_temp_max_c: 70
smart_wear_max_pct: 80

# NFS mounts kept in /etc/fstab, off unless a host lists some; see
# tasks/nfs_mounts.yml for the shape of an item.
nfs_mounts: []
# Mount points to unmount and remove from /etc/fstab.
mounts_absent: []
# Local filesystems kept in /etc/fstab by UUID, off unless a host lists some;
# see tasks/local_mounts.yml for the shape of an item.
local_mounts: []

# Keep fstrim.timer enabled and running, so a guest returns freed blocks to a
# thin pool or zvol every week. Useful only on a disk with discard=on.
fstrim_timer_enabled: false

# Docker's data-root, written into /etc/docker/daemon.json and merged with the
# keys already there. Empty leaves the file alone. Writing it never restarts
# Docker: the new root applies the next time the daemon starts, which belongs
# to a maintenance window after the old root has been copied across with
# Docker stopped. Until then every converge reports that a restart is pending.
# To roll back, set it to /var/lib/docker (Docker's own default).
docker_data_root: ""

# Further keys merged into daemon.json together with docker_data_root, and
# under the same rule: written, never applied by a restart. Empty adds
# nothing. The agent VMs use it to keep images under data-root (see
# group_vars/agent_workers.yml).
docker_daemon_extra_settings: {}

# containerd's root, for a host whose Docker uses the containerd image store
# and the system containerd.service (images and container layers live there,
# not under Docker's data-root). Written into /etc/containerd/config.toml,
# which the role then owns, with RequiresMountsFor on containerd.service.
# Empty leaves both alone. Like docker_data_root it never restarts anything;
# set the two together, in the window. To roll back, set /var/lib/containerd.
containerd_root: ""
# First line of a config.toml this role wrote; any other file is left alone.
containerd_root_marker: "# Written by homelab-infra roles/base (containerd_root)."

# qemu-guest-agent, installed and running. For VMs cloned from the Debian
# genericcloud templates, which do not include it. Off by default: the older
# VMs had it installed by hand.
qemu_guest_agent: false

# Docker Engine and the Compose plugin from download.docker.com, the way
# public-api's was installed by hand. For a Debian VM cloned from a template.
# Off by default, so that the hosts whose Docker predates this repository are
# not touched. Installing never restarts a running daemon.
docker_install: false

# A swapfile at /swapfile of this many MiB, active and in /etc/fstab. 0 leaves
# swap alone. Creating it never restarts anything.
swapfile_size_mb: 0

# true: unattended-upgrades is removed, so no package upgrade restarts
# Docker or a service behind the host's back. false leaves it as it is.
unattended_upgrades_absent: false

# systemd-resolved's LLMNR setting ("yes", "no", "resolve"), in a drop-in.
# Empty leaves it alone; ignored on a host without systemd-resolved.
resolved_llmnr: ""
docker_install_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
