---
# The base configuration of a host, each part switched on by the inventory:
#
#   smart_drives            SMART and hwmon temperatures every 15 minutes, on
#                           the hypervisors, the only hosts that see the
#                           physical drives (the VMs see virtio disks)
#   zfs_arc_max_bytes       the ZFS ARC cap, at boot and in the running kernel,
#                           on the hypervisors
#   first hypervisor        the cluster's built-in metric server; the setting
#                           is cluster-wide, so one node writes it
#   gpu_metrics: true       the passed-through iGPU's busy counters, on the
#                           guest that owns the GPU
#   nfs_mounts              NFS mounts in /etc/fstab, optionally ordered
#                           before docker.service; mounts_absent retires mounts
#   local_mounts            local filesystems in /etc/fstab by UUID, optionally
#                           ordered before docker.service
#   fstrim_timer_enabled    the weekly fstrim.timer, enabled and started
#   docker_data_root        Docker's data-root in /etc/docker/daemon.json,
#                           written but never applied by a restart
#   containerd_root         containerd's root in /etc/containerd/config.toml,
#                           the same way
#   qemu_guest_agent: true  qemu-guest-agent installed and running
#   docker_install: true    Docker Engine and Compose from download.docker.com
#
# Everything reports to InfluxDB with write-only tokens decrypted here, on the
# controller, from secrets/hardware-metrics.sops.yaml.

- name: Load the metric tokens
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../secrets/hardware-metrics.sops.yaml"
    name: metrics_secrets
  delegate_to: localhost
  no_log: true
  when: >-
    smart_drives is defined or gpu_metrics | default(false)
    or inventory_hostname == groups['hypervisors'][0]

- name: Collect SMART health and temperatures
  ansible.builtin.include_tasks: smart.yml
  when: smart_drives is defined

- name: Cap the ZFS ARC
  ansible.builtin.include_tasks: zfs_arc.yml
  when: zfs_arc_max_bytes is defined

- name: Point the cluster's metric server at InfluxDB
  ansible.builtin.include_tasks: proxmox_metrics.yml
  when: inventory_hostname == groups['hypervisors'][0]

- name: Collect iGPU engine busy time
  ansible.builtin.include_tasks: gpu.yml
  when: gpu_metrics | default(false)

- name: Keep the NFS mounts
  ansible.builtin.include_tasks: nfs_mounts.yml
  vars:
    nfs_docker_paths: >-
      {{ nfs_mounts | selectattr('before_docker', 'defined')
         | selectattr('before_docker') | map(attribute='path') | list }}
  when: nfs_mounts | length > 0 or mounts_absent | length > 0

- name: Keep the local mounts
  ansible.builtin.include_tasks: local_mounts.yml
  vars:
    local_docker_paths: >-
      {{ local_mounts | selectattr('before_docker', 'defined')
         | selectattr('before_docker') | map(attribute='path') | list }}
  when: local_mounts | length > 0

- name: Keep the weekly trim
  ansible.builtin.systemd_service:
    name: fstrim.timer
    enabled: true
    state: started
  become: true
  when: fstrim_timer_enabled | bool

- name: Keep Docker's data-root
  ansible.builtin.include_tasks: docker_data_root.yml
  when: docker_data_root | length > 0

- name: Keep containerd's root
  ansible.builtin.include_tasks: containerd_root.yml
  when: containerd_root | length > 0

- name: Keep the QEMU guest agent
  ansible.builtin.include_tasks: qemu_guest_agent.yml
  when: qemu_guest_agent | bool

- name: Install Docker
  ansible.builtin.include_tasks: docker_install.yml
  when: docker_install | bool
