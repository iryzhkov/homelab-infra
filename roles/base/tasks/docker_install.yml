---
# Docker Engine from Docker's own Debian repository, laid out as public-api's
# was by hand: the key in /etc/apt/keyrings/docker.asc and a deb822 source in
# /etc/apt/sources.list.d/docker.sources. The suite follows the host's release,
# so a Debian 13 clone gets trixie where public-api has bookworm.
#
# Nothing here restarts a running daemon. /etc/docker/daemon.json is left to
# docker_data_root (above) or to the host; public-api's Loki log driver is not
# reproduced, because a new edge VM cannot reach Loki on homelab until the
# UniFi policies name it.

- name: Read the distribution release
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution

- name: Install the packages the repository setup needs
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Install Docker's repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false
  become: true

- name: Add Docker's repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
  become: true
  register: docker_repo

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_install_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"
  become: true

- name: Run Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  become: true

# compose_stack runs docker compose as the SSH user, without sudo.
- name: Let the SSH user use Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true
  register: docker_group

# A new group membership applies only to a new login.
- name: Reconnect so the group membership applies
  ansible.builtin.meta: reset_connection
  when: docker_group is changed
