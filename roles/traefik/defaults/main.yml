---
# Every router asks for the wildcard certificate rather than one for its own
# host name; see templates/router-tls.j2. On for every edge since the phase 4
# cutover (2026-10-02).
traefik_wildcard_only: true
traefik_wildcard_domain: ryzhkov.dev

# Existing LAN VLANs for management, services, clients, and agent workers.
# Excludes Nebula, guests, loopback and public connection peers. LAN tunnel
# connectors are inside these ranges; the router separately rejects Cf-Ray.
akasha_lan_cidrs:
  - 192.168.20.0/24
  - 192.168.70.0/24
  - 192.168.90.0/24
  - 192.168.130.0/24
