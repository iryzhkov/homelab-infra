---
# Opt-in LAN canary route for https://jocasta.mcp.ryzhkov.dev/mcp, off by
# default. See docs/jocasta-mcp-canary.md. While disabled it removes its own
# file and touches nothing else.

# The backend must be a dedicated canary that Traefik's own network namespace
# can reach. Traefik runs in Docker's bridge network, so a loopback URL would
# point at Traefik itself (its API listens on 127.0.0.1:8080 there), and port
# 1935 is production Jocasta. Host is rewritten to a loopback authority, so
# that value must be loopback.
- name: Check the Jocasta MCP canary backend settings
  ansible.builtin.assert:
    that:
      - jocasta_mcp_canary_backend_url is defined
      - jocasta_mcp_canary_backend_url is string
      - jocasta_mcp_canary_backend_url is match('^http://[A-Za-z0-9.-]+:[1-9][0-9]{0,4}$')
      - jocasta_mcp_canary_backend_url is not match('^http://(localhost|127[.])')
      - jocasta_mcp_canary_backend_url is not match('.*:1935$')
      - jocasta_mcp_canary_upstream_host is defined
      - jocasta_mcp_canary_upstream_host is string
      - jocasta_mcp_canary_upstream_host is match('^(localhost|127([.][0-9]{1,3}){3}):[1-9][0-9]{0,4}$')
    fail_msg: >-
      Set jocasta_mcp_canary_backend_url to http://HOST:PORT of the dedicated
      canary backend (not loopback, not port 1935) and
      jocasta_mcp_canary_upstream_host to its loopback authority, such as
      127.0.0.1:PORT.
    quiet: true
  when: jocasta_mcp_canary_route_enabled | bool

- name: Render the explicitly enabled Jocasta MCP canary route
  ansible.builtin.template:
    src: jocasta-mcp-canary.yml.j2
    dest: "{{ traefik_dynamic_dir }}/jocasta-mcp-canary.yml"
    mode: "0644"
  when: jocasta_mcp_canary_route_enabled | bool

- name: Remove the disabled Jocasta MCP canary route
  ansible.builtin.file:
    path: "{{ traefik_dynamic_dir }}/jocasta-mcp-canary.yml"
    state: absent
  when: not jocasta_mcp_canary_route_enabled | bool
