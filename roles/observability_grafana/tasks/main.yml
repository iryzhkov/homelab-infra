---
- name: Load existing Grafana administrator credentials on the controller
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../secrets/homelab-logging.sops.yaml"
    name: observability_grafana_secrets
  delegate_to: localhost
  no_log: true

- name: Initialize dashboard source documents
  ansible.builtin.set_fact:
    observability_grafana_dashboards: []

- name: Load dashboard source documents from the controller
  ansible.builtin.set_fact:
    observability_grafana_dashboards: "{{ observability_grafana_dashboards + [lookup('ansible.builtin.file', role_path ~ '/files/dashboards/' ~ item) | from_json] }}"
  loop: "{{ observability_grafana_dashboard_files + observability_grafana_embedding_dashboard_files }}"

- name: Load encrypted aggregate dashboard capabilities only when sharing is authorized
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../secrets/observability-grafana-shares.sops.yaml"
    name: observability_grafana_share_secrets
  delegate_to: localhost
  no_log: true
  when: observability_grafana_sharing_enabled | bool

- name: Reconcile dedicated observability datasource and dashboards
  grafana_observability:
    api_url: "{{ observability_grafana_api_url }}"
    username: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_secrets.GRAFANA_PASSWORD }}"
    metrics_url: "{{ observability_grafana_metrics_url }}"
    folder_uid: "{{ observability_grafana_folder_uid }}"
    folder_title: "{{ observability_grafana_folder_title }}"
    dashboards: "{{ observability_grafana_dashboards }}"
    home_dashboard_uid: "{{ observability_grafana_home_dashboard_uid }}"
    starred_dashboard_uids: "{{ observability_grafana_starred_dashboard_uids }}"
    legacy_dashboard_uids: "{{ observability_grafana_legacy_dashboard_uids }}"
    external_shares: "{{ observability_grafana_share_secrets.GF_PUBLIC_SHARES if observability_grafana_sharing_enabled | bool else [] }}"
  register: observability_grafana_result
  no_log: true

- name: Mark changed dashboards with their source deployment
  ansible.builtin.uri:
    url: "{{ observability_grafana_api_url }}/api/annotations"
    method: POST
    user: "{{ observability_grafana_admin_user }}"
    password: "{{ observability_grafana_secrets.GRAFANA_PASSWORD }}"
    force_basic_auth: true
    body_format: json
    body:
      dashboardUID: "{{ item.uid }}"
      time: "{{ (lookup('pipe', 'date +%s') | int) * 1000 }}"
      tags: [observability-deploy, ansible]
      text: "Observability dashboards provisioned from {{ lookup('pipe', 'git rev-parse --short HEAD') }}."
    status_code: 200
  loop: "{{ observability_grafana_dashboards }}"
  no_log: true
  when:
    - observability_grafana_result is changed and not ansible_check_mode
    - not item.uid.startswith('homelab-observe-embed-')

- name: Report observability provisioning and query readiness
  ansible.builtin.debug:
    msg: "{{ observability_grafana_result.summary }}"
