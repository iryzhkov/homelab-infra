---
# No inventory activation and no implicit artifact, identity, bind or credentials.
web_mcp_endpoint_enabled: false
web_mcp_activate: false
# Upgrade an existing managed HoloNet playback endpoint without handling keys.
web_mcp_reuse_installed_credentials: false
# Explicit source-supported group read; never changes XML permissions itself.
web_mcp_custody_group_read: false
web_mcp_install_qbit_auth: false
web_mcp_endpoint: {}
