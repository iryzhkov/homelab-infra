---
- name: Configure only an explicitly enabled endpoint
  when: web_mcp_endpoint_enabled | bool
  block:
    - name: Validate the complete bounded service contract before writes
      ansible.builtin.set_fact:
        web_mcp: "{{ web_mcp_endpoint | web_mcp_endpoint_contract }}"
      no_log: true

    - name: Require the reviewed static Linux amd64 platform
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.service_mgr == 'systemd'
        quiet: true

    - name: Guard fixed paths and dedicated identities without reading secrets
      web_mcp_guard:
        kind: endpoint
        service: "{{ web_mcp.service }}"
        uid: "{{ web_mcp.uid }}"
        gid: "{{ web_mcp.gid }}"
        sha256: "{{ web_mcp.artifact.sha256 }}"
        credential_names: "{{ web_mcp.credentials | map(attribute='name') | list }}"
        journal: "{{ web_mcp.service == 'holonet' and web_mcp.config.recommendations is defined }}"

    - name: Validate protected controller sources before managed writes
      web_mcp_guard:
        kind: credential
        source: "{{ item.source }}"
        uid: "{{ item.source_uid }}"
      delegate_to: localhost
      become: false
      loop: "{{ web_mcp.credentials }}"
      no_log: true

    - name: Validate protected local artifact bytes before managed writes
      web_mcp_local_artifact:
        path: "{{ web_mcp.artifact.local_source.path }}"
        owner_uid: "{{ web_mcp.artifact.local_source.owner_uid }}"
        sha256: "{{ web_mcp.artifact.sha256 }}"
      delegate_to: localhost
      become: false
      when: web_mcp.artifact.local_source is defined
      register: web_mcp_local_artifact
      no_log: true

    # Extra vars outrank set_fact; a supplied plan would bypass the contract.
    - name: Refuse an externally supplied playlist operator plan
      ansible.builtin.assert:
        that:
          - web_mcp_operator is not defined
        quiet: true

    # Off unless the validated HoloNet config carries a non-null playlist_operator.
    - name: Derive the fixed playlist operator worker plan from the validated contract
      ansible.builtin.set_fact:
        web_mcp_operator: "{{ web_mcp_endpoint | web_mcp_playlist_operator }}"

    - name: Guard playlist operator root paths and selected journals without opening them
      web_mcp_guard:
        kind: playlist-operator
        gid: "{{ web_mcp.gid }}"
        selected: "{{ web_mcp_operator.selected }}"
        release: "{{ web_mcp_operator.release | default(omit) }}"
        modules: "{{ web_mcp_operator.pins | default({}) }}"
        journals: "{{ web_mcp_operator.journals | default([]) }}"
        configs: "{{ web_mcp_operator.configs | default([]) }}"
      register: web_mcp_operator_state
      when: web_mcp.service == 'holonet'

    - name: Inspect the playlist operator socket before staging
      ansible.builtin.command:
        argv: [systemctl, "{{ item }}", holonet-playlists-worker.socket]
      loop: [is-active, is-enabled]
      register: web_mcp_operator_unit_state
      changed_when: false
      failed_when: false
      check_mode: false
      when: web_mcp_operator.selected and not (web_mcp_activate | bool)

    - name: Refuse staging the playlist operator over a running or enabled socket
      ansible.builtin.assert:
        that:
          - web_mcp_operator_unit_state.results[0].stdout in ['inactive', 'failed']
          - web_mcp_operator_unit_state.results[1].stdout in ['', 'disabled', 'not-found']
        quiet: true
      when: web_mcp_operator.selected and not (web_mcp_activate | bool)

    - name: Inspect service state before staging
      ansible.builtin.service_facts:
      when: not (web_mcp_activate | bool)

    - name: Refuse staging over a running or enabled endpoint
      ansible.builtin.assert:
        that:
          - ansible_facts.services.get(web_mcp.service ~ '.service', {}).get('state', 'stopped') != 'running'
          - ansible_facts.services.get(web_mcp.service ~ '.service', {}).get('status', 'disabled') not in ['enabled', 'enabled-runtime']
        quiet: true
      when: not (web_mcp_activate | bool)

    - name: Create the dedicated system group
      ansible.builtin.group:
        name: "{{ web_mcp.service }}"
        gid: "{{ web_mcp.gid }}"
        system: true

    - name: Create the dedicated nonroot system identity
      ansible.builtin.user:
        name: "{{ web_mcp.service }}"
        uid: "{{ web_mcp.uid }}"
        group: "{{ web_mcp.service }}"
        system: true
        home: /nonexistent
        create_home: false
        shell: /usr/sbin/nologin
        password_lock: true

    - name: Create root-owned release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/web-mcp
        - "/opt/web-mcp/{{ web_mcp.service }}"
        - "/opt/web-mcp/{{ web_mcp.service }}/releases"
        - "/opt/web-mcp/{{ web_mcp.service }}/releases/{{ web_mcp.artifact.sha256 }}"

    - name: Mark this bounded endpoint as managed
      ansible.builtin.copy:
        content: "homelab-infra web-mcp {{ web_mcp.service }}\n"
        dest: "/opt/web-mcp/{{ web_mcp.service }}/.homelab-infra-owned"
        owner: root
        group: root
        mode: "0644"

    - name: Stage the checksum-pinned static executable before activation
      ansible.builtin.get_url:
        url: "{{ web_mcp.artifact.url }}"
        dest: "/opt/web-mcp/{{ web_mcp.service }}/releases/{{ web_mcp.artifact.sha256 }}/{{ web_mcp.service }}"
        checksum: "sha256:{{ web_mcp.artifact.sha256 }}"
        owner: root
        group: root
        mode: "0555"
        validate_certs: true
        use_proxy: false
        timeout: 30
      register: web_mcp_download
      when: web_mcp.artifact.local_source is not defined

    - name: Stage the prevalidated local executable with a pinned transfer checksum
      ansible.builtin.copy:
        src: "{{ web_mcp.artifact.local_source.path }}"
        dest: "/opt/web-mcp/{{ web_mcp.service }}/releases/{{ web_mcp.artifact.sha256 }}/{{ web_mcp.service }}"
        checksum: "{{ web_mcp_local_artifact.sha1 }}"
        owner: root
        group: root
        mode: "0555"
      when: web_mcp.artifact.local_source is defined
      register: web_mcp_copy
      no_log: true
      diff: false

    - name: Verify the staged binary independently
      ansible.builtin.stat:
        path: "/opt/web-mcp/{{ web_mcp.service }}/releases/{{ web_mcp.artifact.sha256 }}/{{ web_mcp.service }}"
        follow: false
        checksum_algorithm: sha256
      register: web_mcp_staged

    - name: Refuse activation without the exact executable
      ansible.builtin.assert:
        that:
          - web_mcp_staged.stat.isreg | default(false)
          - not (web_mcp_staged.stat.islnk | default(false))
          - web_mcp_staged.stat.uid == 0
          - web_mcp_staged.stat.mode == '0555'
          - web_mcp_staged.stat.checksum == web_mcp.artifact.sha256
        quiet: true
      when: not ansible_check_mode

    - name: Require a checksum-matching static amd64 ELF before activation
      web_mcp_guard:
        kind: binary
        service: "{{ web_mcp.service }}"
        sha256: "{{ web_mcp.artifact.sha256 }}"
      when: not ansible_check_mode

    - name: Create a root-owned protected configuration directory
      ansible.builtin.file:
        path: "/etc/{{ web_mcp.service }}"
        state: directory
        owner: root
        group: "{{ web_mcp.service }}"
        mode: "0750"

    - name: Create the fixed root-owned HoloNet state parent
      ansible.builtin.file:
        path: /var/lib/holonet
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: web_mcp.service == 'holonet' and web_mcp.config.recommendations is defined

    - name: Create only the private runtime-owned recommendation journal directory
      ansible.builtin.file:
        path: /var/lib/holonet/recommendations
        state: directory
        owner: "{{ web_mcp.uid }}"
        group: "{{ web_mcp.gid }}"
        mode: "0700"
      when: web_mcp.service == 'holonet' and web_mcp.config.recommendations is defined

    - name: Install the runtime-owned configuration
      ansible.builtin.copy:
        content: "{{ web_mcp.config | to_nice_json }}\n"
        dest: "/etc/{{ web_mcp.service }}/config.json"
        owner: "{{ web_mcp.uid }}"
        group: "{{ web_mcp.gid }}"
        mode: "0600"
      no_log: true
      diff: false
      register: web_mcp_config

    - name: Validate HoloNet config as the runtime identity without opening credentials
      ansible.builtin.command:
        argv:
          - "/opt/web-mcp/holonet/releases/{{ web_mcp.artifact.sha256 }}/holonet"
          - --config
          - /etc/holonet/config.json
          - --check-config
      become: true
      become_user: "{{ web_mcp.service }}"
      changed_when: false
      no_log: true
      when: web_mcp.service == 'holonet' and not ansible_check_mode

    - name: Install separately supplied protected backend credentials
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "/etc/{{ web_mcp.service }}/{{ item.name }}"
        owner: "{{ web_mcp.uid }}"
        group: "{{ web_mcp.gid }}"
        mode: "0600"
      loop: "{{ web_mcp.credentials }}"
      no_log: true
      diff: false
      register: web_mcp_credentials

    - name: Stage the root playlist operator worker for configured management
      when: web_mcp_operator.selected
      block:
        - name: Create the root-owned playlist operator package root
          ansible.builtin.file:
            path: /opt/holonet-playlists
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Mark the playlist operator package as managed
          ansible.builtin.copy:
            content: "homelab-infra holonet-playlists\n"
            dest: /opt/holonet-playlists/.homelab-infra-owned
            owner: root
            group: root
            mode: "0644"

        - name: Create the root-owned worker release parent
          ansible.builtin.file:
            path: /opt/holonet-playlists/releases
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Inspect the already guarded worker release before staging
          ansible.builtin.stat:
            path: "{{ web_mcp_operator.release_directory }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          register: web_mcp_operator_release

        - name: Create a missing worker release with owner staging access
          ansible.builtin.file:
            path: "{{ web_mcp_operator.release_directory }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          when: not web_mcp_operator_release.stat.exists

        - name: Install the pinned worker, shared entry, adapter and core as one release
          ansible.builtin.copy:
            src: "{{ item.source }}"
            dest: "{{ web_mcp_operator.release_directory }}/{{ item.name }}"
            owner: root
            group: root
            mode: "0444"
          loop: "{{ web_mcp_operator.modules }}"
          loop_control:
            label: "{{ item.name }}"
          when: not web_mcp_operator_release.stat.exists

        - name: Seal a newly staged worker release read-only
          ansible.builtin.file:
            path: "{{ web_mcp_operator.release_directory }}"
            state: directory
            owner: root
            group: root
            mode: "0555"
          when: not web_mcp_operator_release.stat.exists

        - name: Verify the staged worker modules independently
          ansible.builtin.stat:
            path: "{{ web_mcp_operator.release_directory }}/{{ item.name }}"
            follow: false
            checksum_algorithm: sha256
          loop: "{{ web_mcp_operator.modules }}"
          loop_control:
            label: "{{ item.name }}"
          register: web_mcp_operator_staged

        - name: Refuse a worker release that differs from its pins
          ansible.builtin.assert:
            that:
              - item.stat.isreg | default(false)
              - not (item.stat.islnk | default(false))
              - item.stat.uid == 0
              - item.stat.mode == '0444'
              - item.stat.checksum == item.item.sha256
            quiet: true
          loop: "{{ web_mcp_operator_staged.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: not ansible_check_mode

        - name: Create the private root policy directory
          ansible.builtin.file:
            path: /etc/holonet-playlists
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Install the root management ceiling from the validated endpoint config
          ansible.builtin.copy:
            content: "{{ web_mcp_operator.policy | to_nice_json }}\n"
            dest: /etc/holonet-playlists/policy.json
            owner: root
            group: root
            mode: "0600"

        - name: Declare the boot-time root:holonet socket parent
          ansible.builtin.template:
            src: holonet-playlists.tmpfiles.j2
            dest: /etc/tmpfiles.d/holonet-playlists.conf
            owner: root
            group: root
            mode: "0644"
          register: web_mcp_operator_tmpfiles

        - name: Install the hardened per-connection worker unit
          ansible.builtin.template:
            src: holonet-playlists-worker@.service.j2
            dest: /etc/systemd/system/holonet-playlists-worker@.service
            owner: root
            group: root
            mode: "0644"
          register: web_mcp_operator_service

        - name: Install the local operator socket unit
          ansible.builtin.template:
            src: holonet-playlists-worker.socket.j2
            dest: /etc/systemd/system/holonet-playlists-worker.socket
            owner: root
            group: root
            mode: "0644"
          register: web_mcp_operator_socket

    - name: Install the root-owned hardened endpoint unit
      ansible.builtin.template:
        src: endpoint.service.j2
        dest: "/etc/systemd/system/{{ web_mcp.service }}.service"
        owner: root
        group: root
        mode: "0644"
      register: web_mcp_unit

    - name: Reload only when the unit changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: web_mcp_unit is changed and not ansible_check_mode

    - name: Reload when the playlist operator units changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        web_mcp_operator.selected and not ansible_check_mode
        and (web_mcp_operator_service is changed or web_mcp_operator_socket is changed)

    - name: Create the declared socket parent before the first activation
      ansible.builtin.command:
        argv: [systemd-tmpfiles, --create, /etc/tmpfiles.d/holonet-playlists.conf]
      when: >-
        web_mcp_operator.selected and web_mcp_activate | bool and not ansible_check_mode
        and (web_mcp_operator_tmpfiles is changed or not web_mcp_operator_state.runtime)

    - name: Activate the playlist operator socket only with explicit activation
      ansible.builtin.systemd_service:
        name: holonet-playlists-worker.socket
        enabled: true
        state: "{{ 'restarted' if web_mcp_operator_socket is changed else 'started' }}"
      when: web_mcp_operator.selected and web_mcp_activate | bool and not ansible_check_mode

    # Rollback: release, policy, configs, journals and credential stay in place.
    - name: Stop and disable an installed socket when management is not configured
      ansible.builtin.systemd_service:
        name: holonet-playlists-worker.socket
        enabled: false
        state: stopped
      when: >-
        web_mcp.service == 'holonet' and not web_mcp_operator.selected
        and web_mcp_operator_state.installed | default(false)

    - name: Activate only the explicitly selected endpoint
      ansible.builtin.systemd_service:
        name: "{{ web_mcp.service }}"
        enabled: true
        state: "{{ 'restarted' if (web_mcp_download is changed or web_mcp_copy is changed or web_mcp_config is changed or web_mcp_credentials is changed or web_mcp_unit is changed) else 'started' }}"
      when: web_mcp_activate | bool and not ansible_check_mode
