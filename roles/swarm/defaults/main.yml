---
# Swarm's control-plane ports, allowed only from the other managers' mesh
# addresses on nebula1.
swarm_control_ports:
  - { port: 2377, proto: tcp }   # cluster management (raft, joins)
  - { port: 7946, proto: tcp }   # node gossip
  - { port: 7946, proto: udp }

# The VXLAN data path, unauthenticated: allowed only between the two workers
# on their VLAN 70 interface, never on nebula1 and never to OCI.
swarm_data_ports:
  - { port: 4789, proto: udp }

# The interface the control plane uses.
swarm_mesh_iface: nebula1

# The cluster's secrets: the autolock unlock key and the registry tokens.
swarm_secret_file: "{{ playbook_dir }}/../secrets/swarm.sops.yaml"

# Forgejo access tokens for the registry, created on the first run. Builders
# log in with the push token, every other node with the pull token.
swarm_registry_tokens:
  - { key: swarm_registry_push_token, name: swarm-registry-push, scopes: "write:package" }
  - { key: swarm_registry_pull_token, name: swarm-registry-pull, scopes: "read:package" }

# The other managers, whose mesh addresses may reach the control ports here,
# and the other workers, whose VLAN 70 addresses may reach the data port.
# Sorted: a group built from child groups has no stable order between runs,
# and the firewall script must render the same every time.
swarm_manager_peers: "{{ groups['swarm'] | difference([inventory_hostname]) | sort }}"
swarm_worker_peers: "{{ groups['swarm_workers'] | difference([inventory_hostname]) | sort }}"
