---
# The include loop is expanded before its tasks run; guard each observation too.
- name: Verify one observation
  when: machine_identity_problems | length > 0
  block:
    - name: Allow the observed state to settle
      ansible.builtin.pause:
        seconds: 3
      when: machine_identity_attempt > 0

    - name: Look up the result
      ansible.builtin.uri:
        url: "{{ machine_identity_api }}{{ item.path }}"
        headers: "{{ authentik_headers }}"
        follow_redirects: none
        status_code: [200, 404]
      loop: "{{ machine_identity_spec | machine_identity_queries(machine_identity_owned, machine_identity_proven_provider if authentik_machine_identity_existing_owned_only | bool else none) }}"
      loop_control:
        label: "{{ item.kind }} {{ item.id }}"
      register: machine_identity_result
      no_log: true

    - name: List every application
      ansible.builtin.uri:
        url: "{{ machine_identity_api }}/core/applications/?superuser_full_list=true&page_size=500"
        headers: "{{ authentik_headers }}"
        follow_redirects: none
      register: machine_identity_apps
      no_log: true

    - name: Read each service application's policy bindings
      ansible.builtin.uri:
        url: "{{ machine_identity_api }}/policies/bindings/?target={{ machine_identity_app.pk }}&page_size=500"
        headers: "{{ authentik_headers }}"
        follow_redirects: none
      vars:
        machine_identity_app: >-
          {{ machine_identity_result.results | machine_identity_lookup('application', item.value.slug) }}
      register: machine_identity_bindings
      loop: "{{ machine_identity_spec.services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value.state == 'present' and machine_identity_app | length > 0
      no_log: true

    - name: Index each complete binding response by application
      ansible.builtin.set_fact:
        machine_identity_bindings_by_slug: >-
          {%- set found = {} -%}
          {%- for result in machine_identity_bindings.results | default([]) if result.json is defined -%}
          {%- set _ = found.update({result.item.value.slug: result.json}) -%}
          {%- endfor -%}
          {{ found }}

    # check_access honours for_user only for a superuser, which the access
    # role's account is. Every application, not only the shared one: an
    # application without bindings may admit any account.
    - name: Ask Authentik which applications each account may open
      ansible.builtin.uri:
        url: "{{ machine_identity_api }}/core/applications/{{ item.slug }}/check_access/?for_user={{ item.pk }}"
        headers: "{{ authentik_headers }}"
        follow_redirects: none
      loop: >-
        {%- set checks = [] -%}
        {%- for identity in machine_identity_spec.identities if identity.state == 'present' -%}
        {%-   set user = machine_identity_result.results | machine_identity_lookup('user', identity.username) -%}
        {%-   for app in machine_identity_apps.json.results | default([]) if user | length > 0 -%}
        {%-     set _ = checks.append({'username': identity.username, 'pk': user.pk | default(''), 'slug': app.slug}) -%}
        {%-   endfor -%}
        {%- endfor -%}
        {{ checks }}
      loop_control:
        label: "{{ item.username }} / {{ item.slug }}"
      register: machine_identity_access
      no_log: true

    - name: Compare Authentik with the declared state
      ansible.builtin.set_fact:
        machine_identity_problems: >-
          {{ machine_identity_spec | machine_identity_problems(
               machine_identity_result.results, machine_identity_apps.json,
               machine_identity_bindings_by_slug, machine_identity_access.results | default([])) }}
