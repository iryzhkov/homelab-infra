---
- name: Restart the observability mesh relay
  ansible.builtin.systemd_service:
    name: observability-mesh-relay
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart the observability collector
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
