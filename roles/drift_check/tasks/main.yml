---
# Install the drift check on a managed host: the manifest of what was just
# deployed, the checker, and a daily timer that reports into the fleet feed.
#
# Runs at the end of the same play that deploys the stacks, so the manifest
# always describes the deploy that produced it.

# site.yml does not gather facts, and this role needs one: the home directory
# to install into.
- name: Gather the facts this role needs
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - env

- name: Ensure the local directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.local/bin"
    - "{{ ansible_env.HOME }}/.local/share/homelab-infra"
    - "{{ ansible_env.HOME }}/.config/systemd/user"
    - "{{ ansible_env.HOME }}/.config/feed"

- name: Write the manifest of what was deployed
  ansible.builtin.template:
    src: drift-manifest.json.j2
    dest: "{{ ansible_env.HOME }}/.local/share/homelab-infra/drift-manifest.json"
    mode: "0644"

# The wrapper posts findings with `feed`, which comes from the homelab-cli
# repository rather than this one. Fail here rather than discover at 08:30 that
# the report had nowhere to go.
- name: Check that the feed client is installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/bin/feed"
  register: feed_client
  when: drift_check_reports | default(true)

- name: Require the feed client
  ansible.builtin.assert:
    that: feed_client.stat.exists
    fail_msg: >-
      {{ inventory_hostname }} has no ~/.local/bin/feed. Install homelab-cli
      there first: ./install.sh --remote {{ inventory_hostname }} from that
      repository.
  when: drift_check_reports | default(true)

- name: Load the feed token
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../secrets/feed.sops.yaml"
    name: feed_secrets
  delegate_to: localhost
  no_log: true
  when: drift_check_reports | default(true)

- name: Point the feed client at the feed
  ansible.builtin.copy:
    content: |
      FEED_URL={{ feed_url }}
    dest: "{{ ansible_env.HOME }}/.config/feed/config"
    mode: "0644"
  when: drift_check_reports | default(true)

- name: Install the feed token
  ansible.builtin.copy:
    content: "{{ feed_secrets.FEED_TOKEN }}\n"
    dest: "{{ ansible_env.HOME }}/.config/feed/key"
    mode: "0600"
  no_log: true
  when: drift_check_reports | default(true)

- name: Install the checker
  ansible.builtin.copy:
    src: homelab-drift-check
    dest: "{{ ansible_env.HOME }}/.local/bin/homelab-drift-check"
    mode: "0755"

# The wrapper knows which peers this host checks on their behalf, so it is a
# template rather than a fixed file.
- name: Install the reporting wrapper
  ansible.builtin.template:
    src: homelab-drift-report.j2
    dest: "{{ ansible_env.HOME }}/.local/bin/homelab-drift-report"
    mode: "0755"
  vars:
    drift_check_scope: >-
      {{ ([inventory_hostname] + (drift_check_peers | default([]))) | join(' and ') }}
  when: drift_check_reports | default(true)

- name: Install the systemd user units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - homelab-drift-check.service
    - homelab-drift-check.timer
  register: drift_units
  when: drift_check_reports | default(true)

- name: Reload the user manager when a unit changed
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  when:
    - drift_check_reports | default(true)
    - drift_units is changed

- name: Enable the timer
  ansible.builtin.systemd_service:
    scope: user
    name: homelab-drift-check.timer
    enabled: true
    state: started
  # In check mode the unit files were never written, so systemd would be asked
  # about a timer that does not exist yet.
  when:
    - drift_check_reports | default(true)
    - not ansible_check_mode
