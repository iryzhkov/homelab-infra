---
# Deploy one Compose stack from stacks/<name>/ to a host, with its secrets
# rendered into a .env beside it.
#
# Takes one variable, `stack`, a dict:
#   name      the Compose project name
#   source    optional; directory under stacks/ holding the Compose file.
#             Defaults to name, and is spelled out where one project name is
#             used by several hosts with different files, as `diun` is.
#   dir       optional; absolute deployment directory. Defaults to
#             {{ stack_root }}/{{ name }}, and is spelled out where the running
#             stack sits somewhere else, as hugo and immich do.
#   env_extra optional; plain (non-secret) variables for the env file, for
#             addresses derived from the inventory rather than written twice.
#   prepare_tasks optional; prerequisite task file under stacks/<source>/.
#   pull      optional; Compose pull policy, default never for adopted stacks.
#   write_env optional; set false for a stack whose secrets are used only by a
#             config_template, so that no .env is written beside it.
#
# Every env file also gets HOST_IP, the address of the host the stack runs on,
# so a Compose file can publish a port on its own host without naming it.
#   config_templates  optional; files the Compose file mounts, rendered from
#             stacks/<source>/templates/. Each is {src, dest, mode}, and a
#             change to one restarts the stack, because a bind-mounted file
#             changing on disk does not.
#   env_file  optional; the file the Compose file reads its variables from.
#             Defaults to .env; immich reads stack.env.
#   secrets   optional; base name of a file under secrets/, without the
#             .sops.yaml suffix. Its keys are environment variable names and
#             become the .env verbatim.
#
# stack_root is a per-host inventory variable because the hosts disagree about
# ~/app and ~/apps.
#
# Secrets are decrypted on the controller, never on the managed host.

- name: Load the stack's secrets
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../secrets/{{ stack.secrets }}.sops.yaml"
    name: stack_secrets
  delegate_to: localhost
  no_log: true
  when: stack.secrets is defined

# Some stack directories are owned by root or by a container's own uid, from
# before this repository existed. Writing into those needs sudo, which is
# detected rather than declared per stack: a copy into a directory we cannot
# write would otherwise fail only on the day the file actually changes.
- name: Check whether the stack directory is ours to write
  ansible.builtin.stat:
    path: "{{ stack_dir }}"
  register: stack_dir_stat
  changed_when: false

- name: Decide whether this stack needs sudo for its files
  ansible.builtin.set_fact:
    stack_needs_root: "{{ stack_dir_stat.stat.exists and not (stack_dir_stat.stat.writeable | default(true)) }}"

# Neither the directory's mode nor the Compose file's is managed. The stack
# directories predate this repository and some are root-owned (~/app/actual is,
# for one), so asserting a mode fails on exactly the hosts we are adopting. The
# .env below is the file whose mode matters, and Ansible creates that one.
- name: Ensure the stack directory exists
  ansible.builtin.file:
    path: "{{ stack_dir }}"
    state: directory

# Optional stack-specific prerequisites, also run by a normal site converge.
- name: Prepare stack-specific storage
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../stacks/{{ stack.source | default(stack.name) }}/{{ stack.prepare_tasks }}"
  when: stack.prepare_tasks is defined

- name: Install the Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/{{ stack.source | default(stack.name) }}/docker-compose.yml"
    dest: "{{ stack_dir }}/docker-compose.yml"
  become: "{{ stack_needs_root }}"

# community.sops.load_vars sets play vars, which set_fact outranks, so the
# reset cannot be a set_fact. A stack that declares no secrets therefore ignores
# whatever the previous stack in the loop left in stack_secrets.
- name: Assemble the environment file's contents
  ansible.builtin.set_fact:
    stack_env: >-
      {{ {'HOST_IP': ansible_host}
         | combine(stack.env_extra | default({}))
         | combine(stack.secrets is defined | ternary(stack_secrets | default({}), {})) }}
  no_log: true

- name: Install the environment file
  ansible.builtin.copy:
    content: |
      {% for key, value in stack_env | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ stack_dir }}/{{ stack.env_file | default('.env') }}"
    mode: "0600"
    # Written as root where the directory demands it, but owned by the user
    # that runs docker compose, which has to read it.
    owner: "{{ ansible_user }}"
  become: "{{ stack_needs_root }}"
  no_log: true
  # A stack gets an env file when it has secrets, or when it asks for one with
  # env_extra — including `env_extra: {}`, which is how a stack says it wants
  # nothing but HOST_IP.
  when:
    - stack.secrets is defined or stack.env_extra is defined
    - stack.write_env | default(true)

# Configuration the Compose file mounts into a container. Kept separate from
# the Compose file because a change here does not recreate anything: the
# container has to be restarted for it to be re-read.
- name: Install mounted configuration files
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../stacks/{{ stack.source | default(stack.name) }}/templates/{{ item.src }}"
    dest: "{{ stack_dir }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  become: "{{ stack_needs_root }}"
  # These render secrets; a --diff run would otherwise print them.
  no_log: true
  loop: "{{ stack.config_templates | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: stack_config_files

# See compose_logging_override in defaults/main.yml.
- name: Read this host's Docker log defaults
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: compose_daemon_json
  failed_when: false

- name: Work out which services get the logging override
  ansible.builtin.set_fact:
    compose_log_daemon: >-
      {{ (compose_daemon_json.content | b64decode | from_json)
         if compose_daemon_json.content is defined else {} }}
    compose_log_services: >-
      {{ ((lookup('file', playbook_dir ~ '/../stacks/' ~ (stack.source | default(stack.name)) ~ '/docker-compose.yml')
           | from_yaml).services | default({})).items()
         | rejectattr('1.logging', 'defined') | map(attribute='0') | list }}

- name: Decide whether this stack gets the override
  ansible.builtin.set_fact:
    compose_log_override_wanted: >-
      {{ compose_log_services | length > 0
         and ((docker_logs_via_alloy | default(false) | bool)
           or (compose_logging_override | bool
             and compose_log_daemon['log-driver'] | default('') == 'loki'
             and (compose_log_daemon['log-opts'] | default({}))['mode'] | default('') == 'non-blocking')) }}
    compose_log_doc: >-
      {%- set services = {} -%}
      {%- set logging = {'driver': 'local', 'options': docker_alloy_log_options}
            if docker_logs_via_alloy | default(false) | bool else
            {'driver': 'loki', 'options': (compose_log_daemon['log-opts'] | default({}))} -%}
      {%- for name in compose_log_services -%}
      {%-   set _ = services.update({name: {'logging': logging}}) -%}
      {%- endfor -%}
      {{ {'services': services} }}

- name: Install the logging override
  ansible.builtin.copy:
    content: |
      # Written by homelab-infra roles/compose_stack (compose_logging_override):
      # bounded local logging for Alloy, or the unmigrated daemon's Loki settings.
      # Applied through container recreation. Rewritten on every run.
      {{ compose_log_doc | to_nice_yaml(indent=2) }}
    dest: "{{ stack_dir }}/docker-compose.override.yml"
    mode: "0644"
  become: "{{ stack_needs_root }}"
  when: compose_log_override_wanted | bool

- name: Remove a logging override this stack no longer gets
  ansible.builtin.file:
    path: "{{ stack_dir }}/docker-compose.override.yml"
    state: absent
  become: "{{ stack_needs_root }}"
  when: not compose_log_override_wanted | bool

# Compose reads .env for interpolation on its own, but a stack that keeps its
# variables somewhere else needs --env-file, or every ${VAR} in the Compose
# file resolves to an empty string. immich is the one that does.
- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    project_name: "{{ stack.name }}"
    env_files: "{{ [stack.env_file] if stack.env_file | default('.env') != '.env' else omit }}"
    state: present
    pull: "{{ stack.pull | default('never') }}"

# The checksum of the file as it landed, rather than of the repository's copy:
# Ansible's file lookup drops a trailing newline, so hashing what it returns
# does not match hashing the file on either side.
- name: Checksum the Compose file as deployed
  ansible.builtin.stat:
    path: "{{ stack_dir }}/docker-compose.yml"
    checksum_algorithm: sha256
  register: deployed_compose
  changed_when: false

# What was deployed, recorded for the drift check. Key names only, never
# values: the manifest lives on the managed host, which has no age key.
- name: Record this stack in the drift manifest
  ansible.builtin.set_fact:
    drift_manifest_stacks: >-
      {{ (drift_manifest_stacks | default([])) + [{
           'name': stack.name,
           'dir': stack_dir,
           'compose_sha256': deployed_compose.stat.checksum | default(''),
           'env_file': (stack.env_file | default('.env'))
                       if (stack.secrets is defined or stack.env_extra is defined)
                          and (stack.write_env | default(true)) else none,
           'env_keys': (stack_env | default({}) | list | sort)
                       if (stack.secrets is defined or stack.env_extra is defined)
                          and (stack.write_env | default(true)) else [],
           'config_files': (stack.config_templates | default([]) | map(attribute='dest') | list)
                           + (['docker-compose.override.yml'] if compose_log_override_wanted | bool else []),
         }] }}

- name: Restart the stack when a mounted configuration file changed
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    project_name: "{{ stack.name }}"
    env_files: "{{ [stack.env_file] if stack.env_file | default('.env') != '.env' else omit }}"
    state: restarted
  when: stack_config_files is changed
