---
# Deploy one Compose stack from stacks/<name>/ to a host, with its secrets
# rendered into a .env beside it.
#
# Required variables:
#   stack_name  directory under stacks/ and the Compose project name
#   stack_env   dict of environment variables for the .env file (may be empty)
#
# The stack lands in {{ stack_root }}/{{ stack_name }}, where stack_root is a
# per-host inventory variable because the hosts disagree about ~/app vs ~/apps.

- name: Ensure the stack directory exists
  ansible.builtin.file:
    path: "{{ stack_root }}/{{ stack_name }}"
    state: directory
    mode: "0750"

- name: Install the Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../stacks/{{ stack_name }}/docker-compose.yml"
    dest: "{{ stack_root }}/{{ stack_name }}/docker-compose.yml"
    mode: "0640"
  register: compose_file

- name: Install the environment file
  ansible.builtin.copy:
    content: |
      # Written by Ansible from secrets/. Do not edit on the host: the next
      # playbook run overwrites it.
      {% for key, value in (stack_env | default({})) | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ stack_root }}/{{ stack_name }}/.env"
    mode: "0600"
  no_log: true
  register: env_file

- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ stack_root }}/{{ stack_name }}"
    project_name: "{{ stack_name }}"
    state: present
    pull: never
