---
- name: Require an explicitly declared small Debian guest and parent
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - inventory_hostname in ['ct100', 'ct104', 'ct107']
      - observability_guest_log_parent in groups['hypervisors']
      - observability_guest_log_port | int == 1515
      - observability_guest_log_files | length > 0
    quiet: true

- name: Check space for a small package and bounded forwarding queue
  ansible.builtin.command:
    argv: [df, --output=avail, -BM, /]
  register: observability_guest_logs_free
  changed_when: false
  check_mode: false

- name: Preserve at least 192 MiB headroom above queue and package allocation
  ansible.builtin.assert:
    that:
      - (observability_guest_logs_free.stdout_lines[-1] | trim | regex_replace('M$', '') | int) >= 256
    quiet: true

- name: Check the native package before refreshing installation metadata
  ansible.builtin.stat:
    path: /usr/sbin/rsyslogd
  register: observability_guest_logs_binary

- name: Inspect ownership before touching a distribution syslog service
  ansible.builtin.stat:
    path: /etc/observability-guest-logs/rsyslog.conf
  register: observability_guest_logs_owned_config

- name: Inspect distribution service metadata
  ansible.builtin.service_facts:
  register: observability_guest_logs_services

- name: Preserve any preexisting active distribution daemon
  ansible.builtin.assert:
    that:
      - >-
        observability_guest_logs_services.ansible_facts.services.get('rsyslog.service', {}).get('state', 'stopped') != 'running'
        or observability_guest_logs_owned_config.stat.exists
    quiet: true
    fail_msg: An existing active distribution syslog daemon needs a separate coverage review.

- name: Create private forwarder configuration and persistent cursor directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/observability-guest-logs
    - /var/lib/observability-guest-logs

- name: Prepare signed official Debian metadata without altering existing app feeds
  ansible.builtin.copy:
    content: |
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian {{ ansible_facts.distribution_release }} main
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian {{ ansible_facts.distribution_release }}-updates main
      deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://security.debian.org/debian-security {{ ansible_facts.distribution_release }}-security main
    dest: /etc/observability-guest-logs/debian.sources.list
    owner: root
    group: root
    mode: "0600"
  when: not observability_guest_logs_binary.stat.exists

- name: Refresh only official signed metadata before a first package installation
  ansible.builtin.command:
    argv:
      - apt-get
      - update
      - -oDir::Etc::sourcelist=/etc/observability-guest-logs/debian.sources.list
      - -oDir::Etc::sourceparts=-
      - -oAPT::Get::List-Cleanup=0
  when: not observability_guest_logs_binary.stat.exists and not ansible_check_mode

- name: Install the small native forwarder without starting the default daemon
  ansible.builtin.apt:
    name: rsyslog
    state: present
    policy_rc_d: 101

- name: Keep the newly installed distribution daemon disabled across reboots
  ansible.builtin.systemd_service:
    name: rsyslog
    enabled: false
    state: stopped
  when: not ansible_check_mode

- name: Validate and install only the dedicated forwarder configuration
  ansible.builtin.template:
    src: rsyslog.conf.j2
    dest: /etc/observability-guest-logs/rsyslog.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/rsyslogd -N1 -f %s
  notify: Restart the dedicated guest log forwarder

- name: Install the bounded independent forwarder service
  ansible.builtin.template:
    src: observability-guest-logs.service.j2
    dest: /etc/systemd/system/observability-guest-logs.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the dedicated guest log forwarder

- name: Apply only the dedicated collector changes
  ansible.builtin.meta: flush_handlers

- name: Start the independent log forwarder
  ansible.builtin.systemd_service:
    name: observability-guest-logs
    daemon_reload: true
    enabled: true
    state: started
  when: observability_guest_logs_start | bool and not ansible_check_mode

- name: Confirm the dedicated forwarder is running
  ansible.builtin.command:
    argv: [systemctl, is-active, observability-guest-logs.service]
  changed_when: false
  when: observability_guest_logs_start | bool and not ansible_check_mode
