---
# Backups this repository owns: hourly consistent snapshots of the small SQLite
# databases, and a daily InfluxDB archive.
#
# The twice-weekly rclone and pg_backup.sh jobs in cron are untouched. They
# cover the large and the slow-moving; these two tiers cover what the
# 2026-09-06 restore test showed they covered badly or not at all — SQLite
# files copied live, and InfluxDB's named volumes copied by nothing.

- name: Gather the facts this role needs
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - env

- name: Load the secrets the backups need
  community.sops.load_vars:
    file: "{{ playbook_dir }}/../secrets/homelab-logging.sops.yaml"
    name: backup_secrets
  delegate_to: localhost
  no_log: true

- name: Ensure the directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.local/bin"
    - "{{ ansible_env.HOME }}/.config/homelab-backup"
    - "{{ ansible_env.HOME }}/.config/systemd/user"
    - "{{ backup_root }}/sqlite"
    - "{{ backup_root }}/influxdb"

- name: Describe the databases to snapshot
  ansible.builtin.copy:
    content: "{{ backup_sqlite_sources | to_nice_json }}\n"
    dest: "{{ ansible_env.HOME }}/.config/homelab-backup/sqlite-sources.json"
    mode: "0644"

# InfluxDB's admin token, kept out of the unit file and out of the process
# table: the wrapper sources this, the unit does not carry it.
- name: Install the backup environment file
  ansible.builtin.copy:
    content: |
      INFLUX_TOKEN={{ backup_secrets.INFLUX_TOKEN }}
    dest: "{{ ansible_env.HOME }}/.config/homelab-backup/env"
    mode: "0600"
  no_log: true

# The exclude list the twice-weekly cron jobs use. Taken over here because the
# new snapshot directories have to be excluded from them, and an exclude list
# that lives only on the host is the kind of thing that quietly stops matching
# what it is meant to exclude.
- name: Install the rclone exclude list
  ansible.builtin.copy:
    src: rclone_exclude.txt
    dest: "{{ backup_root | dirname }}/rclone_exclude.txt"
    mode: "0644"
    backup: true

- name: Install the backup scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - homelab-sqlite-backup
    - homelab-influx-backup
    - homelab-backup-run

- name: Install the systemd user units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - homelab-backup-hourly.service
    - homelab-backup-hourly.timer
    - homelab-backup-daily.service
    - homelab-backup-daily.timer
    - homelab-backup-weekly.service
    - homelab-backup-weekly.timer
  register: backup_units

- name: Reload the user manager when a unit changed
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  when: backup_units is changed

- name: Enable the timers
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - homelab-backup-hourly.timer
    - homelab-backup-daily.timer
    - homelab-backup-weekly.timer
  when: not ansible_check_mode
