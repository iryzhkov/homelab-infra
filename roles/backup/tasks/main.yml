---
# Backups this repository owns.
#
# - tiers.yml, where backup_sqlite_sources is set (homelab): hourly consistent
#   snapshots of the small SQLite databases, a daily InfluxDB archive, and the
#   weekly and monthly checks. The 2026-09-06 restore test showed the
#   twice-weekly rclone jobs covered these badly or not at all — SQLite files
#   copied live, and InfluxDB's named volumes copied by nothing.
# - nas_dump.yml, where backup_nas_dump is set (normandy): a daily dump of the
#   host's Postgres databases and a tar of its stack configuration onto the
#   NAS, which homelab then ships to Backblaze.
# - swarm.yml, on both Swarm workers: hourly snapshots of the stateful Swarm
#   stacks pinned to the worker, mirrored to the other worker over a
#   restricted rrsync key, and from homelab to Backblaze.
# - ship_schedule.yml, on the host that runs homelab-bulk-backup: the cron
#   schedule of each NAS dump's shipping job, taken from the dumping host's
#   backup_nas_dump.ship_cron.
#
# The other twice-weekly rclone jobs in homelab's crontab keep their schedules.

# Failures are pushed to the phone, not only posted to the feed.
- name: Install the notification client
  ansible.builtin.include_role:
    name: notify

- name: Gather the facts this role needs
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - env

- name: Install homelab's backup tiers
  ansible.builtin.include_tasks: tiers.yml
  when: backup_sqlite_sources is defined

- name: Install this host's NAS dump job
  ansible.builtin.include_tasks: nas_dump.yml
  when: backup_nas_dump is defined

- name: Install the Swarm stacks' snapshots and their peer copy
  ansible.builtin.include_tasks: swarm.yml
  when: inventory_hostname in groups.get('swarm_workers', [])

- name: Converge the shipping schedules of the NAS dumps
  ansible.builtin.include_tasks: ship_schedule.yml
  when: inventory_hostname == backup_bulk_shipper
