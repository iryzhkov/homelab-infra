---
- name: Inspect selected owned units before stage-only writes
  ansible.builtin.service_facts:
  when: >-
    not ansible_check_mode and not mission_control_activate | bool and
    (mission_control_enabled | bool or mission_control_reader_enabled | bool or mission_control_ingress_enabled | bool)
- name: Refuse stage-only updates of active or enabled selected units
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(item.unit, {}).get('state', 'stopped') not in ['running', 'active', 'activating', 'reloading']
      - ansible_facts.services.get(item.unit, {}).get('status', 'disabled') not in ['enabled', 'enabled-runtime']
    fail_msg: Use one complete stage, verify and activate invocation for warm updates.
    quiet: true
  loop:
    - {unit: mission-control-reader.service, selected: "{{ mission_control_reader_enabled }}"}
    - {unit: mission-control.service, selected: "{{ mission_control_enabled }}"}
    - {unit: mission-control-ingress.socket, selected: "{{ mission_control_ingress_enabled }}"}
    - {unit: mission-control-ingress.service, selected: "{{ mission_control_ingress_enabled }}"}
  when: not ansible_check_mode and not mission_control_activate | bool and item.selected | bool
- name: Configure the independent Normandy web service
  when: mission_control_enabled | bool and not ansible_check_mode
  block:
    - name: Require the exact web-only contract
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'omarchy-normandy'
          - mission_control_runtime_enabled | bool
          - mission_control_site_origin == 'https://chaldeas.ryzhkov.dev'
          - mission_control_cache_file == '/var/cache/mission-control/latest.json'
        quiet: true
    - name: Create the cache read group
      ansible.builtin.group:
        name: mission-control-cache
        system: true
    - name: Create the locked web identity without a home or helper
      ansible.builtin.user:
        name: mission-control
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        password_lock: true
        groups: mission-control-cache
        append: true
    - name: Create protected web configuration directory
      ansible.builtin.file:
        path: /etc/mission-control
        state: directory
        owner: root
        group: mission-control
        mode: "0750"
    - name: Write web-only configuration
      ansible.builtin.template:
        src: server.json.j2
        dest: /etc/mission-control/server.json
        owner: root
        group: mission-control
        mode: "0640"
      register: mission_control_config
    - name: Write the web unit
      ansible.builtin.template:
        src: mission-control.service.j2
        dest: /etc/systemd/system/mission-control.service
        owner: root
        group: root
        mode: "0644"
      register: mission_control_unit
- name: Configure only the explicitly enabled ingress
  ansible.builtin.include_tasks: ingress.yml
  when: mission_control_ingress_enabled | bool and not ansible_check_mode
- name: Explain deferred check-mode staging
  ansible.builtin.debug:
    msg: Check mode defers staging and SYSTEM verification; absent accounts and bytes are not qualified.
  when: ansible_check_mode and (mission_control_enabled | bool or mission_control_reader_enabled | bool or mission_control_ingress_enabled | bool)
