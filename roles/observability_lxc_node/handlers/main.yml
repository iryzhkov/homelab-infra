---
# Handler order is deliberate: apply firewall before restarting the listener.
- name: Refresh LXC metrics firewall
  ansible.builtin.systemd_service:
    name: observability-lxc-node-firewall.service
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Restart scoped LXC metrics exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode
