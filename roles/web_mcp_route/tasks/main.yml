---
# Deliberately does not include the broad traefik role.
- name: Manage only an explicitly selected endpoint route
  when: web_mcp_route_enabled | bool
  block:
    - name: Validate the bounded route contract before writes
      ansible.builtin.set_fact:
        web_mcp_edge: "{{ web_mcp_route | web_mcp_route_contract }}"

    - name: Require the existing file-provider path and resolver
      ansible.builtin.assert:
        that:
          - traefik_dynamic_dir is not defined or traefik_dynamic_dir == _web_mcp_route_directory
          - traefik_cert_resolver is not defined or traefik_cert_resolver == _web_mcp_route_resolver
        quiet: true

    - name: Guard the route directory and owned route file
      web_mcp_guard:
        kind: route
        service: "{{ web_mcp_edge.service }}"
        uid: "{{ web_mcp_edge.directory_uid }}"

    - name: Render the one selected HTTPS route
      ansible.builtin.template:
        src: route.yml.j2
        dest: "{{ _web_mcp_route_directory }}/web-mcp-{{ web_mcp_edge.service }}.yml"
        owner: "0"
        group: "0"
        mode: "0644"
      when: web_mcp_edge.state == 'present'

    - name: Remove only this owned route before backend retirement
      ansible.builtin.file:
        path: "{{ _web_mcp_route_directory }}/web-mcp-{{ web_mcp_edge.service }}.yml"
        state: absent
      when: web_mcp_edge.state == 'absent'
