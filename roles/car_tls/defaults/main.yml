---
# The car's dedicated certificate: exported on the edge named by
# car_tls_source (tasks/export.yml) and pulled onto homelab for pirene
# (tasks/pull.yml). See docs/car-tls.md. car_tls_domain, car_tls_source and
# car_tls_source_host_key are in group_vars/all.yml, because the Traefik route
# and the fleet SSH key use them too.

# On the source edge. lego, the ACME library inside Traefik, run on its own
# with Traefik's Cloudflare token (DNS-01) and its own account and state in
# car_tls_issue_dir. Traefik cannot issue this certificate itself: it skips any
# name a certificate in its store already covers, and the wildcard covers it.
car_tls_lego_image: goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
car_tls_issue_dir: /var/lib/car-tls-issue
car_tls_dns_env_file: "{{ stack_root }}/traefik/.env"
# The export directory is owned by the edge's login user, which is who the
# forced command runs as.
car_tls_export_dir: "{{ stack_root }}/traefik/export/car"

# On the consumer. pirene reads the certificate; the pull runs as pirene, so
# the files are pirene's without any chown.
car_tls_pull_user: pirene
car_tls_pull_dir: /etc/pirene/car-tls
car_tls_pull_state_dir: /var/lib/car-tls-pull
