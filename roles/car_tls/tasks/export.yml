---
# Issue and export the certificate on the source edge. A root service: lego's
# state and Traefik's .env are root's and igor's respectively, and the export
# hands the files to igor. Runs daily and at boot; lego renews only when due,
# and the export writes only when the certificate changed.

- name: Install the exporter
  become: true
  ansible.builtin.copy:
    src: car-tls-export
    dest: /usr/local/sbin/car-tls-export
    owner: root
    group: root
    mode: "0755"

# lego's ACME account key and the certificate's private key live here.
- name: Ensure lego's state directory exists
  become: true
  ansible.builtin.file:
    path: "{{ car_tls_issue_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure the export directory exists
  become: true
  ansible.builtin.file:
    path: "{{ car_tls_export_dir }}"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: "0700"

- name: Install the issuer's units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - car-tls-issue.service
    - car-tls-issue.timer
  register: car_tls_issue_units

- name: Reload systemd when a unit changed
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: car_tls_issue_units is changed

# In check mode the unit files were never written.
- name: Enable the issuer's timer
  become: true
  ansible.builtin.systemd_service:
    name: car-tls-issue.timer
    enabled: true
    state: started
  when: not ansible_check_mode
