---
# Fixed public registrations only. No issuer keys or automatic activation.
akasha_enrollment_registry_enabled: false
akasha_pc_global_reader_enabled: false
akasha_pc_quota_events_enabled: false
# Exact qualified route-capable host packet; no enrollment permission is implied.
akasha_route_host_qualified: false
akasha_route_host_version: ""
akasha_route_host_sha256: ""
# H score append and PC score read only; selected by the canary packet.
akasha_route_canary_enabled: false
akasha_enrollment_route_canary:
  - {"issuer":"chaldea:homelab","source":"route","host":"homelab","source_id":"route-homelab","profile":"route-service","project":"chaldea","mode":"service","kinds":["route_score_snapshot"]}
  - {"issuer":"chaldea:omarchy-pc","source":"route","host":"omarchy-pc","source_id":"route-omarchy-pc","profile":"route-service","project":"chaldea","mode":"service","kinds":["route_pick_changed"],"route_scores_read":true}
# Separate quota-only service sharing, not the seven-kind PC publisher.
akasha_quota_laptop_publisher_enabled: false
akasha_quota_pc_reader_enabled: false
akasha_enrollment_registry_additions:
  - {"issuer":"chaldea:agent-a","source":"feed","host":"agent-a","source_id":"agent-a--feed","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:agent-b","source":"feed","host":"agent-b","source_id":"agent-b--feed","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:agent-b","source":"agent-b.fleet","host":"agent-b","source_id":"agent-b--agent-b_fleet","profile":"fleet-timers","project":"chaldea","mode":"service","kinds":["job_finished"]}
  - {"issuer":"chaldea:agent-b","source":"agent-b.toolfeedback","host":"agent-b","source_id":"agent-b--agent-b_toolfeedback","profile":"toolfeedback","project":"chaldea","mode":"service","kinds":["tool_call"]}
  - {"issuer":"chaldea:omarchy-pc","source":"feed","host":"omarchy-pc","source_id":"omarchy-pc--feed","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:omarchy-pc","source":"omarchy-pc.fleet","host":"omarchy-pc","source_id":"omarchy-pc--omarchy-pc_fleet","profile":"fleet-timers","project":"chaldea","mode":"service","kinds":["job_finished"]}
  - {"issuer":"chaldea:omarchy-pc","source":"omarchy-pc.toolfeedback","host":"omarchy-pc","source_id":"omarchy-pc--omarchy-pc_toolfeedback","profile":"toolfeedback","project":"chaldea","mode":"service","kinds":["tool_call"]}
  - {"issuer":"chaldea:omarchy-macbook-air-igor","source":"feed","host":"omarchy-macbook-air-igor","source_id":"omarchy-macbook-air-igor--feed","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:omarchy-macbook-air-igor","source":"omarchy-macbook-air-igor.fleet","host":"omarchy-macbook-air-igor","source_id":"omarchy-macbook-air-igor--omarchy-macbook-air-igor_fleet","profile":"fleet-timers","project":"chaldea","mode":"service","kinds":["job_finished"]}
  - {"issuer":"chaldea:omarchy-macbook-air-igor","source":"omarchy-macbook-air-igor.toolfeedback","host":"omarchy-macbook-air-igor","source_id":"omarchy-macbook-air-igor--omarchy-macbook-air-igor_toolfeedback","profile":"toolfeedback","project":"chaldea","mode":"service","kinds":["tool_call"]}
  - {"issuer":"chaldea:homelab","source":"feed","host":"homelab","source_id":"homelab--feed","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:homelab","source":"backup","host":"homelab","source_id":"homelab--backup","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:homelab","source":"drift-check","host":"homelab","source_id":"homelab--drift-check","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
  - {"issuer":"chaldea:homelab","source":"offsite","host":"homelab","source_id":"homelab--offsite","profile":"feed-writer","project":"chaldea","mode":"service","kinds":["feed_post"]}
