# Homelab Akasha runtime; shared host is also021, independent clock stays0212.
# Official host-v0.2.21 at b5656fa; manifest digest verified against the downloaded archive.
# Independent root requires existing017/018 and matching cache pairs.
# Fleet collector also advances to021. Preserve existing017/018 rollback entries;
# the actual newest prior020 is retained too. Never install absent old versions.
# Require fresh root ownership, no-symlink and mtime evidence before every call.
# Never install missing old versions or alter mtimes to satisfy retention.
# The trust call uses its own list; never pass the runtime list as extra vars.
akasha_trust_preserve_versions: [host-v0.2.3, host-v0.2.4, host-v0.2.6, host-v0.2.7, host-v0.2.8, host-v0.2.9, host-v0.2.10, host-v0.2.14]
