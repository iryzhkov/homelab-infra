# Independent service/collector root avoids collecting any of the ten old releases.
akasha_runtime_release_root: /opt/chaldea-akasha-host/releases
akasha_runtime_cache: /var/cache/chaldea-akasha-host
akasha_host_version: host-v0.2.22
