---
# Source only. Never imported by site.yml; no default host selection.
- name: Require explicit inventory and one target alias
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refuse repository production inventory and implicit host patterns
      ansible.builtin.assert:
        that:
          - web_mcp_target | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
          - web_mcp_target | default('') in hostvars
          - ansible_inventory_sources | length == 1
          - ansible_inventory_sources[0] is match('^/')
          - (ansible_inventory_sources[0] | realpath) != ((playbook_dir ~ '/../inventory/hosts.yml') | realpath)
          - web_mcp_endpoint_enabled | default(false) | bool
        quiet: true

- name: Apply only the selected web-mcp-endpoint
  hosts: "{{ web_mcp_target | default('__web_mcp_no_target__') }}"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Refuse implicit scope even when a limit skips the controller play
      ansible.builtin.assert:
        that:
          - web_mcp_target | default('') is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
          - web_mcp_target | default('') in hostvars
          - ansible_play_hosts_all | length == 1
          - ansible_inventory_sources | length == 1
          - ansible_inventory_sources[0] is match('^/')
          - (ansible_inventory_sources[0] | realpath) != ((playbook_dir ~ '/../inventory/hosts.yml') | realpath)
          - web_mcp_endpoint_enabled | default(false) | bool
        quiet: true

    - name: Gather platform facts only after scope validation
      ansible.builtin.setup:
  roles:
    - web_mcp_endpoint
