---
# Isolated enrollment of the laptop's persistent Jocasta tooling identities:
# docs/authentik-machine-identities.md, "Isolated Jocasta tooling enrollment".
# Runs only roles/authentik_machine_identities, with its own blueprint and the
# declaration in vars/authentik-jocasta-tooling.yml. It never runs
# authentik_config, the access blueprint, the shared machine identities
# blueprint or any other host convergence. Run it on the laptop, which
# receives the two app-password files locally.
#
#   ansible-playbook playbooks/authentik-jocasta-tooling.yml --check --diff   # offline plan
#   ansible-playbook playbooks/authentik-jocasta-tooling.yml

- name: Enrol only the laptop's Jocasta tooling machine identities
  hosts: localhost
  connection: local
  gather_facts: false
  # As in playbooks/authentik.yml: the inventory's ansible_user is
  # "{{ ssh_user }}", which localhost lacks.
  vars:
    ssh_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
  vars_files:
    - vars/authentik-jocasta-tooling.yml
  pre_tasks:
    # Check mode stays offline unless explicitly asked for the read-only preflight.
    - name: Load only the existing controller API credential
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/authentik-api.sops.yaml"
        name: authentik_api
      no_log: true
      when: not ansible_check_mode or jocasta_tooling_online_check | default(false) | bool

    - name: Describe the API exactly as authentik_config does
      ansible.builtin.set_fact:
        authentik_url: "{{ authentik_api.authentik_api_url }}"
        authentik_headers:
          Authorization: "Bearer {{ authentik_api.authentik_api_token }}"
      no_log: true
      when: not ansible_check_mode or jocasta_tooling_online_check | default(false) | bool

    - name: Refuse API credentials for another Authentik origin
      ansible.builtin.assert:
        that: authentik_url | regex_replace('/api/v3/?$', '') == jocasta_tooling_authentik_origin
        quiet: true
      no_log: true
      when: not ansible_check_mode or jocasta_tooling_online_check | default(false) | bool
  tasks:
    - name: Enrol through the maintained ownership checks and private delivery
      ansible.builtin.include_role:
        name: authentik_machine_identities
