---
# Explicit provisioning only; no token generation and no service starts.
- name: Provision dedicated Akasha endpoint tokens on homelab
  hosts: homelab
  gather_facts: false
  become: true
  tasks:
    - name: Load existing Gatus alerting secrets on controller
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/gatus-alerting.sops.yaml"
        name: akasha_heartbeat_secrets
      delegate_to: localhost
      no_log: true

    - name: Require dedicated random endpoint tokens
      ansible.builtin.assert:
        that:
          - akasha_heartbeat_secrets[item] is match('^[0-9a-f]{64}$')
        quiet: true
      loop: [AKASHA_BACKUP_HEARTBEAT_TOKEN, AKASHA_OFFSITE_HEARTBEAT_TOKEN, AKASHA_HEALTH_HEARTBEAT_TOKEN]
      no_log: true

    - name: Install root-controlled endpoint token files
      ansible.builtin.copy:
        content: "{{ akasha_heartbeat_secrets['AKASHA_' ~ (item | upper) ~ '_HEARTBEAT_TOKEN'] }}\n"
        dest: "/etc/akasha/heartbeat-{{ item }}"
        owner: root
        group: "{{ 'root' if item == 'offsite' else 'akasha' }}"
        mode: "{{ '0600' if item == 'offsite' else '0640' }}"
        follow: false
        backup: false
      loop: [backup, offsite, health]
      no_log: true
      diff: false
