---
- name: Expose read-only steward worker health to Gatus
  hosts: normandy
  gather_facts: false
  tasks:
    - name: Create the health bridge directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.local/libexec"
        state: directory
        mode: "0755"

    - name: Install the health bridge
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/gatus-steward-health.py"
        dest: "/home/{{ ansible_user }}/.local/libexec/gatus-steward-health.py"
        mode: "0755"
      register: steward_health_script

    - name: Install the user service
      ansible.builtin.copy:
        dest: "/home/{{ ansible_user }}/.config/systemd/user/gatus-steward-health.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Read-only steward health for Gatus
          After=network-online.target t3-steward.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /home/{{ ansible_user }}/.local/libexec/gatus-steward-health.py --bind {{ ansible_host }} --steward /home/{{ ansible_user }}/.local/bin/t3-steward
          Restart=always
          RestartSec=5
          NoNewPrivileges=true

          [Install]
          WantedBy=default.target
      register: steward_health_unit

    - name: Permit LAN and Docker probes to reach the health bridge
      ansible.builtin.command:
        argv: [ufw, allow, from, "{{ item }}", to, any, port, "3003", proto, tcp]
      become: true
      loop: [192.168.70.0/24, 172.16.0.0/12]
      register: steward_health_firewall
      changed_when: "'Skipping' not in steward_health_firewall.stdout"

    - name: Start the health bridge
      ansible.builtin.systemd_service:
        name: gatus-steward-health.service
        scope: user
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if steward_health_script is changed or steward_health_unit is changed else 'started' }}"
