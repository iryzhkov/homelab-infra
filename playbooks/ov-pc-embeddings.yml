---
# Opt-in. Adds the dedicated f16 OpenViking embedding runtime on gaming-pc next to
# its main Ollama service, which this play never touches.
- name: Provide the PC GPU member of the OpenViking embedding pool
  hosts: gaming-pc
  gather_facts: false
  become: true
  vars:
    swarm_stack_src: "{{ playbook_dir }}/../stacks/openviking"
  roles:
    - ov_pc_embeddings
