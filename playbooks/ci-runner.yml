---
- name: Retire the homelab infrastructure self-hosted CI runner
  hosts: agent-a
  gather_facts: false
  become: true
  tasks:
    - name: Check for the repository-specific runner unit
      ansible.builtin.stat:
        path: /etc/systemd/system/actions-runner-homelab-infra-1.service
      register: retired_ci_runner_unit

    - name: Stop and disable only the retired repository runner
      ansible.builtin.systemd_service:
        name: actions-runner-homelab-infra-1.service
        enabled: false
        state: stopped
      when: retired_ci_runner_unit.stat.exists
