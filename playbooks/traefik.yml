---
# Generate Traefik's dynamic configuration from the inventory and install it.
#
# Check what would change without touching the edge proxy:
#   ansible-playbook playbooks/traefik.yml --check --diff
#
# scripts/compare-traefik.py compares the rendered routes against the
# hand-written files they replace, host by host, and is the thing to run before
# applying a change to routing.
#
# Every edge_proxy member gets the same configuration. A new member gets its
# certificate from playbooks/edge-bootstrap.yml first; see that file.

- name: Configure Traefik routing
  hosts: edge_proxy
  gather_facts: false
  roles:
    - traefik
