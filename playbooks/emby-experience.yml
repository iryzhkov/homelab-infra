---
# Reconcile native Emby preferences. No executable, service or plugin is installed.
- name: Configure native Emby browsing and playback
  hosts: homelab
  become: true
  gather_facts: false
  tasks:
    - name: Preview or reconcile the scoped native settings through Emby APIs
      ansible.builtin.command:
        argv: [/usr/bin/python3, "-"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/emby-experience.py') }}"
      environment:
        EMBY_EXPERIENCE_CONFIG: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/emby-experience.json') }}"
        EMBY_EXPERIENCE_OWNERSHIP: "{{ emby_experience_owned_rows | default({}) | to_json }}"
        EMBY_EXPERIENCE_APPLY: "{{ (not ansible_check_mode) | ternary('true', 'false') }}"
      check_mode: false
      register: emby_experience_result
      changed_when: (emby_experience_result.stdout | from_json).changed | int > 0
      no_log: true

    - name: Show credential-free configuration summary
      ansible.builtin.debug:
        msg: "{{ emby_experience_result.stdout | from_json }}"
