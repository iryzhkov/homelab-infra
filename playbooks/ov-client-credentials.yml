---
# Standalone, source-only. Nothing in site.yml selects this playbook.
- name: Update only explicitly selected local OV wrapper bindings
  hosts: "{{ ov_client_hosts | default([]) }}"
  gather_facts: false
  become: false
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require exact standalone inventory and explicit activation inputs
      ansible.builtin.assert:
        that:
          - ov_client_enabled | default(false) | bool
          - ov_client_hosts is sequence and ov_client_hosts is not string
          - ov_client_hosts | length > 0
          - ov_client_hosts | unique | length == ov_client_hosts | length
          - ov_client_hosts | select('match', '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$') | list | length == ov_client_hosts | length
          - groups['all'] | sort == ov_client_hosts | sort
          - inventory_hostname in ov_client_hosts
          - ansible_inventory_sources | length == 1
          - ansible_inventory_sources[0] is match('^/')
          - not (ansible_inventory_sources[0] | realpath).startswith((playbook_dir ~ '/../inventory/' | realpath) ~ '/')
          - ov_client_generation | default('') is match('^[a-z0-9][a-z0-9-]{0,63}$')
          - ov_client_action | default('install') in ['install', 'restore']
          - ov_client_backend | default('') in ['keyfile', 'keyring']
        quiet: true

    - name: Validate protected controller source without revealing it
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('file', playbook_dir ~ '/../scripts/ov-client-credentials.py') }}"
          - --check-source
          - --source
          - "{{ ov_client_key_source | default('') }}"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      diff: false
      when: ov_client_action | default('install') == 'install'

  tasks:
    - name: Preview or apply the guarded existing live credential source change
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '-c', lookup('file', playbook_dir ~ '/../scripts/ov-client-credentials.py'),
              '--host', inventory_hostname, '--generation', ov_client_generation,
              '--action', ov_client_action | default('install'), '--backend', ov_client_backend]
             + (ov_client_hosts | map('regex_replace', '^', '--approved-host=') | list)
             + (['--stdin-key'] if ov_client_action | default('install') == 'install' else [])
             + (['--apply'] if ov_client_apply | default(false) | bool and not ansible_check_mode else []) }}
        stdin: "{{ lookup('file', ov_client_key_source) if ov_client_action | default('install') == 'install' else '' }}"
        stdin_add_newline: false
      register: ov_client_result
      changed_when: (ov_client_result.stdout | from_json).changed and ov_client_apply | default(false) | bool and not ansible_check_mode
      check_mode: false
      no_log: true
      diff: false

    - name: Report only nonsecret outcome
      ansible.builtin.debug:
        msg: "{{ ov_client_result.stdout | from_json }}"
