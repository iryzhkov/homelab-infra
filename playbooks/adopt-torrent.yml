---
# One-time teardown of the Portainer-era torrent stack on Black Pearl.
#
# The stack used to run as Compose project "1" out of
# /var/lib/docker/volumes/portainer_data/_data/compose/1, left behind by the
# Portainer removed in the 2026-08-30 cleanup. It now runs as project "torrent"
# from ~/apps/torrent; playbooks/site.yml deploys it like any other stack.
#
# This playbook only stops the old project, because two Compose projects cannot
# both publish port 8080. It was run on 2026-09-06 and is a no-op since. Kept
# because rebuilding that VM from a backup taken before that date would restore
# the old project, and this is how it is taken out of the way again.
#
# Order matters: run this first, then playbooks/site.yml -l blackpearl.

- name: Stop the Portainer-era torrent project
  hosts: blackpearl
  gather_facts: false

  vars:
    old_project_dir: /var/lib/docker/volumes/portainer_data/_data/compose/1

  tasks:
    - name: Check whether the old project is still running
      ansible.builtin.command:
        cmd: docker compose ls --format json
      changed_when: false
      register: compose_ls

    - name: Stop the old project
      ansible.builtin.command:
        cmd: >-
          sudo -n docker compose --project-name 1
          --project-directory {{ old_project_dir }}
          -f {{ old_project_dir }}/docker-compose.yml down
      when: "'\"Name\":\"1\"' in (compose_ls.stdout | regex_replace('\\s', ''))"
      changed_when: true
