---
# The signer alias omarchy-normandy targets the same VM as inventory normandy.
# Key generation and durable-state initialization are explicit operator actions.
- name: Install pinned signing runtime and publisher on Normandy
  hosts: chaldea_publishers
  gather_facts: false
  become: true
  vars_files: [../vars/chaldea-runtime.yml]
  roles:
    - chaldea_node
    - chaldea_host_artifact
    - chaldea_publisher
