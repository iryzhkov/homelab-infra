---
# The signer alias omarchy-normandy targets the same VM as inventory normandy.
# Key generation and durable-state initialization are explicit operator actions.
- name: Install pinned signing runtime and publisher on Normandy
  hosts: chaldea_publishers
  gather_facts: false
  become: true
  vars_files: [../vars/chaldea-runtime.yml]
  roles:
    - chaldea_node
    # The publisher runs its own pinned release, not the shared consumer pin.
    # The shared release (installed by the consumer trust play and fleet-config)
    # lives in the same root and is preserved from this call's release GC.
    - role: chaldea_host_artifact
      vars:
        chaldea_host_version: "{{ chaldea_publisher_host_version }}"
        chaldea_host_sha256: "{{ chaldea_publisher_host_sha256 }}"
        chaldea_host_artifact_preserve_versions: "{{ chaldea_publisher_preserve_versions }}"
    - chaldea_publisher
