---
- name: Configure size limits and original-audio profiles
  hosts: homelab
  become: true
  gather_facts: false
  tasks:
    - name: Reconcile profiles using protected local API credentials
      ansible.builtin.script:
        cmd: "../scripts/media-quality-policy.py {{ '--check' if ansible_check_mode else '--apply' }}"
        executable: /usr/bin/python3
      check_mode: false
      no_log: true
      register: media_quality_policy
      changed_when: (media_quality_policy.stdout | from_json).changed | bool

    - name: Show credential-free policy summary
      ansible.builtin.debug:
        msg: "{{ media_quality_policy.stdout | from_json }}"
