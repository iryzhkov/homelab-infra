---
# Homelab only, controlled from omarchy-pc. No site, fleet, keys or edge rollout.
- name: Akasha host service definitions
  hosts: homelab
  gather_facts: false
  become: true
  vars_files:
    - ../vars/chaldea-runtime.yml
    - ../vars/akasha-runtime.yml
    - ../vars/akasha-registry.yml
    - ../vars/akasha-enrollment-registry.yml
  pre_tasks:
    # Artifact qualification permits upgrades; laptop permission remains separately selected.
    # Compatibility still requires the operator's exact qualified artifact packet.
    - name: Require the qualified host for Mission Control reader registrations
      ansible.builtin.assert:
        that:
          - >-
            (not mission_control_laptop_permission | bool and akasha_host_version == 'host-v0.2.4') or
            (mission_control_laptop_qualified | bool and
             mission_control_laptop_host_version is match('^host-v[0-9]+[.][0-9]+[.][0-9]+$') and
             mission_control_laptop_host_version != 'host-v0.2.4' and
             mission_control_laptop_host_sha256 is match('^[a-f0-9]{64}$') and
             akasha_host_version == mission_control_laptop_host_version and
             akasha_host_sha256 == mission_control_laptop_host_sha256)
        fail_msg: Mission Control registrations require the exact qualified host packet, with a new qualified artifact for the laptop.
        quiet: true
      when: >-
        (akasha_registry + (akasha_enrollment_registry_additions
         if akasha_enrollment_registry_enabled | bool else []))
        | selectattr('mission_control_read_sources', 'defined') | list | length > 0
      tags: [always]
    - name: Require the qualified four-source packet for Mission Control operations reads
      ansible.builtin.assert:
        that:
          - mission_control_reader_operations_enabled is boolean
          - >-
            not mission_control_reader_operations_enabled or
            (akasha_enrollment_registry_enabled | bool and mission_control_pc_permission | bool and
             mission_control_agent_b_permission | bool and mission_control_laptop_permission | bool and
             mission_control_laptop_qualified | bool and
             akasha_host_version is match('^host-v[0-9]+[.][0-9]+[.][0-9]+$') and
             akasha_host_version | regex_replace('^host-v', '') is version('0.2.9', '>='))
        fail_msg: Operations reads require all four status sources and a qualified compatible host.
        quiet: true
      tags: [always]
    - name: Compose explicitly enabled fixed enrollment registrations
      ansible.builtin.set_fact:
        akasha_registry: >-
          {{ akasha_registry +
             ((akasha_enrollment_registry_additions | rejectattr('profile', 'equalto', 'mission-control-reader') | list)
              + akasha_enrollment_pc_mission_control if mission_control_pc_permission | bool else akasha_enrollment_registry_additions)
             + (akasha_enrollment_pc_reader if akasha_pc_global_reader_enabled | bool else [])
             + (akasha_enrollment_pc_quota if akasha_pc_quota_events_enabled | bool else [])
             + (akasha_enrollment_quota_laptop_publisher if akasha_quota_laptop_publisher_enabled | bool else [])
             + (akasha_enrollment_quota_pc_reader if akasha_quota_pc_reader_enabled | bool else []) }}
      when: akasha_enrollment_registry_enabled | bool
      tags: [always]
    - name: Compose separately selected remaining agent status registrations
      ansible.builtin.set_fact:
        akasha_registry: >-
          {{ (akasha_registry | rejectattr('profile', 'equalto', 'mission-control-reader') | list)
             + (akasha_enrollment_agent_b_mission_control if mission_control_agent_b_permission | bool else [])
             + (akasha_enrollment_laptop_mission_control if mission_control_laptop_permission | bool else [])
             + [(akasha_enrollment_registry_additions | selectattr('profile', 'equalto', 'mission-control-reader') | first)
                | combine({'mission_control_read_sources': ['agent-a--mission-control']
                  + (['omarchy-pc--mission-control'] if mission_control_pc_permission | bool else [])
                  + (['agent-b--mission-control'] if mission_control_agent_b_permission | bool else [])
                  + (['omarchy-macbook-air-igor--mission-control'] if mission_control_laptop_permission | bool else [])})] }}
      when: akasha_enrollment_registry_enabled | bool and (mission_control_agent_b_permission | bool or mission_control_laptop_permission | bool)
      tags: [always]
    # Same reader row and sources; only the flag and two read kinds are added.
    - name: Compose the approved Mission Control operations reader scope
      ansible.builtin.set_fact:
        akasha_registry: >-
          {{ (akasha_registry | rejectattr('profile', 'equalto', 'mission-control-reader') | list)
             + [(akasha_registry | selectattr('profile', 'equalto', 'mission-control-reader') | first)
                | combine({'kinds': ['agent_status', 'job_finished', 'report'], 'mission_control_operations_read': true})] }}
      when: mission_control_reader_operations_enabled
      tags: [always]
  roles:
    - {role: chaldea_node, tags: [runtime]}
    - role: chaldea_host_artifact
      tags: [runtime]
      vars:
        chaldea_host_version: "{{ akasha_host_version }}"
        chaldea_host_sha256: "{{ akasha_host_sha256 }}"
    - role: chaldea_access_trust
      vars:
        chaldea_host_artifact_preserve_versions: "{{ akasha_trust_preserve_versions }}"
      when: chaldea_access_trust_enabled | bool
      tags: [trust]
    - role: akasha
      vars:
        chaldea_host_version: "{{ akasha_host_version }}"
