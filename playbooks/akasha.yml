---
# Homelab only, controlled from omarchy-pc. No site, fleet, keys or edge rollout.
- name: Akasha host service definitions
  hosts: homelab
  gather_facts: false
  become: true
  vars_files:
    - ../vars/chaldea-runtime.yml
    - ../vars/akasha-runtime.yml
    - ../vars/akasha-registry.yml
    - ../vars/akasha-enrollment-registry.yml
  pre_tasks:
    - name: Require a compatible qualified host for the FATE canary
      ansible.builtin.assert:
        that:
          - akasha_route_canary_enabled is boolean
          - >-
            not akasha_route_canary_enabled or
            (akasha_enrollment_registry_enabled | bool and
             akasha_route_host_qualified | bool and
             akasha_host_version is match('^host-v[0-9]+[.][0-9]+[.][0-9]+$') and
             akasha_host_version | regex_replace('^host-v', '') is version('0.2.15', '>=') and
             akasha_host_version == akasha_route_host_version and
             akasha_host_sha256 == akasha_route_host_sha256)
        fail_msg: FATE canary registrations require enrollment and the exact qualified route-capable host packet.
        quiet: true
      tags: [always]
    - name: Compose explicitly enabled fixed enrollment registrations
      ansible.builtin.set_fact:
        akasha_registry: >-
          {{ akasha_registry +
             akasha_enrollment_registry_additions
             + (akasha_enrollment_pc_reader if akasha_pc_global_reader_enabled | bool else [])
             + (akasha_enrollment_pc_quota if akasha_pc_quota_events_enabled | bool else [])
             + (akasha_enrollment_quota_laptop_publisher if akasha_quota_laptop_publisher_enabled | bool else [])
             + (akasha_enrollment_quota_pc_reader if akasha_quota_pc_reader_enabled | bool else []) }}
      when: akasha_enrollment_registry_enabled | bool
      tags: [always]
    - name: Compose the approved H and PC FATE service registrations
      ansible.builtin.set_fact:
        akasha_registry: "{{ akasha_registry + akasha_enrollment_route_canary }}"
      when: akasha_route_canary_enabled
      tags: [always]
  roles:
    - {role: chaldea_node, tags: [runtime]}
    - role: chaldea_host_artifact
      tags: [runtime]
      vars:
        chaldea_host_version: "{{ akasha_host_version }}"
        chaldea_host_sha256: "{{ akasha_host_sha256 }}"
        chaldea_host_artifact_release_root: "{{ akasha_runtime_release_root }}"
        chaldea_host_artifact_cache: "{{ akasha_runtime_cache }}"
        # Collectors still execute016; retain018 explicitly for rollback.
        chaldea_host_artifact_preserve_versions: [host-v0.2.16, host-v0.2.18]
    - role: chaldea_access_trust
      vars:
        chaldea_host_artifact_preserve_versions: "{{ akasha_trust_preserve_versions }}"
      when: chaldea_access_trust_enabled | bool
      tags: [trust]
    - role: akasha
      vars:
        chaldea_host_version: "{{ akasha_host_version }}"
        chaldea_host_artifact_root: "{{ akasha_runtime_release_root }}/{{ akasha_host_version }}/host"
