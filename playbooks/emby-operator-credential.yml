---
# Explicit, opt-in provisioning, rotation and retirement of the protected Emby
# operator credential for the retained Igor operator root on homelab. Nothing in
# site.yml selects this playbook. The default action is a metadata-only check
# that never decrypts the secret, never reads the credential or the journal and
# never changes the host. See docs/emby-operator-credential-provisioning.md.
- name: Manage the protected Emby operator credential on homelab
  hosts: homelab
  gather_facts: false
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require the pinned host and one explicit bounded action
      ansible.builtin.assert:
        that:
          - emby_operator_credential_helper is not defined
          - emby_operator_credential_argv is not defined
          - emby_operator_credential_applying is not defined
          - emby_operator_secret is not defined
          - emby_operator_credential_apply | default(false) is boolean
          - inventory_hostname == 'homelab'
          - ansible_play_hosts_all == ['homelab']
          - emby_operator_credential_action | default('check') in ['check', 'provision', 'rotate', 'retire']
          - >-
            emby_operator_credential_action | default('check') != 'check'
            or not emby_operator_credential_apply | default(false) | bool
          - >-
            emby_operator_credential_action | default('check') not in ['rotate', 'retire']
            or emby_operator_credential_expect | default('') is match('^(absent|[0-9]+:[0-9]+:[0-9]+)$')
        fail_msg: >-
          Use action check, provision, rotate or retire; check never applies, and
          rotate or retire need emby_operator_credential_expect from a reviewed check.
        quiet: true

  tasks:
    # Pins the host, root, scope and action preconditions before any decryption.
    - name: Check the pinned operator root and action preconditions without a secret
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/python3', '-I', '-c',
            lookup('file', playbook_dir ~ '/../scripts/emby-operator-credential.py'),
            '--action', emby_operator_credential_action | default('check')]
           + (['--expect-credential-id', emby_operator_credential_expect | default('')]
              if emby_operator_credential_action | default('check') in ['rotate', 'retire'] else []) }}
      register: emby_operator_credential_check
      changed_when: false
      check_mode: false

    - name: Report the nonsecret operator credential state
      ansible.builtin.debug:
        msg: "{{ emby_operator_credential_check.stdout | from_json }}"

    - name: Load only the dedicated operator credential on the controller
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/emby-operator.sops.yaml"
        name: emby_operator_secret
      no_log: true
      when:
        - emby_operator_credential_apply | default(false) | bool and not ansible_check_mode
        - emby_operator_credential_action | default('check') in ['provision', 'rotate']

    - name: Require the dedicated secret to hold only the pinned identity
      ansible.builtin.assert:
        that:
          - emby_operator_secret is mapping
          - emby_operator_secret.keys() | list | sort == ['password', 'username']
          - emby_operator_secret.username == 'igor'
          - emby_operator_secret.password is string
          - emby_operator_secret.password | length >= 1
          - emby_operator_secret.password | length <= 1024
        quiet: true
      no_log: true
      when:
        - emby_operator_credential_apply | default(false) | bool and not ansible_check_mode
        - emby_operator_credential_action | default('check') in ['provision', 'rotate']

    # The secret travels only on the helper's standard input, never in argv.
    - name: Apply the explicitly selected bounded action
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/bin/python3', '-I', '-c',
            lookup('file', playbook_dir ~ '/../scripts/emby-operator-credential.py'),
            '--action', emby_operator_credential_action | default('check')]
           + (['--expect-credential-id', emby_operator_credential_expect | default('')]
              if emby_operator_credential_action | default('check') in ['rotate', 'retire'] else []) + ['--apply'] }}
        stdin: >-
          {{ {'username': emby_operator_secret.username, 'password': emby_operator_secret.password} | to_json
             if emby_operator_credential_action | default('check') in ['provision', 'rotate'] else omit }}
        stdin_add_newline: false
      register: emby_operator_credential_result
      changed_when: false
      failed_when: false
      no_log: true
      diff: false
      when: emby_operator_credential_apply | default(false) | bool and not ansible_check_mode

    - name: Report only the nonsecret helper outcome
      ansible.builtin.assert:
        that:
          - emby_operator_credential_result.rc == 0
        fail_msg: "{{ emby_operator_credential_result.stderr }}"
        success_msg: "{{ emby_operator_credential_result.stdout }}"
      changed_when: >-
        emby_operator_credential_result.rc == 0
        and (emby_operator_credential_result.stdout | from_json).changed
      when: emby_operator_credential_apply | default(false) | bool and not ansible_check_mode
