---
# Configuration only: no worker, receiver, timer or application code is installed.
# Previously applied settings with zero cleanup days are an accepted earlier
# state and are moved to the configured retention.
- name: Preserve replaced media using the existing arr recycle bins
  hosts: homelab
  become: true
  gather_facts: false
  tasks:
    - name: Require the real NAS mount before creating recovery directories
      ansible.builtin.command:
        argv: [findmnt, -n, -o, FSTYPE, --mountpoint, /mnt/shared]
      register: media_recovery_mount
      changed_when: false
      check_mode: false

    - name: Refuse local fallback storage
      ansible.builtin.assert:
        that: media_recovery_mount.stdout in ['nfs', 'nfs4']

    # Removed media stays recoverable for 30 days, then Arr empties its recycle
    # bin. The bins share the NFS volume, so zero days (keep forever) would
    # free nothing when the HoloNet library prune removes titles.
    - name: Configure independent recycle paths with 30-day automatic expiry
      ansible.builtin.include_tasks: media-recovery-app.yml
      vars:
        media_recovery_cleanup_days: 30
      loop:
        - {name: sonarr, stack: sonarr-tv, port: 8989, recycle: /mnt/shared/.recycle/sonarr}
        - {name: radarr, stack: radarr-movie, port: 7878, recycle: /mnt/shared/holonet-recycle/radarr}
      loop_control:
        loop_var: media_recovery_app
        label: "{{ media_recovery_app.name }}"
