---
# Isolated enrollment of the OV HTTP a63e197f machine identities:
# docs/authentik-machine-identities.md, "Isolated OV HTTP identities".
# Runs only roles/authentik_machine_identities, with the existing owned OV
# blueprint and the declaration in vars/authentik-ov-http-identities.yml. It
# never runs authentik_config, the access blueprint, the shared or Jocasta
# machine identity blueprints or any other host convergence.
#
# Use an operator inventory outside this repository that defines exactly the
# declared hosts (controller, laptop) with their real connections. The laptop
# receives two separate credentials: the limited Chaldea preset's and the
# ordinary interactive Codex helper's. Every
# destination is checked against its machine and UID binding before Authentik
# changes. Off unless explicitly requested:
#
# The prepared full interactive declaration (vars/authentik-ov-http-full-interactive.yml)
# is selected only by adding -e ov_http_identities_full_interactive=true to
# these commands; its operator inventory also defines omarchy-pc.
#
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-ov-http-identities.yml --check --diff
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-ov-http-identities.yml --check --diff \
#     -e ov_http_identities_online_check=true -e @PROTECTED_BASELINE
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-ov-http-identities.yml \
#     -e ov_http_identities_apply=true -e @PROTECTED_BASELINE

- name: Enrol only the owned OV HTTP a63e197f machine identities
  hosts: localhost
  connection: local
  gather_facts: false
  # As in playbooks/authentik.yml: the inventory's ansible_user is
  # "{{ ssh_user }}", which localhost lacks.
  vars:
    ssh_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
  vars_files:
    - vars/authentik-ov-http-identities.yml
  pre_tasks:
    - name: Require an explicit apply outside check mode
      ansible.builtin.assert:
        that: ansible_check_mode or (ov_http_identities_apply | default(false) | bool)
        fail_msg: Real runs need -e ov_http_identities_apply=true; use --check for the plan.
        quiet: true

    # The only alternative declaration is the reviewed source file; the guard
    # below still checks every value literally.
    - name: Select the prepared full interactive declaration only when explicitly requested
      ansible.builtin.include_vars:
        file: vars/authentik-ov-http-full-interactive.yml
      when: ov_http_identities_full_interactive | default(false) | bool

    - name: Require explicit full mode and a closed operator personal grant
      ansible.builtin.assert:
        that:
          - ov_http_identities_full_interactive | default(false) | bool
          - ov_http_identities_personal_grant is defined
        quiet: true
      when: ov_http_identities_personal | default(false) | bool

    - name: Add personal authority only to the two full interactive declarations
      ansible.builtin.set_fact:
        authentik_machine_services: >-
          {{ {'ov': authentik_machine_services.ov | combine(
          {'scope': authentik_machine_services.ov.scope ~
          ' ov.personal.memory.read ov.personal.memory.write ov.personal.session.read ov.personal.session.create ov.personal.session.append'})} }}
        authentik_machine_identities: >-
          {{ authentik_machine_identities[:3] +
          (authentik_machine_identities[3:] | map('combine',
          {'ov_personal': ov_http_identities_personal_grant}) | list) }}
      no_log: true
      when: ov_http_identities_personal | default(false) | bool

    # Literal values, so an extra-vars file cannot drop or change the existing
    # canary reader or the limited laptop identity, add another account, or
    # widen this run beyond the one owned OV application and its single node.
    # The full interactive mode admits exactly the two declared resource-root
    # accounts and the application's four fixed scopes, nothing else.
    - name: Preserve the existing OV application and controller identity exactly
      vars:
        ov_full: "{{ ov_http_identities_full_interactive | default(false) | bool }}"
      ansible.builtin.assert:
        that:
          - authentik_machine_identities_enabled | bool
          - authentik_machine_identity_existing_owned_only | bool
          - authentik_machine_identities_blueprint_name == 'homelab-infra ov http a63e197f identities'
          - authentik_machine_services.keys() | list == ['ov']
          - >-
            (authentik_machine_services.ov | dict2items | rejectattr('key', 'in', ['issuer', 'jwks_url'])
            | items2dict) == {'state': 'present', 'slug': 'ov-http-a63e197f',
            'name': 'OV HTTP a63e197f machine access', 'group': 'ov-http-a63e197f-machine-identities',
            'client_id': 'ov-http-a63e197f-machine', 'resource': 'https://ov.mcp.ryzhkov.dev/mcp',
            'signing_key': '8bbd6516-af33-4e64-a73b-caa39e692c29',
            'scope': (('ov.read ov.write ov.remove ov.maintain' if ov_full | bool else 'ov.read') ~
            (' ov.personal.memory.read ov.personal.memory.write ov.personal.session.read ov.personal.session.create ov.personal.session.append'
            if ov_http_identities_personal | default(false) | bool else '')), 'token_seconds': 300}
          - >-
            authentik_machine_identities | selectattr('host', 'equalto', 'controller') | list ==
            [{'host': 'controller', 'profile': 'ov-http-a63e197f-reader', 'service': 'ov',
              'ov_namespaces': ['viking://resources/homeassistant-api/rest-api.md'],
              'generation': 1, 'expires': '2027-01-15T00:00:00Z', 'state': 'present'}]
          - >-
            authentik_machine_identities | selectattr('profile', 'equalto', 'ov-tooling-codex') | list ==
            [{'host': 'laptop', 'profile': 'ov-tooling-codex', 'service': 'ov',
              'ov_namespaces': ['viking://resources/homeassistant-api/rest-api.md'],
              'generation': 1, 'expires': '2027-01-15T00:00:00Z', 'state': 'present'}]
          # The separate ordinary interactive laptop account: its generation,
          # expiry and state follow the role's own lifecycle rules, but its
          # host, service and single node are fixed.
          - >-
            authentik_machine_identities | map(attribute='profile') | list ==
            ['ov-http-a63e197f-reader', 'ov-tooling-codex', 'ov-interactive-codex']
            + (['ov-full-interactive', 'ov-full-interactive'] if ov_full | bool else [])
          - >-
            (authentik_machine_identities[2:3] | map('dict2items')
            | map('rejectattr', 'key', 'in', ['generation', 'expires', 'state'])
            | map('list') | map('items2dict') | list) ==
            [{'host': 'laptop', 'profile': 'ov-interactive-codex', 'service': 'ov',
              'ov_namespaces': ['viking://resources/homeassistant-api/rest-api.md']}]
          # One resource-root account per selected host, all four actions.
          - >-
            (authentik_machine_identities[3:] | map('dict2items')
            | map('rejectattr', 'key', 'in', ['generation', 'expires', 'state', 'ov_personal'])
            | map('list') | map('items2dict') | list) ==
            ([{'host': 'laptop', 'profile': 'ov-full-interactive', 'service': 'ov',
               'ov_namespaces': ['viking://resources'],
               'ov_actions': ['read', 'write', 'remove', 'maintain']},
              {'host': 'omarchy-pc', 'profile': 'ov-full-interactive', 'service': 'ov',
               'ov_namespaces': ['viking://resources'],
               'ov_actions': ['read', 'write', 'remove', 'maintain']}] if ov_full | bool else [])
          - >-
            (authentik_machine_identities | selectattr('ov_personal', 'defined') | list | length) ==
            (2 if ov_http_identities_personal | default(false) | bool else 0)
          - authentik_machine_identity_destinations | default({}) | length > 0
        fail_msg: >-
          This entrypoint only adds to the existing owned OV application and keeps
          its controller identity present and unchanged, with every destination bound.
          The limited laptop identity stays unchanged and the only other account is
          the laptop's interactive OV identity on the same single node, plus, only in
          the explicit full interactive mode, one resource-root account each for
          laptop and omarchy-pc.
        quiet: true

    # Check mode stays offline unless explicitly asked for the read-only preflight.
    - name: Load only the existing controller API credential
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/authentik-api.sops.yaml"
        name: authentik_api
      no_log: true
      when: not ansible_check_mode or ov_http_identities_online_check | default(false) | bool

    - name: Describe the API exactly as authentik_config does
      ansible.builtin.set_fact:
        authentik_url: "{{ authentik_api.authentik_api_url }}"
        authentik_headers:
          Authorization: "Bearer {{ authentik_api.authentik_api_token }}"
      no_log: true
      when: not ansible_check_mode or ov_http_identities_online_check | default(false) | bool

    - name: Refuse API credentials for another Authentik origin
      ansible.builtin.assert:
        that: authentik_url | regex_replace('/api/v3/?$', '') == ov_http_identities_authentik_origin
        quiet: true
      no_log: true
      when: not ansible_check_mode or ov_http_identities_online_check | default(false) | bool
  tasks:
    - name: Enrol through the maintained ownership checks and bound private delivery
      ansible.builtin.include_role:
        name: authentik_machine_identities
