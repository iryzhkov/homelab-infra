---
# Converge every host's Compose stacks to what this repository says they are.
#
# Adoption is expected to be a no-op: the repository holds a byte-identical copy
# of the Compose file that is already running, and a .env whose values match, so
# `docker compose up -d` finds nothing to change. A reported change on a stack
# that has already been adopted means the host drifted, or someone edited a file
# in place.
#
# Run one stack at a time while adopting:
#   ansible-playbook playbooks/site.yml -l homelab -e 'only=vaultwarden'
#
# A stack named by any swarm_stacks_* entry (inventory/group_vars/swarm/) runs
# as a Swarm stack, deployed by playbooks/swarm.yml, and is skipped here even
# though its host_vars entry stays until the phase 5 cleanup: converging it
# would bring back the Compose project its cutover retired, and with it a
# second claim on the same published ports.

#
# Two plays with the same tasks (a YAML anchor): every Docker host except the
# edge proxies at once, then the edge proxies one at a time, so a change to
# Traefik's static configuration never restarts both edges together and the
# VIP always has a live Traefik to move to.

- name: Deploy Compose stacks
  hosts: docker_hosts:!edge_proxy
  gather_facts: false

  vars: &site_vars
    site_swarm_stack_names: "{{ hostvars | swarm_stack_names(groups) }}"

  tasks: &site_tasks
    - name: Deploy each stack
      ansible.builtin.include_role:
        name: compose_stack
      loop: >-
        {{ ((stacks | default([]) | selectattr('name', 'equalto', only) | list)
            if only is defined else (stacks | default([])))
           | rejectattr('name', 'in', site_swarm_stack_names) | list }}
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"

    # A targeted deploy updates only its entry in an existing complete manifest.
    # This avoids reconverging unrelated stacks merely to register a new service.
    # A targeted run naming a Swarm stack deploys nothing and removes the
    # stack's entry, so the drift check stops expecting its Compose project.
    # So does a targeted run naming a movable Compose stack (compose_placement)
    # on a host it is not placed on: after a move, the old host stops
    # expecting it.
    - name: Update the existing manifest after a targeted deployment
      when:
        - only is defined
        - drift_check_enabled | default(false)
        - >-
          drift_manifest_stacks | default([]) | length > 0
          or only in site_swarm_stack_names
          or only in compose_placement | default({})
      block:
        - name: Locate the existing drift manifest
          ansible.builtin.stat:
            path: "{{ stack_root | dirname }}/.local/share/homelab-infra/drift-manifest.json"
          register: targeted_manifest_stat

        - name: Read the existing drift manifest
          ansible.builtin.slurp:
            src: "{{ targeted_manifest_stat.stat.path }}"
          register: targeted_manifest_file
          when: targeted_manifest_stat.stat.exists

        - name: Preserve other stacks and update the deployed entry
          ansible.builtin.copy:
            content: >-
              {{ (targeted_manifest_file.content | b64decode | from_json)
                 | combine({'stacks':
                   (((targeted_manifest_file.content | b64decode | from_json).stacks
                     | rejectattr('name', 'equalto', only) | list)
                    + drift_manifest_stacks | default([])) | sort(attribute='name')})
                 | to_nice_json }}
            dest: "{{ targeted_manifest_stat.stat.path }}"
            mode: "0644"
          when: targeted_manifest_stat.stat.exists

    - name: Install the Authentik watchdog
      ansible.builtin.include_role:
        name: authentik_watchdog
      when: authentik_watchdog_enabled | default(false)

    # After the stacks, so the manifest describes the deploy that just ran.
    # Skipped when the run was limited to one stack with `only`, because the
    # manifest would then describe that stack alone.
    - name: Install the drift check
      ansible.builtin.include_role:
        name: drift_check
      when:
        - drift_check_enabled | default(false)
        - only is not defined

- name: Deploy Compose stacks on the edge proxies, one at a time
  hosts: edge_proxy:&docker_hosts
  serial: 1
  gather_facts: false
  vars: *site_vars
  tasks: *site_tasks
