---
# Update observers only; retain manifests from the actual stack/SSO deployments.
# Every host with drift_check_enabled is listed. public-api does not report on
# its own (homelab runs its checker over SSH), but its installed checker and
# registry decide its findings, so it needs the same update.
- name: Install drift observation and reviewed standalone ownership
  hosts: homelab:normandy:public-api
  gather_facts: true
  tasks:
    - name: Install observer files without redeploying applications or credentials
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - src: ../roles/drift_check/files/homelab-drift-check
          dest: .local/bin/homelab-drift-check
          mode: "0755"
        - src: ../roles/drift_check/files/drift-owners.json
          dest: .local/share/homelab-infra/drift-owners.json
          mode: "0644"
