---
# Explicit maintenance activation after local-log container migration.
# One host at a time; autolock uses the existing private Swarm unlock task.
- name: Activate the prepared Docker local logging default
  hosts: docker_hosts
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  vars:
    restart_health_urls:
      - https://vault.ryzhkov.dev/alive
      - https://auth.ryzhkov.dev/-/health/ready/
      - https://home.ryzhkov.dev
      - https://photos.ryzhkov.dev/api/server/ping
      - https://emby.ryzhkov.dev/System/Info/Public
      - https://logs.ryzhkov.dev/api/health
      - https://git.ryzhkov.dev/api/healthz
      - https://uptime.ryzhkov.dev/health
      - https://rss.ryzhkov.dev/healthcheck
    restart_state_path: /var/lib/observability/docker-activation.json
  pre_tasks:
    - name: Require the controlled interruption window
      ansible.builtin.assert:
        that:
          - observability_docker_restart_confirm | default(false) | bool
          - docker_logs_via_alloy | default(false) | bool
        quiet: true
    - name: Refuse host maintenance conflicts
      ansible.builtin.include_role:
        name: maintenance_guard
    - name: Validate the prepared daemon configuration
      ansible.builtin.command:
        argv: [dockerd, --validate, --config-file=/etc/docker/daemon.json]
      become: true
      changed_when: false
      check_mode: false
    - name: Require the prepared file to select local logs
      ansible.builtin.command:
        argv: [python3, -c, "import json; assert json.load(open('/etc/docker/daemon.json'))['log-driver'] == 'local'"]
      become: true
      changed_when: false
      check_mode: false
    - name: Inspect durable activation recovery state
      ansible.builtin.stat:
        path: "{{ restart_state_path }}"
      become: true
      register: restart_state
      check_mode: false
    - name: Start a stopped Docker daemon only for recorded recovery
      ansible.builtin.systemd_service:
        name: docker
        state: started
      become: true
      when:
        - restart_state.stat.exists
        - not ansible_check_mode
    - name: Inspect active container driver names without private configuration
      ansible.builtin.shell:
        cmd: "docker ps -q | xargs -r docker inspect --format '{{ '{{' }}.HostConfig.LogConfig.Type{{ '}}' }}'"
      register: restart_container_drivers
      changed_when: false
      check_mode: false
    - name: Refuse an active legacy Loki driver
      ansible.builtin.assert:
        that: "'loki' not in restart_container_drivers.stdout_lines"
        quiet: true
    - name: Read the active daemon logging default
      ansible.builtin.command:
        argv: [docker, info, --format, "{{ '{{' }}.LoggingDriver{{ '}}' }}"]
      register: restart_default
      changed_when: false
      check_mode: false
    - name: Load interrupted activation state
      ansible.builtin.slurp:
        src: "{{ restart_state_path }}"
      become: true
      register: restart_saved
      when: restart_state.stat.exists
    - name: Recover the original Compose container set
      ansible.builtin.set_fact:
        restart_recovery: "{{ restart_saved.content | b64decode | from_json }}"
      when: restart_state.stat.exists
    - name: Validate interrupted activation belongs to this host
      ansible.builtin.assert:
        that:
          - restart_recovery.host == inventory_hostname
          - restart_recovery.compose_ids is sequence
          - restart_recovery.compose_ids is not string
          - restart_recovery.compose_ids | reject('match', '^[a-f0-9]{12,64}$') | list | length == 0
        quiet: true
      when: restart_state.stat.exists
    - name: Restore the original IDs for recovery
      ansible.builtin.set_fact:
        restart_compose_ids: "{{ restart_recovery.compose_ids }}"
      when: restart_state.stat.exists
    - name: Preflight private manager unlock data before any interruption
      when:
        - inventory_hostname in groups['swarm']
        - restart_default.stdout | trim != 'local' or restart_state.stat.exists
      block:
        - name: Load private Swarm unlock data
          community.sops.load_vars:
            file: "{{ swarm_secret_file | default(playbook_dir ~ '/../secrets/swarm.sops.yaml') }}"
            name: swarm_secrets
          delegate_to: localhost
          no_log: true
        - name: Require a present manager unlock key before stopping services
          ansible.builtin.assert:
            that: swarm_secrets.swarm_unlock_key | default('') | length > 0
            quiet: true
          no_log: true
  tasks:
    - name: Activate or recover an interrupted activation
      when:
        - restart_default.stdout | trim != 'local' or restart_state.stat.exists
        - not ansible_check_mode
      block:
        - name: Require household health before this restart
          when: not restart_state.stat.exists
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
            timeout: 10
          loop: "{{ restart_health_urls }}"
          delegate_to: localhost
          become: false
          no_log: true
        - name: Confirm all three Swarm managers are healthy before losing one
          ansible.builtin.command:
            argv: [docker, node, ls, --format, "{{ '{{' }}.Status{{ '}}' }} {{ '{{' }}.ManagerStatus{{ '}}' }}"]
          delegate_to: "{{ groups['swarm_workers'][0] }}"
          register: restart_manager_states
          changed_when: false
          when: inventory_hostname in groups['swarm'] and restart_default.stdout | trim != 'local'
        - name: Preserve manager quorum
          ansible.builtin.assert:
            that: restart_manager_states.stdout_lines | select('match', '^Ready (Leader|Reachable)$') | list | length >= 3
            quiet: true
          when: inventory_hostname in groups['swarm'] and restart_default.stdout | trim != 'local'
        - name: Keep the peer edge on the VIP during an edge restart
          when: inventory_hostname in groups['edge_proxy']
          block:
            - name: Relinquish this edge VIP
              ansible.builtin.systemd_service:
                name: keepalived
                state: stopped
              become: true
            - name: Confirm the other edge owns the VIP
              ansible.builtin.shell:
                cmd: "ip -4 address show | grep -F ' {{ edge_vip }}/'"
              delegate_to: "{{ (groups['edge_proxy'] | difference([inventory_hostname]))[0] }}"
              register: restart_peer_vip
              changed_when: false
              until: restart_peer_vip.rc == 0
              retries: 10
              delay: 1
        - name: Require backend health after any edge VIP handoff
          when: not restart_state.stat.exists
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
            timeout: 10
          loop: "{{ restart_health_urls }}"
          delegate_to: localhost
          become: false
          no_log: true
        - name: Capture originally running Compose containers only
          when: not restart_state.stat.exists
          ansible.builtin.command:
            argv:
              - docker
              - ps
              - --filter
              - label=com.docker.compose.project
              - --format
              - "{{ '{{' }}.ID{{ '}}' }} {{ '{{' }}.Label \"com.docker.swarm.service.id\"{{ '}}' }}"
          register: restart_compose_raw
          changed_when: false
        - name: Exclude Swarm tasks that also carry Compose labels
          when: not restart_state.stat.exists
          ansible.builtin.set_fact:
            restart_compose_ids: "{{ restart_compose_raw.stdout_lines | map('trim') | reject('search', ' ') | reject('equalto', '') | list }}"
        - name: Create private activation journal directory
          ansible.builtin.file:
            path: "{{ restart_state_path | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0700"
          become: true
          when: not restart_state.stat.exists
        - name: Persist original IDs before interrupting services
          ansible.builtin.copy:
            dest: "{{ restart_state_path }}"
            content: "{{ {'host': inventory_hostname, 'compose_ids': restart_compose_ids} | to_json }}"
            owner: root
            group: root
            mode: "0600"
          become: true
          when: not restart_state.stat.exists
        # A locked manager can start Compose before its network agent is restored.
        # Starting after unlock keeps the embedded service DNS registrations.
        - name: Stop captured Compose containers before a manager restart
          ansible.builtin.command:
            argv: "{{ ['docker', 'stop', '--time', '30'] + restart_compose_ids }}"
          when:
            - inventory_hostname in groups['swarm']
            - restart_default.stdout | trim != 'local' or restart_state.stat.exists
            - restart_compose_ids | length > 0
          changed_when: true
        - name: Restart the Docker daemon
          when: restart_default.stdout | trim != 'local'
          ansible.builtin.systemd_service:
            name: docker
            state: restarted
          become: true
        - name: Wait for the new default
          ansible.builtin.command:
            argv: [docker, info, --format, "{{ '{{' }}.LoggingDriver{{ '}}' }}"]
          register: restarted_default
          changed_when: false
          until: restarted_default.rc == 0 and restarted_default.stdout | trim == 'local'
          retries: 20
          delay: 3
        - name: Unlock a restarted Swarm manager through the existing secret path
          when: inventory_hostname in groups['swarm']
          block:
            - name: Read Swarm state
              ansible.builtin.command:
                argv: [docker, info, --format, "{{ '{{' }}.Swarm.LocalNodeState{{ '}}' }}"]
              register: restarted_swarm_state
              changed_when: false
            - name: Reuse the manager unlock task
              ansible.builtin.include_role:
                name: swarm
                tasks_from: unlock.yml
              when: restarted_swarm_state.stdout | trim == 'locked'
        - name: Restore only containers that were running before this window
          ansible.builtin.command:
            argv: "{{ ['docker', 'start'] + restart_compose_ids }}"
          when: restart_compose_ids | length > 0
          register: restart_compose_started
          until: restart_compose_started.rc == 0
          retries: 20
          delay: 3
          changed_when: true
        - name: Require captured containers running and native checks healthy
          ansible.builtin.command:
            argv: "{{ ['docker', 'inspect', '--format', '{{.State.Running}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}'] + restart_compose_ids }}"
          register: restarted_containers
          changed_when: false
          when: restart_compose_ids | length > 0
          until: >-
            restarted_containers.rc == 0
            and restarted_containers.stdout_lines | reject('match', '^true (healthy|no-healthcheck)$') | list | length == 0
          retries: 60
          delay: 3
        - name: Require household health before proceeding to another host
          ansible.builtin.uri:
            url: "{{ item }}"
            status_code: 200
            timeout: 10
          loop: "{{ restart_health_urls }}"
          delegate_to: localhost
          become: false
          register: restarted_health
          until: restarted_health.status | default(0) == 200
          retries: 30
          delay: 3
          no_log: true
        - name: Clear activation journal only after recovery and backend acceptance
          ansible.builtin.file:
            path: "{{ restart_state_path }}"
            state: absent
          become: true
      always:
        - name: Restore edge VIP failover membership
          ansible.builtin.systemd_service:
            name: keepalived
            state: started
          become: true
          when: inventory_hostname in groups['edge_proxy']
