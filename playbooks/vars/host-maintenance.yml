---
# What lives on each Proxmox host and how it leaves, for playbooks/host-drain.yml
# and playbooks/host-return.yml (runbook: docs/transition/phase7/
# runbook-host-maintenance.md). Measured 2026-10-03; re-check the guest lists
# with `qm list` and `pct list` when a guest is added, because both playbooks
# refuse to run while an unlisted guest is running.

# Stateful Swarm stacks are moved by playbooks/swarm-move.yml in this order:
# every pinned stack not named below first, in name order (leaf services: the
# *arr apps, komga, ombi, navidrome, thelounge, lubelogger, obsidian, cv-site,
# actual, openviking, autobrr); then these, in this order. Authentik comes
# before the apps that log in through it (Vaultwarden SSO, Miniflux, Forgejo
# OIDC), so each of their post-move checks runs against Authentik in its final
# place; availability does not depend on the order, because forward auth enters
# through each edge's loopback entry point to auth-service, which lists both
# workers. Forgejo is last, because it serves the image mirror every stack file
# names: the images are pre-pulled on both workers, and nothing else may need
# the registry while it moves.
host_maintenance_move_last: [authentik, miniflux, vaultwarden, forgejo]

# Stacks that never move (swarm-move.yml refuses them too): logging publishes
# Loki in host mode on homelab and every client names homelab's address.
host_maintenance_unmovable: [logging]

# The VIP and Gatus.
host_maintenance_gatus_port: 3002

# Movable Compose stacks (compose_movable_stacks in group_vars/all.yml) move
# with playbooks/compose-move.yml before the drain. Compose stacks have no
# Swarm reservation, so the memory check counts these working-set estimates
# for them: Emby transcoding, Immich with machine learning loaded.
host_maintenance_compose_memory:
  emby: 2147483648
  immich: 3221225472

# Household routes checked through the VIP after the drain, with the path
# that answers without a login. `down_with` names the host whose maintenance
# takes the route down by design (the plan's accepted exceptions and the
# compose-pinned services recorded in the runbook).
host_maintenance_routes:
  - { host: vault.ryzhkov.dev, path: /alive }
  - { host: auth.ryzhkov.dev, path: /-/health/ready/ }
  - { host: budget.ryzhkov.dev, path: / }
  - { host: music.ryzhkov.dev, path: /ping }
  - { host: rss.ryzhkov.dev, path: /healthcheck }
  - { host: git.ryzhkov.dev, path: / }
  - { host: blog.ryzhkov.dev, path: / }
  - { host: draw.ryzhkov.dev, path: / }
  - { host: wiki.ryzhkov.dev, path: / }
  - { host: speed.ryzhkov.dev, path: / }
  - { host: voice.ryzhkov.dev, path: / }
  - { host: uptime.ryzhkov.dev, path: / }
  - { host: dns-sync.ryzhkov.dev, path: /healthz }
  - { host: request.ryzhkov.dev, path: / }
  - { host: sonarr.ryzhkov.dev, path: /ping }
  - { host: radarr.ryzhkov.dev, path: /ping }
  - { host: lidarr.ryzhkov.dev, path: /ping }
  - { host: prowlarr.ryzhkov.dev, path: /ping }
  - { host: bazarr.ryzhkov.dev, path: / }
  - { host: autobrr.ryzhkov.dev, path: / }
  - { host: manga.ryzhkov.dev, path: / }
  - { host: irc.ryzhkov.dev, path: / }
  - { host: igor.ryzhkov.dev, path: / }
  - { host: garage.ryzhkov.dev, path: / }
  - { host: obsidian.ryzhkov.dev, path: / }
  - { host: photos.ryzhkov.dev, path: /api/server/ping }
  - { host: emby.ryzhkov.dev, path: /System/Info/Public }
  - { host: cctv.ryzhkov.dev, path: /, down_with: proxmox-b }
  - { host: jocasta.ryzhkov.dev, path: /healthz, down_with: proxmox-a }
  - { host: ai.ryzhkov.dev, path: /, down_with: proxmox-a }
  - { host: logs.ryzhkov.dev, path: /api/health, down_with: proxmox-a }
  - { host: home.ryzhkov.dev, path: /, down_with: proxmox-a }
  - { host: zigbee.ryzhkov.dev, path: /, down_with: proxmox-a }
  - { host: torrent.ryzhkov.dev, path: /, down_with: proxmox-a }

# Gatus endpoint keys that may fail while a host is down, as one regular
# expression per host. The `internal-on-<worker>-via-*` checks probe one
# worker's backend directly, so they all fail with that worker; the checks
# that matter (every route through the VIP) are made by the playbook itself.
host_maintenance_gatus_expected:
  proxmox-a: >-
    ^internal-on-homelab-|^internal-on-blackpearl-|_adguard-ct10[07]$|_edge-public-api-tcp$|_home-ryzhkov-dev$|_zigbee-ryzhkov-dev$|_mqtt-host-ping$|_logs-ryzhkov-dev$|_steward-worker-homelab$|_gatus-homelab$|^smart_proxmox-a-
  proxmox-b: >-
    ^internal-on-normandy-|_adguard-ct201$|_edge-public-api-b-tcp$|_cctv-ryzhkov-dev$|_steward-worker-normandy$|_gatus-normandy$|^smart_proxmox-b-

host_maintenance:
  proxmox-a:
    node_name: hp-elite-mini-01
    survivor: proxmox-b
    worker: homelab
    survivor_worker: normandy
    edge: public-api
    survivor_edge: public-api-b
    # Compose projects stopped before the guests, per Docker host on this node.
    # Emby is not here: it moves to normandy (compose-move.yml).
    compose_stop:
      homelab: [dsh, jocasta, gatus, cloudflare]
      blackpearl: [torrent, diun]
    # Guests in shutdown order: agents first, then the Docker hosts (after
    # their stacks were stopped), Home Assistant and its radios, the edge, and
    # AdGuard's origin and replica last, because the replica on proxmox-b
    # answers alone from then on.
    guests:
      - { type: qm, id: 111, name: agent-a }
      - { type: qm, id: 102, name: black-pearl }
      - { type: qm, id: 101, name: homelab }
      - { type: qm, id: 103, name: homeassistant }
      - { type: pct, id: 105, name: zigbee2mqtt }
      - { type: pct, id: 104, name: mqtt }
      - { type: pct, id: 110, name: healthcheck }
      - { type: qm, id: 106, name: public-api }
      - { type: pct, id: 107, name: adguard }
      - { type: pct, id: 100, name: adguard }
    # The ZFS ARC cap, checked on return (docs/storage-pools.md).
    zfs_arc_max: 4294967296
  proxmox-b:
    node_name: hp-workstation-01
    survivor: proxmox-a
    worker: normandy
    survivor_worker: homelab
    edge: public-api-b
    survivor_edge: public-api
    # Immich is not here: it moves to homelab (compose-move.yml).
    compose_stop:
      normandy: [frigate, gatus, cloudflare]
    guests:
      - { type: qm, id: 211, name: agent-b }
      - { type: qm, id: 202, name: omarchy }
      - { type: qm, id: 108, name: public-api-b }
      - { type: pct, id: 201, name: alpine-adguard }
    zfs_arc_max: 2147483648
