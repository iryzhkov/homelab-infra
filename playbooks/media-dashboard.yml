---
# Provision only the existing media dashboard; do not redeploy the collector.
- name: Show existing media evidence without adding services
  hosts: homelab
  become: true
  gather_facts: false
  roles:
    - role: observability_grafana
      vars:
        observability_grafana_dashboard_files: [media.json]
        observability_grafana_embedding_dashboard_files: []
        observability_grafana_retired_dashboard_uids: []
        observability_grafana_legacy_dashboard_uids: []
        observability_grafana_starred_dashboard_uids: []
        observability_grafana_home_dashboard_uid: ""
