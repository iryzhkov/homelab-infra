---
# Converge Authentik's access configuration: groups, who may open which
# application, the admin MFA requirement. The data is playbooks/vars/
# authentik.yml; roles/authentik_config says how it reaches Authentik.
#
#   ansible-playbook playbooks/authentik.yml --check --diff
#   ansible-playbook playbooks/authentik.yml
# With machine identities enabled, --check skips the access configuration
# preview and SOPS loading; it plans only machine identities.

- name: Configure Authentik
  hosts: localhost
  connection: local
  gather_facts: false
  # The inventory's ansible_user is "{{ ssh_user }}", which localhost lacks.
  # This outranks host_vars for every host the play touches, so the tasks
  # delegated to homelab name homelab's user themselves.
  vars:
    ssh_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
  vars_files:
    - vars/authentik.yml
  roles:
    - role: authentik_config
      # Enrollment check mode must not load the controller's SOPS credentials.
      when: not (ansible_check_mode and (authentik_machine_identities_enabled | default(false) | bool))
  tasks:
    # Off unless enabled in vars/authentik.yml; docs/authentik-machine-identities.md.
    - name: Enrol Chaldea machine identities
      ansible.builtin.include_role:
        name: authentik_machine_identities
      when: authentik_machine_identities_enabled | default(false) | bool
