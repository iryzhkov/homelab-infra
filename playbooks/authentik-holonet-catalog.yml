---
# Isolated enrollment of the HoloNet catalog machine identities:
# docs/authentik-machine-identities.md, "Isolated HoloNet catalog identities".
# Runs only roles/authentik_machine_identities, with the existing owned HoloNet
# blueprint and the declaration in vars/authentik-holonet-catalog.yml. It never
# runs authentik_config, the access blueprint, the shared, Jocasta or OV
# machine identity blueprints or any other host convergence.
#
# Use an operator inventory outside this repository that defines exactly the
# declared hosts (homelab, laptop) with their real connections, and supply
# authentik_machine_identity_destinations binding both. The homelab identity
# is the existing persistent reader and stays unchanged; the laptop receives
# only the limited Chaldea Claude preset's separate credential. Off unless
# explicitly requested:
#
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-holonet-catalog.yml --check --diff \
#     -e @DESTINATIONS
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-holonet-catalog.yml --check \
#     -e holonet_catalog_baseline_read=true
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-holonet-catalog.yml --check --diff \
#     -e @DESTINATIONS -e holonet_catalog_online_check=true -e @PROTECTED_BASELINE
#   ansible-playbook -i OPERATOR_INVENTORY playbooks/authentik-holonet-catalog.yml \
#     -e @DESTINATIONS -e holonet_catalog_apply=true -e @PROTECTED_BASELINE
#
# Expiry-only renewal and the writer's scoped playback history are separate
# explicit inputs (docs/authentik-machine-identities.md, "Expiry-only renewal"
# and "Scoped playback history"). Both refuse the historical baseline read and
# need a fresh public baseline of the current four-account content.

- name: Enrol only the owned HoloNet catalog machine identities
  hosts: localhost
  connection: local
  gather_facts: false
  # As in playbooks/authentik.yml: the inventory's ansible_user is
  # "{{ ssh_user }}", which localhost lacks.
  vars:
    ssh_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
    holonet_catalog_baseline_mode: "{{ holonet_catalog_baseline_read | default(false) | bool }}"
  vars_files:
    - vars/authentik-holonet-catalog.yml
  pre_tasks:
    # The role derives machine_identity_api, the URL every request uses, and
    # this play sets the baseline include's inputs. None is ever an entrypoint
    # input; an extra var would silently replace them, so refuse it before the
    # credential is loaded.
    - name: Refuse extra vars for facts this entrypoint and its role derive
      ansible.builtin.assert:
        that:
          - machine_identity_api is not defined
          - machine_identity_baseline_anchor is not defined
          - machine_identity_baseline_identities is not defined
        fail_msg: >-
          machine_identity_api, machine_identity_baseline_anchor and
          machine_identity_baseline_identities are derived, never inputs.
        quiet: true

    - name: Require an explicit apply outside check mode
      ansible.builtin.assert:
        that: ansible_check_mode or (holonet_catalog_apply | default(false) | bool)
        fail_msg: Real runs need -e holonet_catalog_apply=true; use --check for the plan.
        quiet: true

    - name: Keep the baseline read separate from every other mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - not (holonet_catalog_torrents_enabled | bool)
          - not (holonet_catalog_seed_join_enabled | bool)
          - not (holonet_catalog_apply | default(false) | bool)
          - not (holonet_catalog_online_check | default(false) | bool)
          - holonet_catalog_baseline_checkpoint | default('historical') in ['historical', 'ordinary-reader', 'series-writer-20261102']
          - >-
            (holonet_catalog_recommendations_enabled | bool) ==
            (holonet_catalog_baseline_checkpoint | default('historical') == 'series-writer-20261102')
          - >-
            (holonet_catalog_playback_enabled | bool) ==
            (holonet_catalog_baseline_checkpoint | default('historical') == 'series-writer-20261102')
          - >-
            (holonet_catalog_series_enabled | bool) ==
            (holonet_catalog_baseline_checkpoint | default('historical') == 'series-writer-20261102')
          - >-
            holonet_catalog_identity_expires ==
            ('2027-02-15T00:00:00Z' if holonet_catalog_baseline_checkpoint | default('historical') == 'series-writer-20261102'
             else '2026-11-20T00:00:00Z')
          - holonet_catalog_baseline_checkpoint | default('historical') != 'series-writer-20261102' or holonet_catalog_interactive_enabled | bool
          - holonet_catalog_baseline_checkpoint | default('historical') != 'ordinary-reader' or holonet_catalog_interactive_enabled | bool
        fail_msg: The baseline read runs alone, in check mode, without apply or the online preflight.
        quiet: true
      when: holonet_catalog_baseline_mode | bool

    - name: Select the separately opted-in ordinary HoloNet catalog reader
      ansible.builtin.set_fact:
        authentik_machine_identities: "{{ authentik_machine_identities + [holonet_catalog_interactive_identity] }}"
      when: holonet_catalog_interactive_enabled | bool

    - name: Require an explicit bounded writer cohort and lifecycle before credential loading
      ansible.builtin.assert:
        that:
          - holonet_catalog_recommendations_identity.holonet_target_users is sequence
          - holonet_catalog_recommendations_identity.holonet_target_users is not string
          - holonet_catalog_recommendations_identity.holonet_target_users is not mapping
          - 1 <= holonet_catalog_recommendations_identity.holonet_target_users | length <= 16
          - holonet_catalog_recommendations_identity.holonet_target_users | unique | list | length == holonet_catalog_recommendations_identity.holonet_target_users | length
          - holonet_catalog_recommendations_identity.holonet_target_users | select('string') | list | length == holonet_catalog_recommendations_identity.holonet_target_users | length
          - holonet_catalog_recommendations_identity.holonet_target_users | map('length') | difference([32]) | length == 0
          - holonet_catalog_recommendations_identity.holonet_target_users | select('match', '^[0-9a-f]{32}$') | list | length == holonet_catalog_recommendations_identity.holonet_target_users | length
          - holonet_catalog_recommendations_identity.generation is integer
          - 1 <= holonet_catalog_recommendations_identity.generation <= 1000
          - holonet_catalog_recommendations_identity.state in ['present', 'absent']
          - holonet_catalog_recommendations_identity.expires is string
          - holonet_catalog_recommendations_identity.expires is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - holonet_catalog_recommendations_identity.expires | to_datetime('%Y-%m-%dT%H:%M:%SZ') is not none
        fail_msg: Writer selection requires an explicit bounded cohort and valid lifecycle; no defaults enroll it.
        quiet: true
      when: holonet_catalog_recommendations_enabled | bool

    # history.read only for the separate writer, only for recipients it already
    # targets. Readers keep empty history through the literal guard below.
    - name: Require the writer opt-in and a bounded history subset for scoped playback
      ansible.builtin.assert:
        that:
          - holonet_catalog_recommendations_enabled | bool
          - holonet_catalog_recommendations_identity.holonet_history_users is sequence
          - holonet_catalog_recommendations_identity.holonet_history_users is not string
          - holonet_catalog_recommendations_identity.holonet_history_users is not mapping
          - 1 <= holonet_catalog_recommendations_identity.holonet_history_users | length <= 16
          - holonet_catalog_recommendations_identity.holonet_history_users | unique | list | length == holonet_catalog_recommendations_identity.holonet_history_users | length
          - holonet_catalog_recommendations_identity.holonet_history_users | select('string') | list | length == holonet_catalog_recommendations_identity.holonet_history_users | length
          - holonet_catalog_recommendations_identity.holonet_history_users | select('match', '^[0-9a-f]{32}$') | list | length == holonet_catalog_recommendations_identity.holonet_history_users | length
          - holonet_catalog_recommendations_identity.holonet_history_users | difference(holonet_catalog_recommendations_identity.holonet_target_users) | length == 0
        fail_msg: Scoped playback needs the writer opt-in and 1..16 history users, all among its target users.
        quiet: true
      when: holonet_catalog_playback_enabled | bool

    - name: Require an explicit writer-only TV and Anime library opt-in
      ansible.builtin.assert:
        that:
          - holonet_catalog_series_enabled is boolean
          - not holonet_catalog_series_enabled or (holonet_catalog_recommendations_enabled | bool)
          - not holonet_catalog_series_enabled or (holonet_catalog_playback_enabled | bool)
          - >-
            not holonet_catalog_series_enabled or
            holonet_catalog_recommendations_identity.holonet_libraries == ['3', '615', '1132']
        fail_msg: Series access requires the separate history writer and exactly Movies, Anime and TV libraries.
        quiet: true

    - name: Select only the separate HoloNet recommendation identity and full scope tuple
      ansible.builtin.set_fact:
        authentik_machine_identities: "{{ authentik_machine_identities + [holonet_catalog_recommendations_identity] }}"
        authentik_machine_services: "{{ authentik_machine_services | combine({'holonet': authentik_machine_services.holonet | combine({'scope': ('holonet.read holonet.curate holonet.home holonet.janitor' if holonet_catalog_janitor_enabled | bool else 'holonet.read holonet.curate holonet.home')})}) }}"
      when: holonet_catalog_recommendations_enabled | bool

    # The default keeps 2026-11-20; any other value is an explicit renewal of
    # all four existing generation-1 app passwords to one common date.
    - name: Bound the expiry-only renewal parameter
      ansible.builtin.assert:
        that:
          - holonet_catalog_identity_expires is string
          - holonet_catalog_identity_expires is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
          - holonet_catalog_identity_expires | to_datetime('%Y-%m-%dT%H:%M:%SZ') is not none
          - holonet_catalog_identity_expires >= '2026-11-20T00:00:00Z'
        fail_msg: holonet_catalog_identity_expires must be a whole-second UTC date no earlier than 2026-11-20.
        quiet: true

    - name: Renew only the expiry of exactly the four existing accounts
      ansible.builtin.assert:
        that:
          - holonet_catalog_interactive_enabled | bool
          - holonet_catalog_recommendations_enabled | bool
          - authentik_machine_identities | length == 4
          - authentik_machine_identities | map(attribute='generation') | list == [1, 1, 1, 1]
          - authentik_machine_identities | map(attribute='state') | list == ['present'] * 4
          - authentik_machine_identities | map(attribute='expires') | list == [holonet_catalog_identity_expires] * 4
          - >-
            86400 <= ((holonet_catalog_identity_expires | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
            - now(utc=true)).total_seconds() <= 180 * 86400
        fail_msg: >-
          A renewal advances homelab, laptop limited, interactive and writer together to
          one date 1..180 days ahead, at generation 1 and present; the writer's protected
          expiry must equal it.
        quiet: true
      when: holonet_catalog_identity_expires != '2026-11-20T00:00:00Z'

    # Literal values: a declaration that drops or changes the existing homelab
    # reader, widens or moves the laptop identity, adds another account,
    # changes the baseline anchor or widens this run beyond the one owned
    # HoloNet application is refused, whether it comes from source or extra
    # vars. This checks the declared inputs only; extra vars can still override
    # the role's internal facts, so run only the documented commands.
    - name: Preserve the existing HoloNet application and homelab identity exactly
      ansible.builtin.assert:
        that:
          - authentik_machine_identities_enabled | bool
          - authentik_machine_identity_existing_owned_only | bool
          - authentik_machine_identities_blueprint_name == 'homelab-infra holonet catalog identities'
          - authentik_machine_identity_max_days == 180
          - >-
            holonet_catalog_baseline_anchor == {'blueprint_pk': '2514696c-15e3-494e-8df6-eb0c098a9efb',
            'content_sha256': 'aef30eb3096776f9edddff5d00cb3eb3aac7d1128b05a730aa138407bc577f58'}
          - authentik_machine_services.keys() | list == ['holonet']
          - >-
            (authentik_machine_services.holonet | dict2items | rejectattr('key', 'in', ['issuer', 'jwks_url', 'scope'])
            | items2dict) == {'state': 'present', 'slug': 'chaldea-holonet',
            'name': 'Chaldea HoloNet catalog access', 'group': 'chaldea-holonet-machine-identities',
            'client_id': 'chaldea-holonet-machine', 'resource': 'https://media.mcp.ryzhkov.dev/mcp',
            'signing_key': '8bbd6516-af33-4e64-a73b-caa39e692c29',
            'token_seconds': 300}
          - >-
            authentik_machine_services.holonet.scope in
            (['holonet.read holonet.curate holonet.home',
              'holonet.read holonet.curate holonet.home holonet.janitor',
              'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents',
              'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents holonet.seedjoin']
             if holonet_catalog_recommendations_enabled | bool else ['holonet.read'])
          - >-
            authentik_machine_identities | map(attribute='profile') | list ==
            (['holonet-movies-catalog', 'holonet-movies-catalog-claude'] +
            (['holonet-interactive'] if holonet_catalog_interactive_enabled | bool else []) +
            (['holonet-recommendations'] if holonet_catalog_recommendations_enabled | bool else []))
          - >-
            authentik_machine_identities | first ==
            {'host': 'homelab', 'profile': 'holonet-movies-catalog', 'service': 'holonet',
             'holonet_server': '3c86e6d7ff6c4a3296522cdf03d22bb0', 'holonet_libraries': ['3'],
             'holonet_catalog_users': ['54b7d36cef804d3c8478474553ed3a82'],
             'holonet_history_users': [], 'holonet_target_users': [], 'holonet_actions': ['catalog.read'],
             'holonet_namespace': 'movies-catalog',
             'generation': 1, 'expires': holonet_catalog_identity_expires, 'state': 'present'}
          # The new laptop account: its generation, expiry and state follow the
          # role's own lifecycle rules, but its host, profile and grant are fixed.
          - >-
            (authentik_machine_identities[1] | dict2items
            | rejectattr('key', 'in', ['generation', 'expires', 'state']) | items2dict) ==
            {'host': 'laptop', 'profile': 'holonet-movies-catalog-claude', 'service': 'holonet',
             'holonet_server': '3c86e6d7ff6c4a3296522cdf03d22bb0', 'holonet_libraries': ['3'],
             'holonet_catalog_users': ['54b7d36cef804d3c8478474553ed3a82'],
             'holonet_history_users': [], 'holonet_target_users': [], 'holonet_actions': ['catalog.read'],
             'holonet_namespace': 'movies-catalog'}
          - >-
            not (holonet_catalog_interactive_enabled | bool) or
            (authentik_machine_identities[2] | dict2items
            | rejectattr('key', 'in', ['generation', 'expires', 'state']) | items2dict) ==
            {'host': 'laptop', 'profile': 'holonet-interactive', 'service': 'holonet',
             'holonet_server': '3c86e6d7ff6c4a3296522cdf03d22bb0', 'holonet_libraries': ['3'],
             'holonet_catalog_users': ['54b7d36cef804d3c8478474553ed3a82'],
             'holonet_history_users': [], 'holonet_target_users': [], 'holonet_actions': ['catalog.read'],
             'holonet_namespace': 'movies-catalog'}
          - >-
            not (holonet_catalog_recommendations_enabled | bool) or
            (authentik_machine_identities[-1] | dict2items
            | rejectattr('key', 'in', ['generation', 'expires', 'state']) | items2dict) ==
            {'host': 'laptop', 'profile': 'holonet-recommendations', 'service': 'holonet',
             'holonet_server': '3c86e6d7ff6c4a3296522cdf03d22bb0',
             'holonet_libraries': (['3', '615', '1132'] if holonet_catalog_series_enabled else ['3']),
             'holonet_catalog_users': ['54b7d36cef804d3c8478474553ed3a82'],
             'holonet_history_users': (holonet_catalog_recommendations_identity.holonet_history_users
                                       if holonet_catalog_playback_enabled | bool else []),
             'holonet_target_users': holonet_catalog_recommendations_identity.holonet_target_users,
             'holonet_actions': ['catalog.read', 'playlist.read', 'playlist.manage', 'object.share', 'home.read', 'home.manage', 'object.delete']
                                + (['history.read'] if holonet_catalog_playback_enabled | bool else []),
             'holonet_namespace': 'managed-recommendations'}
        fail_msg: >-
          This entrypoint only adds to the existing owned HoloNet application and keeps
          its homelab identity present and unchanged. Laptop identities are only the
          limited Claude preset, the ordinary catalog reader and a separately opted-in
          recommendation writer. Each keeps its exact grant and its own credential.
        quiet: true

    # Fixed checkpoint of the successful REAL recorded in
    # jocasta:4f5b196b88482022d663d25cd3517967@2. These public inputs
    # describe that deployment only; the stored bytes still need a fresh read.
    - name: Pin the current Series checkpoint cohort before credential loading
      ansible.builtin.assert:
        that:
          - authentik_machine_identities | length == 4
          - authentik_machine_identities | map(attribute='generation') | list == [1, 1, 1, 1]
          - authentik_machine_identities | map(attribute='state') | list == ['present'] * 4
          - authentik_machine_identities | map(attribute='expires') | list == ['2027-02-15T00:00:00Z'] * 4
          - >-
            holonet_catalog_recommendations_identity.holonet_target_users ==
            ["545014d1c9d1416b8e0b5a445d6ff9ec","b8f4f6de49b443f1948cf0118679e863","db2f3bfb1f84438ebcde94f228183011","313e39bb4d8c4b92b81d4b170c3f1b8e","c06c7d2c3e224d8ba2e466efa5bcb97b","22703968ab0b48eebb4faf7c1d16262c","e05efa68303043b893b0f5c2e200ccd7"]
          - holonet_catalog_recommendations_identity.holonet_history_users == holonet_catalog_recommendations_identity.holonet_target_users
        fail_msg: The Series baseline checkpoint requires the exact successful four-account cohort.
        quiet: true
      when: >-
        holonet_catalog_baseline_mode | bool and
        holonet_catalog_baseline_checkpoint | default('historical') == 'series-writer-20261102'

    # The historical and ordinary-reader anchors predate the writer; never
    # derive this change's baseline from them.
    - name: Require an explicit existing-writer janitor read enrollment
      ansible.builtin.assert:
        that:
          - holonet_catalog_janitor_enabled is boolean
          - not holonet_catalog_janitor_enabled or (holonet_catalog_recommendations_enabled | bool)
        quiet: true

    # Run after the unchanged literal identity guards. Only an extra nested
    # purpose grant and one scope mapping may change; never a new account.
    - name: Add only janitor reads to the existing owned writer identity
      ansible.builtin.set_fact:
        authentik_machine_identities: >-
          {{ authentik_machine_identities[:-1] +
             [authentik_machine_identities[-1] | combine({'holonet_janitor':
               {'library': '3', 'actions': ['janitor.importers.read', 'janitor.custody.read']}})] }}
      when: holonet_catalog_janitor_enabled | bool

    - name: Refuse an overridden janitor grant or application before credentials
      ansible.builtin.assert:
        that:
          - >-
            authentik_machine_identities[-1].holonet_janitor == {'library': '3', 'actions': ['janitor.importers.read', 'janitor.custody.read']}
          - authentik_machine_services.holonet.scope in ['holonet.read holonet.curate holonet.home holonet.janitor', 'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents', 'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents holonet.seedjoin']
        quiet: true
      when: holonet_catalog_janitor_enabled | bool

    - name: Require explicit existing writer torrent enrollment without lifecycle changes
      ansible.builtin.assert:
        that:
          - holonet_catalog_torrents_enabled is boolean
          - not holonet_catalog_torrents_enabled or (holonet_catalog_recommendations_enabled | bool)
          - not holonet_catalog_torrents_enabled or authentik_machine_identity_existing_owned_only
          - not holonet_catalog_torrents_enabled or holonet_catalog_recommendations_identity.generation == 1
          - not holonet_catalog_torrents_enabled or holonet_catalog_recommendations_identity.state == 'present'
        quiet: true

    - name: Add only the separate torrent grant and scope to the existing application
      ansible.builtin.set_fact:
        authentik_machine_identities: >-
          {{ authentik_machine_identities[:-1] +
             [authentik_machine_identities[-1] | combine({'holonet_torrents':
               {'library': '3', 'actions': ['janitor.torrents.read']}})] }}
        authentik_machine_services: "{{ authentik_machine_services | combine({'holonet': authentik_machine_services.holonet | combine({'scope': 'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents' + (' holonet.seedjoin' if holonet_catalog_seed_join_enabled is sameas true else '')})}) }}"
      when: holonet_catalog_torrents_enabled | bool

    - name: Refuse overridden torrent projection before credentials
      ansible.builtin.assert:
        that:
          - >-
            authentik_machine_identities[-1].holonet_torrents == {'library': '3', 'actions': ['janitor.torrents.read']}
          # Seed join rollback retains its owned scope mapping on the application.
          - >-
            authentik_machine_services.holonet.scope in
            (['holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents holonet.seedjoin']
             if holonet_catalog_seed_join_enabled is sameas true else
             ['holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents',
              'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents holonet.seedjoin'])
        quiet: true
      when: holonet_catalog_torrents_enabled | bool

    # The stat-only seed/library pair (jocasta:c3070dfe196e7f67732749db4b279689@3)
    # is its own purpose grant and scope on the same writer. It needs the torrent
    # grant enabled and never changes the torrent or janitor grants.
    - name: Require explicit existing writer seed join enrollment without lifecycle changes
      ansible.builtin.assert:
        that:
          - holonet_catalog_seed_join_enabled is boolean
          - not holonet_catalog_seed_join_enabled or (holonet_catalog_torrents_enabled | bool)
          - not holonet_catalog_seed_join_enabled or (holonet_catalog_recommendations_enabled | bool)
          - not holonet_catalog_seed_join_enabled or authentik_machine_identity_existing_owned_only
          - not holonet_catalog_seed_join_enabled or holonet_catalog_recommendations_identity.generation == 1
          - not holonet_catalog_seed_join_enabled or holonet_catalog_recommendations_identity.state == 'present'
        quiet: true

    - name: Add only the separate seed join grant and scope to the existing application
      ansible.builtin.set_fact:
        authentik_machine_identities: >-
          {{ authentik_machine_identities[:-1] +
             [authentik_machine_identities[-1] | combine({'holonet_seed_join':
               {'library': '3', 'actions': ['janitor.seed_join.read']}})] }}
        authentik_machine_services: "{{ authentik_machine_services | combine({'holonet': authentik_machine_services.holonet | combine({'scope': 'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents holonet.seedjoin'})}) }}"
      when: holonet_catalog_seed_join_enabled | bool

    - name: Refuse overridden seed join projection before credentials
      ansible.builtin.assert:
        that:
          - >-
            authentik_machine_identities[-1].holonet_seed_join == {'library': '3', 'actions': ['janitor.seed_join.read']}
          - >-
            authentik_machine_identities[-1].holonet_torrents == {'library': '3', 'actions': ['janitor.torrents.read']}
          - authentik_machine_services.holonet.scope == 'holonet.read holonet.curate holonet.home holonet.janitor holonet.torrents holonet.seedjoin'
        quiet: true
      when: holonet_catalog_seed_join_enabled | bool

    - name: Require a fresh public baseline for renewal or scoped playback
      ansible.builtin.assert:
        that:
          - authentik_machine_identity_existing_provider_baseline is defined
          - authentik_machine_identity_existing_provider_baseline is mapping
          - authentik_machine_identity_existing_provider_baseline | list | sort == ['application_pk', 'content_sha512', 'provider_pk']
        fail_msg: Renewal and scoped playback need an explicit fresh public baseline of the current four-account content.
        quiet: true
      when: >-
        (holonet_catalog_seed_join_enabled | bool or holonet_catalog_torrents_enabled | bool or holonet_catalog_janitor_enabled | bool or holonet_catalog_playback_enabled | bool or holonet_catalog_identity_expires != '2026-11-20T00:00:00Z')
        and (not ansible_check_mode or holonet_catalog_online_check | default(false) | bool)

    - name: Require both destinations bound before any host is touched
      ansible.builtin.assert:
        that: >-
          authentik_machine_identity_destinations | default({}) | list | sort == ['homelab', 'laptop']
        fail_msg: Supply authentik_machine_identity_destinations binding exactly homelab and laptop.
        quiet: true
      when: not holonet_catalog_baseline_mode | bool

    # Check mode stays offline unless explicitly asked for a read-only mode.
    - name: Load only the existing controller API credential
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/authentik-api.sops.yaml"
        name: authentik_api
      no_log: true
      when: >-
        not ansible_check_mode or holonet_catalog_online_check | default(false) | bool
        or holonet_catalog_baseline_mode | bool

    - name: Describe the API exactly as authentik_config does
      ansible.builtin.set_fact:
        authentik_url: "{{ authentik_api.authentik_api_url }}"
        authentik_headers:
          Authorization: "Bearer {{ authentik_api.authentik_api_token }}"
      no_log: true
      when: >-
        not ansible_check_mode or holonet_catalog_online_check | default(false) | bool
        or holonet_catalog_baseline_mode | bool

    # The effective URL, after any extra vars, against the exact literal the
    # role's machine_identity_api_url accepts: no input can move where the
    # controller credential is sent.
    - name: Pin administrative credential transport to the existing Authentik API
      ansible.builtin.assert:
        that:
          - authentik_url is string
          - authentik_url == 'https://auth.ryzhkov.dev/api/v3'
        quiet: true
      no_log: true
      when: >-
        not ansible_check_mode or holonet_catalog_online_check | default(false) | bool
        or holonet_catalog_baseline_mode | bool
  tasks:
    - name: Enrol through the maintained ownership checks and bound private delivery
      ansible.builtin.include_role:
        name: authentik_machine_identities
      when: not holonet_catalog_baseline_mode | bool

    - name: Produce the public existing-only baseline without any change
      ansible.builtin.include_role:
        name: authentik_machine_identities
        tasks_from: baseline.yml
      vars:
        # Receipt 1cbf42fd1e0082eab6e5c3150fb92919@1 independently matched
        # these successful three-reader bytes. Unknown drift must refuse.
        machine_identity_baseline_anchor: >-
          {{ {'blueprint_pk': '2514696c-15e3-494e-8df6-eb0c098a9efb',
              'content_sha256': '7bfb4856b2a0af4ef437182c944b30a4b88dcabd8cc1e00143f14633ce804c9a'}
             if holonet_catalog_baseline_checkpoint | default('historical') == 'ordinary-reader'
             else {'blueprint_pk': '2514696c-15e3-494e-8df6-eb0c098a9efb',
                   'content_sha256': 'f0bd05fefcead26e2f3827fbc95b7b067871ae40828b33c73432d895aad5d2e7'}
             if holonet_catalog_baseline_checkpoint | default('historical') == 'series-writer-20261102'
             else holonet_catalog_baseline_anchor }}
        machine_identity_baseline_identities: >-
          {{ authentik_machine_identities if holonet_catalog_baseline_checkpoint | default('historical') in ['ordinary-reader', 'series-writer-20261102']
             else authentik_machine_identities[:1] }}
      when: holonet_catalog_baseline_mode | bool
