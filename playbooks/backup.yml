---
# Backups this repository owns: homelab's hourly SQLite snapshots and daily
# InfluxDB archive, normandy's daily Postgres dump onto the NAS, and the
# schedule of the job on homelab that ships that dump to Backblaze. homelab's
# other twice-weekly rclone jobs stay in its crontab. See docs/backups.md.
#
#   ansible-playbook playbooks/backup.yml --check --diff

- name: Configure backups
  hosts: docker_hosts
  gather_facts: false
  tasks:
    - name: Install the backup jobs
      ansible.builtin.include_role:
        name: backup
      when: >-
        backup_sqlite_sources is defined
        or backup_nas_dump is defined
        or inventory_hostname == (backup_bulk_shipper | default('homelab'))
