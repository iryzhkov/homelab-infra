---
# Disabled canonical storage for the Garage object store
# (docs/objectstore-storage.md). No swarm_stacks_* entry names the objectstore
# source, so nothing deploys it. If one is added, roles/swarm/tasks/stack.yml
# runs stacks/objectstore/storage-validate.yml before any deployment effect,
# and it refuses while enabled is false or any live fact below is unknown.
# This source creates no directory, mount, service, bucket, secret or pin.
#
# Enabling is a separately approved change that supplies the selected mode's
# required measured facts and evidence, then records the digest printed by
#   scripts/garage-storage-preflight.py --config <json> --digest
# as qualifications.configuration.
objectstore_storage:
  enabled: false
  host: null
  uid: null
  gid: null
  # Garage settings rendered into garage.toml. Configuration, not evidence
  # that the storage honours fsync; durability stays a live gate.
  data_fsync: true
  metadata_fsync: true
  # Blob blocks on NFS. path is a dedicated top-level directory of the mount,
  # owned by uid or an explicitly qualified data.identity_mapping, with no
  # group or other access. The optional mapping remains absent; its exact
  # schema and inert example are in docs/objectstore-storage.md.
  # Managed DATA access_profile is also omitted. Its fixed inert schema and
  # unresolved acceptance boundary are in docs/objectstore-storage.md. No
  # acceptance reference or normal live gate is adopted by this source.
  # mount.options must list rw and exactly one of hard or soft.
  data:
    path: null
    mount: {target: null, source: null, fstype: null, fsroot: null, options: []}
    # Explicit acceptance for the existing unquotaed NAS. This budget is
    # aggregate across artifacts + results, not an allocation per bucket.
    # It enforces no physical bytes/inodes, reserves no space and does not
    # constrain multipart. Risk-acceptance evidence remains pending.
    acceptance_mode: operational_budget
    operational_budget: {bytes: 2000000000000, risk_acceptance: null}
    physical_cap: null
  # LMDB metadata and garage.toml in ordinary private directories on the
  # existing shared /mnt/docker-data service-state filesystem, not a new disk.
  # 16 GiB is a proposed operating budget, not an approved hard cap,
  # reservation or allocation. Actual paths/identity and risk evidence remain
  # unselected. path/meta and path/config must already exist before enabling.
  metadata:
    path: null
    mount: {target: null, source: null, fstype: null, fsroot: null, options: []}
    acceptance_mode: operational_budget
    operational_budget: {bytes: 17179869184, risk_acceptance: null}
    physical_cap: null
  # Evidence references for live gates this source cannot qualify.
  qualifications:
    configuration: null
    full_volume: null
    mount_loss: null
    consistent_restore: null
    fresh_client_roundtrip: null
    last_copy_policy: null
