---
# Phase 5 batch F1 (sqlite-essential): vaultwarden, actual, navidrome.
# docs/transition/phase5/migration-plan.md; evidence and cutover record in
# docs/transition/phase5/2026-10-03-F1.md. Keys are documented at the top of
# roles/swarm/tasks/stack.yml, `snapshot` in inventory/group_vars/swarm/
# backup.yml.
#
# NOT ACTIVE YET. Everything that reads Swarm stacks (playbooks/swarm.yml,
# site.yml's skip list, the Traefik generator, Gatus, the backup role and
# playbooks/swarm-move.yml) reads only variables named swarm_stacks_*; the
# entries below are in pending_swarm_stacks_f1, which nothing reads. A stack
# is activated in the same change as its cutover by moving its entry, as it
# is, into a list named swarm_stacks_f1 in this file (created with the first
# one), then running, in order:
#   ansible-playbook playbooks/swarm.yml --tags stacks -e only=<name> -e swarm_cutover=<name>
#   ansible-playbook playbooks/traefik.yml
#   ansible-playbook playbooks/site.yml -l homelab,normandy -e only=gatus
#   ansible-playbook playbooks/backup.yml -l homelab,normandy
# The Compose project's backup_sqlite_sources entry in
# inventory/host_vars/homelab.yml is the lead's to remove (it keeps
# snapshotting the now idle Compose copy until then).

pending_swarm_stacks_f1:
  - name: vaultwarden
    pin: homelab
    secrets: homelab-vaultwarden
    prepare_tasks: swarm-prepare.yml
    compose:
      host: homelab
      dir: "/home/iryzhkov/app/vaultwarden"
      project: vaultwarden
    routes:
      - host: vault.ryzhkov.dev
        port: 8099
    snapshot:
      class: sqlite
      sqlite:
        - { name: vaultwarden, path: /srv/swarm/vaultwarden/data/db.sqlite3, keep: 48 }
      # Attachments, sends, the RSA keys and config.json; the database goes
      # as the snapshot above, the icon cache is rebuilt on demand.
      files:
        - /srv/swarm/vaultwarden/data
      exclude: [db.sqlite3, db.sqlite3-*, icon_cache/**, tmp/**]

  - name: actual
    pin: homelab
    prepare_tasks: swarm-prepare.yml
    compose:
      host: homelab
      dir: "/home/iryzhkov/app/actual"
      project: actual
    routes:
      - host: budget.ryzhkov.dev
        port: 5006
    snapshot:
      class: sqlite
      sqlite:
        - { name: actual-account, path: /srv/swarm/actual/data/server-files/account.sqlite, keep: 48 }
        # One database per budget, named after a UUID; a glob, so a budget
        # added later is covered without an edit here.
        - { name: actual-budget, glob: /srv/swarm/actual/data/user-files/*.sqlite, keep: 48 }
      files:
        - /srv/swarm/actual/data

  - name: navidrome
    pin: homelab
    prepare_tasks: swarm-prepare.yml
    compose:
      host: homelab
      dir: "/home/iryzhkov/app/navidrome"
      project: navidrome
    env_extra:
      MUSIC_PATH: /mnt/shared/media/music
      NAVIDROME_UID: "1000"
      NAVIDROME_GID: "988"
    routes:
      - host: music.ryzhkov.dev
        port: 4533
        health_check:
          path: /ping
    snapshot:
      class: sqlite
      sqlite:
        - { name: navidrome, path: /srv/swarm/navidrome/data/navidrome.db, keep: 48 }
      # Artwork and plugin state; cache/ is not mirrored (rebuilt on demand).
      files:
        - /srv/swarm/navidrome/data
      exclude: [navidrome.db, navidrome.db-*]
