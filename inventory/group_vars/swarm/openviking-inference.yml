---
# Every embedding runtime serves the identical checksummed Q8_0 GGUF with an f16 KV
# cache and a 4096-token context, so their vectors share one index. The adapter's
# canary admits a runtime only when it reproduces the stored Normandy CPU vector.
# PC GPU vs Normandy CPU measured cosine >= .9995 on 2026-10-24 and 2026-11-11.
# Each key is a Compose project and an overlay alias the adapter names in source.
# parallel is OLLAMA_NUM_PARALLEL and must equal the adapter's slots for that alias.
openviking_inference_network: openviking-providers
openviking_inference:
  embeddings:
    host: normandy
    state_dir: openviking-embeddings
    recipe: embeddings
    source: "{{ openviking_embeddings_model_source | default('file:///home/igor/.cache/ov-selfhost-20261024/matched-embeddings') }}"
    cpus: 3
    memory: 3221225472
    parallel: 2
  embeddings-homelab:
    host: homelab
    state_dir: openviking-embeddings-homelab
    recipe: embeddings
    source: "{{ openviking_embeddings_homelab_model_source | default('registry') }}"
    cpus: 2
    memory: 2147483648
    parallel: 1
  generation:
    host: homelab
    state_dir: openviking-generation
    recipe: generation
    source: "{{ openviking_generation_model_source | default('file:///home/iryzhkov/.cache/ov-selfhost-20261024/generation-production/models') }}"
    cpus: 2
    memory: 2147483648
    parallel: 1
# Use source=registry for a rebuild without the retained cache.
# The PC GPU embedding runtime is a native service: playbooks/ov-pc-embeddings.yml.
