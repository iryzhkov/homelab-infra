---
# Self-hosted inference for OpenViking, deployed as extra services of the
# openviking Swarm stack (stacks/openviking/stack.yml) and prepared by
# stacks/openviking/embeddings-prepare.yml. Read by that task file and by
# scripts/test-openviking-inference.py; the stack file itself only sees the
# values the prepare step adds to its interpolation environment.
#
# Embeddings: OpenVINO Model Server on normandy's CPU. Measured on
# 2026-10-24 (the OV self-host spike and the long-input qualification):
# normandy CPU 164 ms for a short query, homelab CPU 637 ms, homelab UHD 770
# 1.47 s, and normandy's UHD 630 is not supported by the image's compute
# runtime. So no GPU and no device mapping; see docs for the numbers.
#
# The model is fetched by revision and verified by checksum. Every file of
# the pinned Hugging Face revision is listed with its SHA-256 (the LFS object
# ID for the large files, computed for the small ones, and cross-checked
# against the revision's git blob IDs); the prepare step refuses any file
# that does not match and any file that is not listed. To install from a
# local copy instead of Hugging Face (offline rebuild, or the retained spike
# cache), point model.source at it, for example
#   -e '{"openviking_embeddings_model_source": "file:///home/igor/.cache/ov-selfhost-20261024/models/OpenVINO/Qwen3-Embedding-0.6B-int8-ov"}'
# The path is read on the embedding host. The checksums still apply.
#
# Changing the model or its revision changes the embedding space: every
# vector in OpenViking's index must be rebuilt, which is a migration, not a
# configuration change.
openviking_embeddings:
  # The Swarm node (its `host` label) that runs the service and holds the
  # model files.
  host: normandy
  # Under swarm_state_root on that node. Not /srv/swarm/openviking: a
  # swarm-move of the openviking stack replaces that directory with --delete.
  state_dir: openviking-embeddings
  # The name clients put in "model"; OpenViking's embedding.dense.model.
  served_name: qwen3-embedding
  model:
    repository: OpenVINO/Qwen3-Embedding-0.6B-int8-ov
    revision: 80d352d7061ec3e5caa3f26dc4e1f67bb8a21a5e
    source: "{{ openviking_embeddings_model_source | default('https://huggingface.co/OpenVINO/Qwen3-Embedding-0.6B-int8-ov/resolve/80d352d7061ec3e5caa3f26dc4e1f67bb8a21a5e') }}"
    # 1024 floats per input, L2-normalised, whatever "dimensions" a request
    # asks for (OVMS ignores it). OpenViking's dimension must be 1024.
    dimension: 1024
    files:
      - {path: 1_Pooling/config.json, size: 313, sha256: 37bf193fa101f19101bfad9c31d3eb0f786e247b7b1e5cb7f007d730eed1ddbd}
      - {path: added_tokens.json, size: 707, sha256: c0284b582e14987fbd3d5a2cb2bd139084371ed9acbae488829a1c900833c680}
      - {path: chat_template.jinja, size: 4116, sha256: 87a2728cb8dc9fe424d624542f6060ec05a1d285ebbec578bb078900e33396b5}
      - {path: config.json, size: 1358, sha256: 68f2df7c4bea23d67b321a89503429303aedaef24a3fd646ce14e5c355047a43}
      - {path: merges.txt, size: 1671853, sha256: 8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5}
      - {path: openvino_config.json, size: 1436, sha256: 2e353ec70d54f40d68646e0178a1d3cef31144b2d97254c992f7882148b8fe74}
      - {path: openvino_detokenizer.bin, size: 2189717, sha256: d73093f72c80ebcaffb76a192727170ecd3c6a06c4df52df0e76b3f70ad9d7f7}
      - {path: openvino_detokenizer.xml, size: 12382, sha256: ceccf1505fc61ede06a3ee29e625c3a22c9dafb834d4637549dc30bb3bee2eba}
      - {path: openvino_model.bin, size: 616316780, sha256: b88066b1898f5e74eb31fe87578f10ab3d01709765a09bd8c4ea4fe256f62bb4}
      - {path: openvino_model.xml, size: 2444999, sha256: fc0218b8973d09f43e7f8175760b69d4f2a9c9bab6e354aca8cee639d9b57e15}
      - {path: openvino_tokenizer.bin, size: 5588840, sha256: 1c7f757b411ea311555082721b54f4519d4127f4907674390a3ebd5fc40bc8d6}
      - {path: openvino_tokenizer.xml, size: 30729, sha256: 08c80a3d21e2561fe3e48378f53802603d20f9dc5edc28e8979d268b22d25be7}
      - {path: special_tokens_map.json, size: 613, sha256: 76862e765266b85aa9459767e33cbaf13970f327a0e88d1c65846c2ddd3a1ecd}
      - {path: tokenizer.json, size: 11423705, sha256: def76fb086971c7867b829c23a26261e38d9d74e02139253b38aeb9df8b4b50a}
      - {path: tokenizer_config.json, size: 5404, sha256: 443bfa629eb16387a12edbf92a76f6a6f10b2af3b53d87ba1550adfcf45f7fa0}
      - {path: vocab.json, size: 2776833, sha256: ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910}
  # The OVMS graph. truncate: false with max_length makes an input longer
  # than max_length real tokens fail with HTTP 400 ("Input length N longer
  # than allowed M") instead of being cut silently. LAST pooling and
  # normalisation are what this model needs.
  #
  # Long-input qualification on normandy, 2026-10-24, under the stack's
  # limits (2 GiB, 2 CPUs, one stream, one input per request), real token
  # counts from the server, peak = cgroup memory.peak:
  #   ~500 tokens     3.1 s   0.78 GB
  #   ~2000 tokens   18.5 s   1.03 GB   (two clients: queued, 1.12 GB)
  #   ~4100 tokens   55.5 s   1.35 GB
  #   ~6000 tokens   92-108 s 1.75 GB
  #   ~8000 tokens   OOM-killed
  #   4 x ~2000 tokens in one request: OOM-killed
  # So max_length 6144 is the largest qualified input, and clients must send
  # one input per request, one request at a time (OpenViking 0.5.2's OpenAI
  # embedder sends one input per request; set embedding.max_concurrent: 1).
  # OpenViking's own embedding.max_input_tokens cuts at 4 characters per
  # estimated token; this corpus measured 2.85-2.98 characters per real
  # token, so 3584 (14336 characters, about 5000 real tokens) stays under
  # 6144 with margin. No retrieval-quality evaluation is implied by these
  # numbers.
  graph:
    pooling: LAST
    normalize: true
    max_length: 6144
    num_streams: 1
    # Matches the service's CPU limit in stack.yml.
    threads: 2
