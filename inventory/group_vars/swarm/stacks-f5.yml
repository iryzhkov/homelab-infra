---
# Phase 5 batch F5 (logging): Loki, Grafana and InfluxDB as one stack.
# docs/transition/phase5/migration-plan.md; evidence and cutover record in
# docs/transition/phase5/2026-10-03-F5.md.
#
# NOT ACTIVE YET: the entry is in pending_swarm_stacks_f5, which nothing
# reads (only swarm_stacks_* variables are). Activate it at the cutover by
# moving it into a list named swarm_stacks_f5 in this file, then run, in
# order:
#   ansible-playbook playbooks/swarm.yml --tags stacks -e only=logging -e swarm_cutover=logging
#   ansible-playbook playbooks/traefik.yml
#   ansible-playbook playbooks/site.yml -l homelab,normandy -e only=gatus
#   ansible-playbook playbooks/backup.yml -l homelab,normandy
#   ansible-playbook playbooks/base.yml -l homelab,normandy,blackpearl
# The last one writes loki_push_url and the non-blocking log mode into each
# Docker daemon's daemon.json (roles/base, tasks/docker_logging.yml), which
# activates itself once `logging` is a Swarm stack; it takes effect at each
# daemon's next restart. public-api is left to the phase 4 owner.
#
# Before the cutover, roles/backup/files/homelab-influx-backup has to find
# the Swarm task instead of a container named `influxdb` (batch B's file; see
# the F5 evidence file).

pending_swarm_stacks_f5:
  - name: logging
    pin: homelab
    secrets: homelab-logging
    prepare_tasks: swarm-prepare.yml
    compose:
      host: homelab
      dir: "{{ hostvars['homelab'].stack_root }}/logging"
      project: logging
    routes:
      - host: logs.ryzhkov.dev
        port: 3200
    snapshot:
      class: sqlite
      sqlite:
        - { name: grafana, path: /srv/swarm/logging/grafana/grafana.db, keep: 48 }
      # Loki's chunks and index, InfluxDB's TSM files and bolt database, and
      # the configuration. Mirrored live, so InfluxDB's copy is
      # crash-consistent at best; the daily `influx backup` archive is the
      # consistent one, and a move copies everything cold.
      files:
        - /srv/swarm/logging/grafana
        - /srv/swarm/logging/loki
        - /srv/swarm/logging/config
        - /srv/swarm/logging/influxdb
      exclude: [grafana.db, grafana.db-*]
