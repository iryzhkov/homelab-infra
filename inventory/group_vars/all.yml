---
# Traefik's dynamic configuration is generated from the stack lists in
# host_vars, so a service's backend address follows the host it runs on. Moving
# a stack between machines is an edit to one `stacks:` entry.

# Where the generated file is written on the edge_proxy host. Traefik's file
# provider watches this directory and hot-reloads, so no restart is needed.
traefik_dynamic_dir: /home/igor/apps/traefik/file_provider

# Defaults every generated router and service inherits.
traefik_entrypoint: websecure
traefik_cert_resolver: letencrypt   # the misspelling is the resolver's real name
traefik_health_check:
  path: /
  interval: 30s
  timeout: 5s

# Routes whose backend is not a Compose stack this repository deploys: Home
# Assistant runs as its own VM, Zigbee2MQTT in an LXC.
traefik_static_routes:
  - host: home.ryzhkov.dev
    url: http://192.168.70.93:8123
  - host: zigbee.ryzhkov.dev
    url: http://192.168.70.235:8080

# Gatus pings the MQTT broker host from both LAN probes.
mqtt_broker_ip: 192.168.70.241

# Current Cloudflare Tunnel hostnames with matching Ansible routes. Public
# checks are generated from those routes and run on OCI, outside the LAN DNS.
# emby.ryzhkov.dev is excluded because its public A record points to OCI itself.
gatus_public_hosts:
  - home.ryzhkov.dev
  - budget.ryzhkov.dev
  - uptime.ryzhkov.dev
  - request.ryzhkov.dev
  - photos.ryzhkov.dev
  - manga.ryzhkov.dev
  - obsidian.ryzhkov.dev
  - auth.ryzhkov.dev
  - rss.ryzhkov.dev
  - speed.ryzhkov.dev
  - draw.ryzhkov.dev
  - git.ryzhkov.dev
  - blog.ryzhkov.dev
  - irc.ryzhkov.dev
  - igor.ryzhkov.dev
  - vault.ryzhkov.dev

# Public services hosted on OCI are checked from each LAN Gatus instance with
# a public DNS resolver, so probes follow the actual Internet route to OCI.
# Coordinator worker IDs (gaming-pc is called omarchy-pc in steward).
gatus_steward_worker_ids:
  - homelab
  - normandy
  - omarchy-pc

gatus_public_from_lan:
  - emby.ryzhkov.dev

# Dynamic configuration the generator has no shape for, because each is a
# single instance rather than a pattern. Those with addresses in them are
# rendered so the addresses still come from the inventory; the other two have
# none to speak of.
#   admin.yml     Proxmox across both nodes with a sticky cookie
#   whisper.yml   the whisper failover pair and its path-rewriting middleware
#   t3.yml        T3 Code, including the laptop's LAN-to-mesh failover pair.
#                 Its addresses are still literal (two of its four backends
#                 are machines this inventory does not describe, and one is a
#                 Nebula address); it is rendered for the routers' tls block.
#   cartest.yml   the Bellerophon test car on gaming-pc, adopted from
#                 public-api on 2026-10-02
traefik_rendered_files:
  - admin.yml
  - whisper.yml
  - t3.yml
  - cartest.yml
#   catchall.yml  the wildcard-certificate 404 for unclaimed hostnames
traefik_static_files:
  - catchall.yml

# AdGuard Home runs in three LXCs rather than as containers on a Docker host.
# All three are listed because adguardhome-sync's configuration is generated
# from this list, but only the origin's AdGuard configuration is deployed:
# the sync propagates it to the replicas, and pushing to them here would fight
# it. Reference copies of the replicas' configurations are kept in
# roles/adguard/files/reference/ for a rebuild from scratch.
adguard_instances:
  - name: ct100
    role: origin
    node: proxmox-a
    ctid: 100
    ip: 192.168.20.154
  - name: ct107
    role: replica
    node: proxmox-a
    ctid: 107
    ip: 192.168.20.106
  - name: ct201
    role: replica
    node: proxmox-b
    ctid: 201
    ip: 192.168.20.83     # Alpine, unlike the other two
adguard_origin: "{{ adguard_instances | selectattr('role', 'equalto', 'origin') | first }}"
adguard_replicas: "{{ adguard_instances | selectattr('role', 'equalto', 'replica') | list }}"
adguard_web_port: 3000
adguard_config_path: /opt/AdGuardHome/AdGuardHome.yaml
adguard_binary: /opt/AdGuardHome/AdGuardHome
# Resolved through the origin after a restart to prove it is still answering.
# A name from the wildcard rewrite, so it also proves the rewrite survived.
adguard_probe_name: vault.ryzhkov.dev

# Where AdGuard's *.ryzhkov.dev wildcard points: whichever host runs Traefik.
# This is the other half of the DNS story. Traefik's routing follows the host a
# stack runs on; the name that reaches Traefik at all follows the host Traefik
# runs on.
# Since the phase 4 cutover (2026-10-02) that is the edge VIP, held by
# whichever edge_proxy member keepalived elects. Rollback: point it back at
# "{{ hostvars[groups['edge_proxy'][0]].ansible_host }}".
edge_proxy_ip: "{{ edge_vip }}"

# The VRRP address keepalived floats between the edge_proxy members
# (roles/keepalived), reserved on VLAN 20 outside the DHCP pool.
edge_vip: 192.168.20.3

# Dedicated TLS push-only ingest port; never a Cloudflare Tunnel route.
observability_enabled: true
observability_ingest_port: 8443
observability_ingest_backend_port: 8429

# Machine-to-machine SSH inside the fleet. A key listed here is authorised on
# the hosts whose host_vars name it in fleet_ssh_authorized, restricted to the
# address it is expected to come from.
fleet_ssh_keys:
  # homelab's nightly drift check of the peers it checks on their behalf
  # (drift_check_peers): a key that exists for nothing else, generated on
  # homelab on 2026-10-12 as ~/.ssh/id_ed25519_drift, and able to run only
  # the checker. It replaced homelab's general key, retired on 2026-10-05,
  # which the check had been using without that being written down.
  drift-check:
    comment: "homelab drift check of peers (forced command)"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPjGgvZhlCCwRx435OenZCpB6uX9LZ1BjWYaikCQtzFn"
    from: "192.168.70.223"
    command: ".local/bin/homelab-drift-check"
  # The t3-steward coordinator on normandy, which opens a persistent SSH
  # connection to each worker. It is normandy's general key, not one dedicated
  # to the steward; the agent VMs accept no other fleet key.
  steward:
    comment: "normandy (t3-steward coordinator)"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKm/OEz7CglgwvsF+vH0KgzkNzLsGuT5Tw9Qd7B3L+yc"
    from: "192.168.70.234"

# Forgejo, reached over SSH by the forgejo_clients group. The port is the one
# stacks/forgejo publishes; the host key was read from the running container
# on 2026-09-08 and is pinned on every client.
forgejo_host: homelab
forgejo_ssh_domain: git.ryzhkov.dev
forgejo_ssh_port: 2222
forgejo_ssh_host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICXpj9s8hjZwEREUJl27+OmioPhzFrLi6djUcCsDthmQ"

# Where Forgejo's system webhook posts, and where the handlers live on that
# host. 4581 is the port the retired hugo-webhook binary used.
forgejo_webhooks_port: 4581
forgejo_webhooks_dir: "/home/iryzhkov/app/webhook"

# The fleet activity feed, which the drift check reports into. It runs as a
# systemd service on homelab rather than as a Compose stack, so its address is
# taken from the host rather than from a stack.
feed_host: homelab
feed_url: "http://{{ hostvars[feed_host].ansible_host }}:1934"

# Pinged over the mesh after a Nebula restart, to prove the tunnel came back
# before the change is accepted: the lighthouse, and a peer that is not it.
nebula_probe_hosts:
  - 10.42.0.1
  - 10.42.0.2

# notify-relay runs as a systemd service on homelab and pushes to the phone
# over Nebula. Failures and drift go there as well as to the feed.
notify_relay_host: homelab

# The offsite bundle. Small, encrypted, and carried out of the house by the
# phone; see docs/offsite-bundle.md.
offsite_stage: /mnt/backup/offsite
# Where the bundle is copied. Every reachable target gets a copy on every run;
# a target that is asleep or away is skipped and tried again next time.
#
# The names are the aliases fleet_ssh writes into the sending host's ssh
# config, so each carries its own address, user and port.
offsite_targets:
  # Always online and genuinely offsite, in San Jose. The reliable one.
  - name: oci
    host: oci
    path: homelab-offsite
    keep: 7
  # Leaves the house daily, but only reachable when it is awake and on the
  # mesh.
  - name: phone
    host: phone
    path: homelab-offsite
    keep: 7
  # 126 MB of internal flash on a router whose NAND is not meant for this, so
  # two bundles and no more. Offsite only while travelling.
  - name: travel-router
    host: travel-router
    path: /root/offsite
    keep: 2
offsite_keep: 7
# Where the controller prepares the items it contributes to the bundle.
offsite_local_work: "{{ lookup('env', 'HOME') }}/.cache/homelab-offsite"
# The recovery key's private half is in Vaultwarden and on paper, and is on no
# machine in this house by design. Losing it means the bundle is unreadable;
# that is the trade for a stolen phone yielding nothing.
offsite_recipient: age1us6n6ky6yf6fz084hhw35rzd3xnsra5fazt9dgmc7lqsfhvwqupqpu74ju

# SMART health of the hypervisors' physical drives (roles/base). Points go to
# the `smart` bucket of the independently pinned legacy-influx stack, with a
# write-only token; health results go to the Gatus instance that owns alerts,
# as one external endpoint per drive listed in the hypervisor's smart_drives.
# Playbook: playbooks/base.yml.
smart_influx_url: "http://{{ hostvars | stack_host_ip(groups, 'legacy-influx') }}:8087"
smart_influx_org: ryzhkov
smart_influx_bucket: smart
# 400 days, so a year-on-year wear comparison is always possible.
smart_influx_retention_seconds: 34560000
smart_gatus_host: normandy
smart_gatus_group: SMART
# Three missed 15-minute runs before Gatus calls a silent drive unhealthy.
smart_heartbeat: 45m

# Compose stacks that can run on either household worker (plan phase 7: Emby
# and Immich follow a host drain, without the other host's iGPU). Every other
# Compose stack is a literal entry in its host's `host_stacks` (or `stacks`)
# list. A host's `stacks`, which every consumer reads (site.yml, the Traefik
# generator and the stacks filters, Gatus, the drift manifest), is its own
# list plus the movable stacks placed on it, so moving one is a change of
# placement and nothing else.
#
# compose_placement_home is where each one lives normally. During a host
# drain, playbooks/compose-move.yml writes the temporary placement to
# compose_placement_override_file on the controller (the laptop), and
# playbooks/host-return.yml removes it, so every playbook run from the laptop
# in between converges the stack where it actually runs. A run from another
# machine does not see the override: run nothing that converges these stacks
# from elsewhere while the file exists (runbook-host-maintenance.md).
compose_placement_home:
  emby: homelab
  immich: normandy
compose_placement_override_file: "{{ lookup('env', 'HOME') }}/.local/state/homelab-infra/compose-placement.yml"
compose_placement: >-
  {{ compose_placement_home
     | combine(lookup('ansible.builtin.file', compose_placement_override_file, errors='ignore')
               | default('', true) | from_yaml | default({}, true)) }}

# The directories that hold each movable stack's state, per worker. They are
# copied by compose-move.yml (warm while running, then cold while stopped).
# On the home host they are where the state always was; on the other worker
# they are on its pool disk, out of the root disk.
compose_data_dirs:
  emby:
    homelab: /home/iryzhkov/app/emby
    normandy: /mnt/data/compose/emby
  immich:
    normandy: /mnt/data/immich/postgres
    homelab: /mnt/docker-data/compose/immich/postgres

# The stack entries themselves, in the shape of a host_vars `stacks` entry.
# Everything host-specific is templated from the host the entry lands on:
# HOST_IP (compose_stack), stack_root, the data directory above, and the
# iGPU's group IDs and udev path (`igpu` in each worker's host_vars).
compose_movable_stacks:
  emby:
    name: emby
    routes:
      - host: emby.ryzhkov.dev
        port: 8096
    prepare_tasks: prepare.yml
    env_extra:
      EMBY_CONFIG: "{{ compose_data_dirs.emby[inventory_hostname] }}"
      EMBY_GIDLIST: "1000,{{ igpu.render_gid }},{{ igpu.video_gid }}"
  immich:
    name: immich
    routes:
      - host: photos.ryzhkov.dev
        port: 2283
    # immich keeps its upstream layout: the project directory is immich-stack
    # and the Compose file reads stack.env rather than .env.
    dir: "{{ stack_root }}/immich-stack"
    env_file: stack.env
    secrets: normandy-immich
    prepare_tasks: prepare.yml
    env_extra:
      DB_DATA_LOCATION: "{{ compose_data_dirs.immich[inventory_hostname] }}"
    config_templates:
      # Read by the Compose file's `extends:` for the ML container.
      - src: hwaccel.ml.yml
        dest: hwaccel.ml.yml

# Every Docker host's stack list: its own entries plus the movable stacks
# placed on it, in name order (the order the host lists were written in, so
# generated files such as Gatus's configuration do not change when a stack
# merely moves). Hosts that spell out `stacks` in host_vars override this.
stacks: >-
  {{ ((host_stacks | default([]))
      + (compose_movable_stacks | dict2items
         | selectattr('key', 'in', compose_placement | dict2items
                      | selectattr('value', 'equalto', inventory_hostname)
                      | map(attribute='key') | list)
         | map(attribute='value') | list))
     | sort(attribute='name') }}

# Proxmox's built-in external metric server (node and guest CPU, memory, disk
# and network, every 10 seconds) writes here with its own write-only token.
# 90 days rather than 400: this is the high-volume one, and homelab's disk is
# the one under pressure.
proxmox_influx_bucket: proxmox
proxmox_influx_retention_seconds: 7776000
# The cluster-wide metric server entry, in /etc/pve/status.cfg.
proxmox_metric_server_id: homelab-influx
