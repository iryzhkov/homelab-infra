---
# The machines this repository manages. Addresses and roles are mirrored from
# the homelab-infrastructure notes in OpenViking; the SSH aliases are the ones
# already configured in ~/.ssh/config on the laptop, so ansible_host is only
# spelled out where the alias and the inventory name differ.
#
# Proxmox hosts, the UDM Pro and Home Assistant are listed for reference but
# are not converged by any playbook yet: their configuration is captured by
# scripts/snapshot.sh only.

all:
  vars:
    ansible_user: "{{ ssh_user }}"
    ansible_python_interpreter: /usr/bin/python3

  children:

    # The Chaldea trust publisher runs on the same machine as the `normandy` host
    # below (VM 202, 192.168.70.234, hostname omarchy-normandy). It is listed under
    # its own name so that only chaldea-signer.yml targets it through this group;
    # it has no agent, Docker or Swarm group membership under this name.
    chaldea_publishers:
      hosts:
        omarchy-normandy:
          ansible_host: 192.168.70.234
          ssh_user: igor
          description: Always-on Omarchy Arch x86_64 trust publisher

    # Hosts that run Docker Compose stacks managed from this repository.
    docker_hosts:
      hosts:
        homelab:
          ansible_host: 192.168.70.223
          mesh_host: 10.42.0.2
          ssh_user: iryzhkov
          stack_root: /home/iryzhkov/app
          description: Main application server, VM 101 on proxmox-a
          observability_guest_id: qemu/101
        public-api:
          ansible_host: 192.168.20.33
          mesh_host: 10.42.0.3
          ssh_user: igor
          stack_root: /home/igor/apps
          description: Edge reverse proxy, all external traffic, VM 106 on proxmox-a
          observability_guest_id: qemu/106
        normandy:
          ansible_host: 192.168.70.234
          ssh_user: igor
          stack_root: /home/igor/app
          description: GPU application VM 202 on proxmox-b, Immich and Frigate
          observability_guest_id: qemu/202
        blackpearl:
          ansible_host: 192.168.60.53
          ssh_user: iryzhkov
          stack_root: /home/iryzhkov/apps
          description: Torrent stack behind gluetun, VM 102 on proxmox-a
          observability_guest_id: qemu/102
        # Listed after public-api, so that stack_host('traefik') and every
        # other first-member lookup still answer public-api. Its variables are
        # in host_vars/public-api-b.yml.
        public-api-b:

    # The Docker Swarm (phase 5 of the serviceable transition): three
    # managers. The control plane (raft, gossip) runs over Nebula on the mesh
    # addresses; the VXLAN data path stays on VLAN 70 between the two
    # household workers. OCI is a manager with availability drain: it runs no
    # tasks and carries no VXLAN. Nothing else joins: agent VMs, gaming-pc and
    # the laptop are steward workers, not Swarm nodes. Group variables are in
    # group_vars/swarm/; playbooks/swarm.yml converges it
    # (docs/transition/phase5/2026-10-03-foundation.md).
    #   swarm_advertise_addr the mesh address raft and gossip use
    #   swarm_data_path_addr the address VXLAN uses
    #   swarm_pool_path      a worker's ZFS-backed data disk; Swarm state for
    #                        stateful services lives under it
    #   swarm_iface          a worker's VLAN 70 interface (data path)
    #   swarm_ingress_blocked_ifaces  interfaces from which the routing mesh
    #                        must not be reachable
    swarm:
      children:
        swarm_workers:
          hosts:
            homelab:
              swarm_pool_path: /mnt/docker-data
              swarm_iface: ens18
              swarm_ingress_blocked_ifaces: [nebula1]
            normandy:
              # normandy has no mesh_host in this inventory; 10.42.0.7 is the
              # address of its nebula1 (checked 2026-10-02).
              swarm_advertise_addr: 10.42.0.7
              swarm_pool_path: /mnt/data
              # ens18 is normandy's VLAN 60 NIC; Swarm must neither use it
              # nor publish the routing mesh there.
              swarm_iface: ens19
              swarm_ingress_blocked_ifaces: [ens18, nebula1]
        swarm_drain_managers:
          hosts:
            oci:
              swarm_availability: drain
              # It carries no tasks and so no VXLAN; the flag still needs an
              # address, and the mesh one keeps it off the public NIC.
              swarm_data_path_addr: 10.42.0.1
              # Hand-written iptables-persistent ruleset; the role edits
              # /etc/iptables/rules.v4 and the live tables together.
              swarm_firewall: iptables_persistent
              swarm_node_labels:
                host: oci

    # The edge proxy, as a group so that playbooks name a role rather than a
    # machine: moving Traefik means moving this membership. Every member runs
    # the same Traefik with the same routes. The first member is the one
    # edge_proxy_ip names until the VIP cutover (phase 4), and the VRRP
    # priority falls with the position in this list.
    edge_proxy:
      hosts:
        public-api:
        public-api-b:

    # Hosts whose Nebula configuration this repository holds; the others still
    # carry hand-written configs. public-api-b's Nebula is also installed from
    # here (nebula_install).
    nebula_managed:
      hosts:
        public-api:
        public-api-b:
        proxmox-a:
        proxmox-b:

    # The agent VMs (phase 6 of the serviceable transition, 2026-10-03): steward
    # workers that run agent code away from the household VMs, on their own
    # VLAN 130 ("Agents", 192.168.130.0/24, its own UniFi zone). The UniFi
    # policies allow them only the edge VIP on 443, AdGuard DNS, Nebula and the
    # internet, and let only the laptop and the steward coordinator reach them
    # on 22; see docs/transition/phase6/2026-10-03-agent-vlan.md. Their shared
    # settings are in group_vars/agent_workers.yml. Not in docker_hosts: no
    # Compose stack is deployed to them. Not in nebula_managed either: the
    # household nodes' hand-written Nebula firewalls accept any peer, so an
    # agent on the mesh would bypass the VLAN. They join only once those
    # firewalls are managed here and deny the `agent` group. mesh_host is
    # their reserved mesh address, unused until then.
    agent_workers:
      hosts:
        agent-a:
          ansible_host: 192.168.130.2
          mesh_host: 10.42.0.11
          ssh_user: igor
          description: Agent VM 111 on proxmox-a, 10 vCPU and 20 GB, the large-run class
          observability_guest_id: qemu/111
        agent-b:
          ansible_host: 192.168.130.3
          mesh_host: 10.42.0.12
          ssh_user: igor
          description: Agent VM 211 on proxmox-b, 4 vCPU and 4 GB, the small-run class
          observability_guest_id: qemu/211

    # The Proxmox node hosting the AdGuard origin LXC, as a group for the same
    # reason as edge_proxy: the playbook names a role, not a machine.
    adguard_origin_node:
      hosts:
        proxmox-a:

    # The host that receives Forgejo's webhooks and runs the handlers: the one
    # the blog is built on.
    forgejo_webhook_host:
      hosts:
        homelab:

    # Hosts that clone from Forgejo over SSH: the T3 agent hosts.
    forgejo_clients:
      hosts:
        homelab:
        normandy:
        gaming-pc:

    # Debian LXCs: collection through pct on their owning hypervisor, no new
    # SSH server or application restart inside a container.
    observability_lxc:
      vars:
        observability_host_kind: lxc
        ansible_connection: community.proxmox.proxmox_pct_remote
        ansible_user: root
        ansible_become: false
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        observability_alloy_memory_max: 192M
        observability_alloy_memory_high: 128M
      hosts:
        ct100:
          observability_alloy_enabled: false
          ansible_host: "{{ hostvars['proxmox-a'].ansible_host }}"
          proxmox_vmid: 100
        ct104:
          observability_alloy_enabled: false
          ansible_host: "{{ hostvars['proxmox-a'].ansible_host }}"
          proxmox_vmid: 104
        ct105:
          ansible_host: "{{ hostvars['proxmox-a'].ansible_host }}"
          proxmox_vmid: 105
        ct107:
          observability_alloy_enabled: false
          ansible_host: "{{ hostvars['proxmox-a'].ansible_host }}"
          proxmox_vmid: 107

    # Explicit physical hardware owners; no application or fleet convergence.
    observability_hardware_hosts:
      hosts:
        proxmox-a:
        proxmox-b:
        gaming-pc:
        laptop:

    observability_native_gpu_hosts:
      hosts:
        gaming-pc:

    # One active native Home Assistant scraper; move this membership to relocate.
    observability_homeassistant_scrapers:
      hosts:
        proxmox-a:

    # Change this single membership to move the native network poller.
    observability_unifi_pollers:
      hosts:
        homelab:

    # Collection-only clients; excluded from household convergence roles.
    observability_clients:
      hosts:
        laptop:
          ansible_connection: local
          ansible_host: 192.168.90.163
          mesh_host: 10.42.0.5
          ssh_user: igor
          description: Intermittent arm64 interactive client, observability only

    # Machines nothing is deployed to, listed because other hosts' services
    # point at them and should take the address from here rather than from a
    # literal in a Compose file.
    external:
      hosts:
        home-assistant:
          description: Home Assistant OS, VM 103 on proxmox-a; reference metadata only
          observability_host_kind: vm
          observability_guest_id: qemu/103
          observability_alloy_enabled: false
          observability_host_capabilities: []
        gaming-pc:
          ansible_host: 192.168.90.212
          ssh_user: igor
          description: Desktop; runs Ollama on 11434 and a whisper.cpp server on 8080
        travel-router:
          # GL-MT3000, on the mesh wherever it is. Offsite only while it is
          # actually travelling, and its 126 MB of internal flash is why it
          # keeps two bundles rather than seven.
          ansible_host: 10.42.0.4
          ssh_user: root
          description: Portkey travel router; carries the offsite bundle when away
        phone:
          # Reached over the mesh, because it is only on the home network some
          # of the time and the point of it is that it leaves.
          ansible_host: 10.42.0.25
          ssh_user: u0_a612
          ssh_port: 8022
          description: S25 Ultra, Termux; carries the encrypted offsite bundle

    # Hypervisors. Converged by playbooks/base.yml (SMART health and hwmon
    # temperatures of the physical drives, and the cluster's metric server),
    # playbooks/nebula.yml and playbooks/adguard.yml; everything else on them
    # is captured by scripts/snapshot.sh only.
    hypervisors:
      hosts:
        proxmox-a:
          ansible_host: 192.168.1.5
          mesh_host: 10.42.0.8
          ssh_user: root
          description: hp-elite-mini-01
        proxmox-b:
          ansible_host: 192.168.1.29
          mesh_host: 10.42.0.9
          ssh_user: root
          description: hp-workstation-01

    # Cloud footprint. The standby target is not provisioned yet; oci is the
    # existing micro instance that carries the Nebula lighthouse and the Emby
    # reverse proxy, and is too small to hold the standby stacks.
    cloud:
      hosts:
        oci:
          ansible_host: 150.230.40.9
          # Reached over Nebula by other fleet hosts, so their traffic stays
          # inside the mesh and the from= restriction on their authorised key
          # sees a mesh address rather than the house's WAN address.
          mesh_host: 10.42.0.1
          ssh_user: ubuntu
          # Naming the address bypasses the "Host oci" block in ~/.ssh/config,
          # so the key that block would have supplied is named here instead.
          ansible_ssh_private_key_file: ~/.ssh/oci
          description: OCI micro, Nebula lighthouse and Caddy for emby.ryzhkov.dev
