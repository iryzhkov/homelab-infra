---
# Adopted 2026-09-06.
#
# Every host runs its own diun with a different Compose file, so each keeps its
# own directory under stacks/ and names it with `source`.

# Added 2026-09-06 so homelab can reach the edge proxy. Restricted to
# homelab's address by the from= option the role applies.
fleet_ssh_authorized:
  - homelab

# The drift check runs here as well. This host needed lingering enabled and
# homelab-cli installed first, on 2026-09-06.
drift_check_enabled: true
# Checked, but not reporting: the Public API VLAN is not permitted to reach the
# feed on homelab, and opening that path so the edge proxy could write into a
# LAN service would be the wrong trade. homelab runs this host's check over SSH
# and posts the result.
drift_check_reports: false

stacks:
  - name: traefik
    routes:
      # Traefik's own dashboard, proxied through itself. The published port is
      # bound to 127.0.0.1 on the host, so routing to public-api's LAN address
      # returned 502; from inside Traefik's own network namespace the API is on
      # loopback, which is what it reaches here.
      #
      # Deliberately left without authentication (decided 2026-09-06): it is
      # reachable from the LAN only, since no Cloudflare Tunnel hostname points
      # at it. Do not add authentik-forwardauth here without asking.
      - host: proxy.ryzhkov.dev
        url: http://127.0.0.1:8080
    secrets: public-api-traefik
    # The static configuration, adopted 2026-10-02 byte for byte from the
    # hand-written file, so both edge VMs get the same one.
    config_templates:
      - src: traefik.yml.j2
        dest: traefik.yml
  - name: diun
    source: diun-public-api
