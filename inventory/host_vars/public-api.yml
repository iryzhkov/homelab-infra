---
# Adopted 2026-09-06.
#
# Every host runs its own diun with a different Compose file, so each keeps its
# own directory under stacks/ and names it with `source`.

stacks:
  - name: traefik
    routes:
      # Traefik's own dashboard, proxied through itself. The published port is
      # bound to 127.0.0.1 on the host, so routing to public-api's LAN address
      # returned 502; from inside Traefik's own network namespace the API is on
      # loopback, which is what it reaches here.
      #
      # Deliberately left without authentication (decided 2026-09-06): it is
      # reachable from the LAN only, since no Cloudflare Tunnel hostname points
      # at it. Do not add authentik-forwardauth here without asking.
      - host: proxy.ryzhkov.dev
        url: http://127.0.0.1:8080
    secrets: public-api-traefik
  - name: diun
    source: diun-public-api
