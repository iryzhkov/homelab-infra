---
observability_host_capabilities:
  - {capability: smart, mode: physical}
  - {capability: temperature, mode: physical}
# hp-workstation-01.

# ZFS ARC cap, 2 GiB (32 GB of RAM, most of it given to guests).
zfs_arc_max_bytes: 2147483648

observability_file_inputs:
  - {path: /var/log/pve/tasks/active, job: pve-tasks}
observability_syslog_guest: {name: ct201, address: 192.168.20.83}
observability_alpine_forwarding_verified: true
observability_alpine_promtail_retire: true

# Physical drives, as smartctl names them. See host_vars/proxmox-a.yml.
smart_drives:
  - model: WD PC SN810 SDCPNRY-256G-1006   # WD SN810 256 GB NVMe, boot
    serial: "231231800792"
    transport: nvme
  - model: CT1000BX500SSD1                 # Crucial BX500 1 TB SATA
    serial: "2438E98C8AD2"
    transport: sata
