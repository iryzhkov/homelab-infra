---
# Every Compose project running on homelab, adopted 2026-09-06.
#
# `dir` appears where the running project is not at stack_root/<name>:
# cv-site lives outside ~/app entirely, and hugo's project directory is the
# deploy subdirectory of the blog checkout.
#
# flaresolverr needed playbooks/adopt-flaresolverr.yml first: it ran from
# `docker run` with no Compose labels, so the container had to be removed
# before Compose could own the name.

# homelab reaches these by name, as the right user. It already had normandy;
# public-api was added on 2026-09-06.
fleet_ssh_peers:
  - normandy
  - public-api
  # The phone, for the offsite bundle. Reached over the mesh; its key on the
  # phone is restricted to homelab's mesh address.
  - phone

# homelab builds the offsite bundle: it holds the snapshots, the rclone
# credentials and the SOPS key that go into it.
offsite_enabled: true

# Backups this repository owns, on top of the twice-weekly cron jobs. The
# 2026-09-06 restore test found the SQLite databases were being copied live as
# three separate files, and InfluxDB not at all.
backup_root: /home/iryzhkov/app/backups
backup_sqlite_sources:
  vaultwarden:
    path: /home/iryzhkov/app/vaultwarden/data/db.sqlite3
    keep: 48
  actual-account:
    path: /home/iryzhkov/app/actual/server-files/account.sqlite
    keep: 48
  # One database per budget, named after a UUID. A glob so that a budget added
  # later is backed up without an edit here.
  actual-budget:
    glob: /home/iryzhkov/app/actual/user-files/*.sqlite
    keep: 48

# public-api cannot reach the feed from its VLAN, so homelab runs its check
# over SSH and reports for both.
drift_check_peers:
  - public-api

# The drift check runs here: homelab holds most of the fleet's stacks, and the
# feed service it reports into runs on this host too.
drift_check_enabled: true

stacks:
  - name: actual
    routes:
      - host: budget.ryzhkov.dev
        port: 5006
  - name: adguard
    # adguardhome-sync, not AdGuard itself: it copies the origin LXC's
    # configuration to the two replicas. Its config file names all three, and
    # is generated from adguard_instances so the addresses are stated once.
    routes:
      - host: dns-sync.ryzhkov.dev
        port: 8321
        # adguardhome-sync answers 401 on / and 200 on /healthz.
        health_check:
          path: /healthz
    config_templates:
      - src: adguardhome-sync.yaml.j2
        dest: adguardhome-sync.yaml
        # World-readable because the container runs as uid 1001 and has to read
        # it; it was mode 777 before this repository took it over. The
        # credentials in it are the reason to move them to environment
        # variables one day.
        mode: "0644"
    secrets: homelab-adguard-sync
    # The credentials are used by the template above, not by Compose, so there
    # is no reason to write them a second time into a .env.
    write_env: false
  - name: authentik
    routes:
      - host: auth.ryzhkov.dev
        port: 4080
    secrets: homelab-authentik
  - name: autobrr
    routes:
      - host: autobrr.ryzhkov.dev
        port: 7474
  - name: bazarr
    routes:
      - host: bazarr.ryzhkov.dev
        port: 6767
  - name: cloudflare
    secrets: homelab-cloudflare
  - name: cv-site
    routes:
      - host: igor.ryzhkov.dev
        port: 8091
    dir: /home/iryzhkov/cv-site
    env_extra:
      # Immich moved to normandy on 2026-08-30 and this kept pointing at
      # homelab, where nothing has answered on 2283 since. It now follows the
      # stack.
      IMMICH_URL: "http://{{ hostvars | stack_host_ip(groups, 'immich') }}:2283"
      # The port this used to name serves whisper.cpp now, not Ollama, so the
      # site was talking to a live server that does not speak the API.
      OLLAMA_URL: "http://{{ hostvars['gaming-pc'].ansible_host }}:11434"
    secrets: homelab-cv-site
  - name: dsh
    env_extra:
      OV_URL: "http://{{ hostvars | stack_host_ip(groups, 'openviking') }}:1933"
    routes:
      - host: ai.ryzhkov.dev
        port: 7100
        middlewares:
          - authentik-forwardauth
      - host: ai.ryzhkov.dev
        name: ai-outpost
        path_prefix: /outpost.goauthentik.io/
        priority: 100
        service: auth
    secrets: homelab-dsh
  - name: emby
    routes:
      - host: emby.ryzhkov.dev
        port: 8096
  - name: excalidraw
    routes:
      - host: draw.ryzhkov.dev
        port: 5090
  - name: flaresolverr
  - name: forgejo
    routes:
      - host: git.ryzhkov.dev
        port: 3500
  - name: hugo
    routes:
      - host: blog.ryzhkov.dev
        port: 4580
    dir: /home/iryzhkov/app/hugo/blog/deploy
  - name: kiwix
    routes:
      - host: wiki.ryzhkov.dev
        port: 3151
  - name: komga
    routes:
      - host: manga.ryzhkov.dev
        port: 25600
  - name: kuma
    routes:
      - host: uptime.ryzhkov.dev
        port: 3001
  - name: librespeed
    routes:
      - host: speed.ryzhkov.dev
        port: 7080
  - name: lidarr-music
    routes:
      - host: lidarr.ryzhkov.dev
        port: 8686
        # / answers 401 or a redirect depending on the auth method; /ping is
        # the endpoint these apps provide for exactly this.
        health_check:
          path: /ping
  - name: logging
    routes:
      - host: logs.ryzhkov.dev
        port: 3200
    secrets: homelab-logging
  - name: lubelogger
    routes:
      - host: garage.ryzhkov.dev
        port: 8095
  - name: miniflux
    secrets: homelab-miniflux
    routes:
      - host: rss.ryzhkov.dev
        port: 5080
  - name: obsidian
    routes:
      - host: obsidian.ryzhkov.dev
        port: 5984
    secrets: homelab-obsidian
  - name: ombi
    routes:
      - host: request.ryzhkov.dev
        port: 3579
  - name: openviking
  - name: prowlarr
    routes:
      - host: prowlarr.ryzhkov.dev
        port: 9696
        # / answers 401 or a redirect depending on the auth method; /ping is
        # the endpoint these apps provide for exactly this.
        health_check:
          path: /ping
  - name: radarr-movie
    routes:
      - host: radarr.ryzhkov.dev
        port: 7878
        # / answers 401 or a redirect depending on the auth method; /ping is
        # the endpoint these apps provide for exactly this.
        health_check:
          path: /ping
  - name: sonarr-tv
    routes:
      - host: sonarr.ryzhkov.dev
        port: 8989
        # / answers 401 or a redirect depending on the auth method; /ping is
        # the endpoint these apps provide for exactly this.
        health_check:
          path: /ping
  - name: thelounge
    routes:
      - host: irc.ryzhkov.dev
        port: 9009
  - name: vaultwarden
    routes:
      - host: vault.ryzhkov.dev
        port: 8099
    secrets: homelab-vaultwarden
  - name: voice
    routes:
      - host: voice.ryzhkov.dev
        port: 8097
        # No health check, as before: this one has no unauthenticated endpoint
        # that returns 200.
        health_check: false
  - name: whisper
    # Publishes on the host's own address, so it needs HOST_IP and nothing else.
    env_extra: {}
  - name: wyoming-openai
    # Publishes on the host's own address, so it needs HOST_IP and nothing else.
    env_extra: {}
