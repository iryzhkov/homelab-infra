# autobrr as a Swarm stack (phase 5, batch F2). Deployed by
# playbooks/swarm.yml from its entry in inventory/group_vars/swarm/
# stacks-f2.yml; the Compose file beside this one stays until the phase 5
# cleanup. State lives in ${SWARM_STATE_ROOT}/autobrr/config on the node
# labelled pin.autobrr; it uses no NAS share.
#
# The image is the version the Compose project ran at conversion (v1.87.0,
# the digest :latest resolved to then), so the cutover does not upgrade it.

services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.87.0
    ports:
      - "7474:7474"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/autobrr/config
        target: /config
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.autobrr == true
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 40M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
