# Bazarr as a Swarm stack (phase 5, batch F2). Deployed by
# playbooks/swarm.yml from its entry in inventory/group_vars/swarm/
# stacks-f2.yml; the Compose file beside this one stays until the phase 5
# cleanup. State lives in ${SWARM_STATE_ROOT}/bazarr/config on the node
# labelled pin.bazarr; the NAS share is mounted at the same path on both
# workers.
#
# The image is the version the Compose project ran at conversion
# (v1.6.2-ls366, the digest :latest resolved to then), from lscr.io rather
# than Docker Hub (the same image; Hub's anonymous pull limit was hit on
# normandy on 2026-10-02), so the cutover does not upgrade it.

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls366
    ports:
      - "6767:6767"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/bazarr/config
        target: /config
      - type: bind
        source: /mnt/shared
        target: /mnt/shared
      - type: bind
        source: "/mnt/shared/media/tv shows"
        target: /tv
      - type: bind
        source: /mnt/shared/media/movies
        target: /movies
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.bazarr == true
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 272M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
