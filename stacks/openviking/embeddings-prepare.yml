---
# CPU runtimes need memory.swap.max=0. Swarm cannot express memory-swap;
# these two small Compose projects join an attachable overlay without ports.
- name: Load checksummed inference recipes
  ansible.builtin.set_fact:
    ov_inference_recipes: "{{ lookup('file', swarm_stack_src ~ '/recipes/models.json') | from_json }}"

- name: Create the private provider overlay on the Swarm manager
  community.docker.docker_network:
    name: "{{ openviking_inference_network }}"
    driver: overlay
    attachable: true
    scope: swarm
  delegate_to: homelab
  become: true

- name: Provision each CPU runtime
  ansible.builtin.include_tasks:
    file: "{{ swarm_stack_src }}/ollama-prepare.yml"
  loop: "{{ openviking_inference | dict2items }}"
  loop_control:
    loop_var: ov_provider

- name: Create the adapter source directory on homelab
  ansible.builtin.file:
    path: "{{ swarm_state_root }}/openviking-inference"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: homelab
  become: true

- name: Install the read-only embedding adapter
  ansible.builtin.copy:
    src: "{{ swarm_stack_src }}/files/embedding-adapter.py"
    dest: "{{ swarm_state_root }}/openviking-inference/embedding-adapter.py"
    owner: root
    group: root
    mode: "0444"
  delegate_to: homelab
  become: true

- name: Add adapter revision and path to the stack interpolation environment
  ansible.builtin.set_fact:
    swarm_stack_env: >-
      {{ swarm_stack_env | combine({
        'OPENVIKING_ADAPTER_PATH': swarm_state_root ~ '/openviking-inference/embedding-adapter.py',
        'OPENVIKING_ADAPTER_SHA256': lookup('file', swarm_stack_src ~ '/files/embedding-adapter.py', rstrip=false) | hash('sha256')
      }) }}
  no_log: true
