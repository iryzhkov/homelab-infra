---
# Stack-local adapter files and interpolation only. Provision runtimes/network
# explicitly through playbooks/ov-inference.yml before deploying the stack.
- name: Create the adapter source directory on homelab
  ansible.builtin.file:
    path: "{{ swarm_state_root }}/openviking/inference"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: homelab
  become: true

- name: Install the read-only inference adapter
  ansible.builtin.copy:
    src: "{{ swarm_stack_src }}/files/inference-adapter.py"
    dest: "{{ swarm_state_root }}/openviking/inference/inference-adapter.py"
    owner: root
    group: root
    mode: "0444"
  delegate_to: homelab
  become: true


- name: Create the pinned CPU tokenizer directory
  ansible.builtin.file:
    path: "{{ swarm_state_root }}/openviking/inference/cpu-tokenizer"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: homelab
  become: true

- name: Install immutable Qwen2 tokenizer and provenance config
  ansible.builtin.get_url:
    url: "https://huggingface.co/Qwen/Qwen2-1.5B-Instruct/resolve/ba1cf1846d7df0a0591d6c00649f57e798519da8/{{ item.name }}"
    dest: "{{ swarm_state_root }}/openviking/inference/cpu-tokenizer/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - name: tokenizer.json
      sha256: f7c9b2dba4a296b1aa76c16a34b8225c0c118978400d4bb66bff0902d702f5b8
    - name: tokenizer_config.json
      sha256: 482bd979881423375ca5414e4e0d94cd7c5349dbb17fffd46b4d36d71e62a1bc
  delegate_to: homelab
  become: true

- name: Install the exact Ollama generation template counted by the guard
  ansible.builtin.copy:
    src: "{{ swarm_stack_src }}/recipes/generation-template.txt"
    dest: "{{ swarm_state_root }}/openviking/inference/cpu-tokenizer/ollama-template.txt"
    owner: root
    group: root
    mode: "0444"
  delegate_to: homelab
  become: true

- name: Add adapter revision and path to the stack interpolation environment
  ansible.builtin.set_fact:
    swarm_stack_env: >-
      {{ swarm_stack_env | combine({
        'OPENVIKING_IMAGE': openviking_image | default('ghcr.io/volcengine/openviking@sha256:2ae2799dac1e606218d9ffeb06af3b65c8218b3556555620a369ed81b7c5aa1f'),
        'OPENVIKING_TOKENIZER_PATH': swarm_state_root ~ '/openviking/inference/cpu-tokenizer',
        'OPENVIKING_ADAPTER_PATH': swarm_state_root ~ '/openviking/inference/inference-adapter.py',
        'OPENVIKING_ADAPTER_SHA256': lookup('file', swarm_stack_src ~ '/files/inference-adapter.py', rstrip=false) | hash('sha256')
      }) }}
  no_log: true
