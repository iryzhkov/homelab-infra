services:
  openviking:
    image: git.ryzhkov.dev/igor/openviking:latest
    build: .
    container_name: openviking
    ports:
      - "1933:1933"
    volumes:
      - /home/iryzhkov/app/openviking/ov.conf:/app/ov.conf
      - /home/iryzhkov/app/openviking/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:1933/health'))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
