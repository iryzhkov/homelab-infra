# Baseline OV stays at 0.2.6 until the separately controlled upgrade cutover.
# CPU providers are scoped Compose projects because Swarm has no memory-swap cap.
# All inference endpoints are overlay-only. ov.conf remains private and untouched.
services:
  openviking:
    image: git.ryzhkov.dev/igor/openviking:latest@sha256:e9a7222f1f2d4b43bb6e76c50c8a71b70be5d96e7ed0a4a515c1920dcda69b3f
    networks: [default, providers]
    ports:
      - "1933:1933"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/openviking/config/ov.conf
        target: /app/ov.conf
      - type: bind
        source: ${SWARM_STATE_ROOT}/openviking/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json, urllib.request as u;
          key = json.load(open('/app/ov.conf'))['server']['root_api_key'];
          u.urlopen(u.Request('http://127.0.0.1:1933/health',
          headers={'Authorization': 'Bearer ' + key}), timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.openviking == true
      resources:
        limits:
          memory: 1536M
          cpus: "2"
        reservations:
          memory: 256M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s


  inference-adapter:
    image: ghcr.io/volcengine/openviking@sha256:2ae2799dac1e606218d9ffeb06af3b65c8218b3556555620a369ed81b7c5aa1f
    entrypoint: [python3, -B, /app/inference-adapter.py]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENVIKING_ADAPTER_SHA256: ${OPENVIKING_ADAPTER_SHA256:?set by embeddings-prepare.yml}
    volumes:
      - type: bind
        source: ${OPENVIKING_ADAPTER_PATH:?set by embeddings-prepare.yml}
        target: /app/inference-adapter.py
        read_only: true
      - type: bind
        source: ${OPENVIKING_TOKENIZER_PATH:?set by embeddings-prepare.yml}
        target: /app/cpu-tokenizer
        read_only: true
    networks:
      providers:
        aliases: [embedding-adapter]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.host == homelab]
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
          pids: 32
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

networks:
  default: {}
  providers:
    external: true
    name: openviking-providers
