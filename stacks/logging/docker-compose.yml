services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    # Loki must not use the Loki logging driver itself. If it is down, Docker
    # otherwise cannot start it, which blocks every container lifecycle action.
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3100:3100"
    volumes:
      - ./loki-data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3200:3000"
    volumes:
      - /mnt/backup/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://logs.ryzhkov.dev
    depends_on:
      - loki

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8087:8086"
    volumes:
      # Local Docker volume — NFS can't handle the chown InfluxDB does on init,
      # and time-series writes are happier on local disk anyway.
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASS}
      - DOCKER_INFLUXDB_INIT_ORG=ryzhkov
      - DOCKER_INFLUXDB_INIT_BUCKET=homeassistant
      - DOCKER_INFLUXDB_INIT_RETENTION=52w
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}

volumes:
  influxdb-data:
  influxdb-config:
