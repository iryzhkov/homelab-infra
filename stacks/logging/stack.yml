# Loki, Grafana and InfluxDB as a Swarm stack (phase 5, batch F5). Deployed
# by playbooks/swarm.yml from its entry in inventory/group_vars/swarm/
# stacks-f5.yml; the Compose file beside this one stays until the phase 5
# cleanup. All three services follow pin.logging, so they always run on the
# same node and reach each other by service name on the stack's network.
#
# State in ${SWARM_STATE_ROOT}/logging: loki/ and config/loki-config.yml
# (from the Compose directory), grafana/ (moved off NFS, where the plan
# forbids a database), influxdb/data and influxdb/config (the two named
# volumes, now binds).
#
# Every Docker daemon and promtail in the house pushes to port 3100 on
# homelab's address, and Home Assistant and Proxmox write to 8087 there;
# through the routing mesh both keep answering wherever the stack runs, as
# long as homelab is up. Loki keeps the `local` log driver: it must not log
# to itself.
#
# Images are the versions the :latest and :2 tags resolved to at conversion;
# InfluxDB 2.9.1 is pinned by digest because the 2.9.1 tag has been rebuilt
# since the running image was pulled.

services:
  loki:
    # Docker Hub grafana/loki:3.7.8 (sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193),
    # served from the Forgejo mirror (playbooks/swarm.yml --tags registry).
    image: git.ryzhkov.dev/igor/mirror/docker.io/grafana/loki@sha256:e664166bca56031661b40a0a0b1c77dfeffa4b03053cc887836dd4f51cb212ab
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    # Host mode, not the routing mesh: homelab's older containers push to
    # localhost:3100, which resolves to ::1 first. The routing mesh is IPv4
    # only, and on ::1 the port reaches dockerd's placeholder listener, which
    # never accepts, so every push (and every container stop flushing its
    # logs) hung (2026-10-03, F5 evidence). Host mode puts a real listener on
    # every address of the node Loki runs on. The cost: 3100 answers only on
    # that node, as it did under Compose; every other client names homelab's
    # address, so Loki has to stay pinned to homelab.
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/loki
        target: /loki
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/config/loki-config.yml
        target: /etc/loki/local-config.yaml
        read_only: true
    command: -config.file=/etc/loki/local-config.yaml
    # The hash of stacks/logging/files/loki-config.yml (installed by
    # swarm-prepare.yml): a changed configuration changes the service, and
    # the deploy restarts Loki with it.
    environment:
      LOKI_CONFIG_SHA256: ${LOKI_CONFIG_SHA256:?set by env_extra}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 192M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  grafana:
    # Docker Hub grafana/grafana:13.2.2 (sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0),
    # served from the Forgejo mirror (playbooks/swarm.yml --tags registry).
    image: git.ryzhkov.dev/igor/mirror/docker.io/grafana/grafana@sha256:9924c7fe0effe4a5fea08b3451905de54f09fde9d1589463a5f2d02d9ec158bc
    ports:
      - "3200:3000"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/grafana
        target: /var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SERVER_ROOT_URL: https://logs.ryzhkov.dev
    secrets:
      - grafana_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 384M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  influxdb:
    # Docker Hub influxdb:2.9.1@sha256:05d6fb735bc22449c401094d42846123a24e3325d3a6e092242a45bfd68fff21,
    # served from the Forgejo mirror (playbooks/swarm.yml --tags registry).
    image: git.ryzhkov.dev/igor/mirror/docker.io/library/influxdb@sha256:cdf0f56ff18bc55c73c297d6a3092d461cb58009187e764def2ad89d6f3e0ac5
    ports:
      - "8087:8086"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/influxdb/data
        target: /var/lib/influxdb2
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/influxdb/config
        target: /etc/influxdb2
    # Setup runs only on an empty data directory; with the copied one these
    # are inert, kept so a rebuild from nothing gets the same organisation.
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_pass
      DOCKER_INFLUXDB_INIT_ORG: ryzhkov
      DOCKER_INFLUXDB_INIT_BUCKET: homeassistant
      DOCKER_INFLUXDB_INIT_RETENTION: 52w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_token
    secrets:
      - influx_pass
      - influx_token
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 320M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

secrets:
  grafana_password:
    name: logging_grafana_password_${SECRET_HASH_GRAFANA_PASSWORD}
    file: ./secrets/GRAFANA_PASSWORD
  influx_pass:
    name: logging_influx_pass_${SECRET_HASH_INFLUX_PASS}
    file: ./secrets/INFLUX_PASS
  influx_token:
    name: logging_influx_token_${SECRET_HASH_INFLUX_TOKEN}
    file: ./secrets/INFLUX_TOKEN
