# Loki, Grafana and InfluxDB as a Swarm stack (phase 5, batch F5). Deployed
# by playbooks/swarm.yml from its entry in inventory/group_vars/swarm/
# stacks-f5.yml; the Compose file beside this one stays until the phase 5
# cleanup. All three services follow pin.logging, so they always run on the
# same node and reach each other by service name on the stack's network.
#
# State in ${SWARM_STATE_ROOT}/logging: loki/ and config/loki-config.yml
# (from the Compose directory), grafana/ (moved off NFS, where the plan
# forbids a database), influxdb/data and influxdb/config (the two named
# volumes, now binds).
#
# Every Docker daemon and promtail in the house pushes to port 3100 on
# homelab's address, and Home Assistant and Proxmox write to 8087 there;
# through the routing mesh both keep answering wherever the stack runs, as
# long as homelab is up. Loki keeps the `local` log driver: it must not log
# to itself.
#
# Images are the versions the :latest and :2 tags resolved to at conversion;
# InfluxDB 2.9.1 is pinned by digest because the 2.9.1 tag has been rebuilt
# since the running image was pulled.

services:
  loki:
    image: grafana/loki:3.7.8
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3100:3100"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/loki
        target: /loki
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/config/loki-config.yml
        target: /etc/loki/local-config.yaml
        read_only: true
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 192M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3200:3000"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/grafana
        target: /var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SERVER_ROOT_URL: https://logs.ryzhkov.dev
    secrets:
      - grafana_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 384M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  influxdb:
    image: influxdb:2.9.1@sha256:05d6fb735bc22449c401094d42846123a24e3325d3a6e092242a45bfd68fff21
    ports:
      - "8087:8086"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/influxdb/data
        target: /var/lib/influxdb2
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/influxdb/config
        target: /etc/influxdb2
    # Setup runs only on an empty data directory; with the copied one these
    # are inert, kept so a rebuild from nothing gets the same organisation.
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_pass
      DOCKER_INFLUXDB_INIT_ORG: ryzhkov
      DOCKER_INFLUXDB_INIT_BUCKET: homeassistant
      DOCKER_INFLUXDB_INIT_RETENTION: 52w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_token
    secrets:
      - influx_pass
      - influx_token
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 320M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

secrets:
  grafana_password:
    name: logging_grafana_password_${SECRET_HASH_GRAFANA_PASSWORD}
    file: ./secrets/GRAFANA_PASSWORD
  influx_pass:
    name: logging_influx_pass_${SECRET_HASH_INFLUX_PASS}
    file: ./secrets/INFLUX_PASS
  influx_token:
    name: logging_influx_token_${SECRET_HASH_INFLUX_TOKEN}
    file: ./secrets/INFLUX_TOKEN
