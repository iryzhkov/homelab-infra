# Loki and Grafana, independently movable from retained legacy-influx.
# Deployed by playbooks/swarm.yml via stacks-f5.yml; logging's prepare guard
# requires the accepted legacy-influx cold transition before any prune.
# Both stacks use the existing external logging_default overlay, so Grafana
# keeps the Flux endpoint http://influxdb:8086 unchanged.
#
# State in ${SWARM_STATE_ROOT}/logging: loki/, grafana/ and config/.
# The old inactive influxdb directory is retained as a cold rollback copy.
# Loki's host-published 3100 and remaining direct clients still require the
# existing logging move guards until those clients have been retired.
# GF_SECURITY_ALLOW_EMBEDDING permits the explicitly approved iframe shares;
# ordinary Grafana authentication remains enabled.

services:
  loki:
    # served from the Forgejo mirror (playbooks/swarm.yml --tags registry).
    image: git.ryzhkov.dev/igor/mirror/docker.io/grafana/loki@sha256:e664166bca56031661b40a0a0b1c77dfeffa4b03053cc887836dd4f51cb212ab
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    # Host mode, not the routing mesh: homelab's older containers push to
    # localhost:3100, which resolves to ::1 first. The routing mesh is IPv4
    # only, and on ::1 the port reaches dockerd's placeholder listener, which
    # never accepts, so every push (and every container stop flushing its
    # logs) hung (2026-10-03, F5 evidence). Host mode puts a real listener on
    # every address of the node Loki runs on. The cost: 3100 answers only on
    # that node, as it did under Compose; every other client names homelab's
    # address, so Loki has to stay pinned to homelab.
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/loki
        target: /loki
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/config/loki-config.yml
        target: /etc/loki/local-config.yaml
        read_only: true
    command: -config.file=/etc/loki/local-config.yaml
    # The hash of stacks/logging/files/loki-config.yml (installed by
    # swarm-prepare.yml): a changed configuration changes the service, and
    # the deploy restarts Loki with it.
    environment:
      LOKI_CONFIG_SHA256: ${LOKI_CONFIG_SHA256:?set by env_extra}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 192M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

  grafana:
    # Docker Hub grafana/grafana:13.2.2 (sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0),
    # served from the Forgejo mirror (playbooks/swarm.yml --tags registry).
    image: git.ryzhkov.dev/igor/mirror/docker.io/grafana/grafana@sha256:9924c7fe0effe4a5fea08b3451905de54f09fde9d1589463a5f2d02d9ec158bc
    ports:
      - "3200:3000"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/logging/grafana
        target: /var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SERVER_ROOT_URL: https://logs.ryzhkov.dev
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Keep the Go heap below the cgroup limit. Grafana repeatedly hit its
      # 1 GiB limit and was OOM-killed during the 2026-10-13 baseline audit.
      GOMEMLIMIT: 768MiB
    secrets:
      - grafana_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.logging == true
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s

# influxdb is supplied by the independently pinned legacy-influx stack.
# Keep the overlay name and alias stable for existing Grafana Flux sources.
networks:
  default:
    external: true
    name: logging_default

secrets:
  grafana_password:
    name: logging_grafana_password_${SECRET_HASH_GRAFANA_PASSWORD}
    file: ./secrets/GRAFANA_PASSWORD
