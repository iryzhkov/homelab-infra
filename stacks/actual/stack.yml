# Actual Budget as a Swarm stack (phase 5, batch F1). Deployed by
# playbooks/swarm.yml from its entry in inventory/group_vars/swarm/
# stacks-f1.yml; the Compose file beside this one stays until the phase 5
# cleanup. State lives in ${SWARM_STATE_ROOT}/actual/data (server-files/,
# user-files/, .migrate; root-owned, copied with numeric ids) on the node
# labelled pin.actual.
#
# The image is the version the Compose project ran at conversion (26.9.0, the
# digest :latest resolved to then), so the cutover does not upgrade it.

services:
  actual-server:
    # Docker Hub actualbudget/actual-server:26.11.0 (sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6),
    # served from the Forgejo mirror (playbooks/swarm.yml --tags registry).
    image: git.ryzhkov.dev/igor/mirror/docker.io/actualbudget/actual-server@sha256:70c39707a614e2e6d4f2657b77b14be1386fdd20dad0c296895272bf4bb76dd7
    ports:
      - "5006:5006"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/actual/data
        target: /data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.actual == true
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 80M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
