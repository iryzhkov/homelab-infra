---
# voice's Caddyfile and site on every worker, for the Swarm stack (phase 5,
# batch S2). Included by roles/swarm/tasks/stack.yml on the bootstrap manager,
# before the deploy.
#
# The source is the Compose directory on the bootstrap manager
# ({{ stack_root }}/voice), which predates this repository and is not in it.
# The bootstrap manager pushes to the other worker with its own SSH alias for
# it (the fleet_ssh peers on homelab name normandy by its inventory name).

- name: Create voice's directory on every worker
  ansible.builtin.file:
    path: "{{ swarm_state_root }}/voice"
    state: directory
    owner: "{{ hostvars[item].ssh_user }}"
    group: "{{ hostvars[item].ssh_user }}"
    mode: "0755"
  become: true
  delegate_to: "{{ item }}"
  loop: "{{ groups['swarm_workers'] }}"

# A check run passes --dry-run, so it reports what a real run would copy.
- name: Mirror the Caddyfile and the site to every worker
  ansible.builtin.command:
    argv: >-
      {{ ['rsync', '-a', '--delete', '--itemize-changes']
         + (['--dry-run'] if ansible_check_mode else [])
         + ['--include=/Caddyfile', '--include=/site/***', '--exclude=*',
            stack_root ~ '/voice/',
            ('' if item == inventory_hostname else item ~ ':') ~ swarm_state_root ~ '/voice/'] }}
  loop: "{{ groups['swarm_workers'] }}"
  register: voice_mirror
  changed_when: voice_mirror.stdout | trim | length > 0
  failed_when: voice_mirror.rc != 0 and not ansible_check_mode
  check_mode: false

- name: Restart voice when its Caddyfile changed
  ansible.builtin.command:
    argv: [docker, service, update, --force, --detach=false, voice_voice]
  changed_when: true
  when:
    - not ansible_check_mode
    - voice_mirror.results | map(attribute='stdout') | select('search', 'Caddyfile') | list | length > 0
    - swarm_stack.name in swarm_stack_list.stdout_lines
