services:
  emby:
    image: emby/embyserver:latest
    container_name: Emby
    restart: always
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ${EMBY_CONFIG:?set in .env}:/config
      - /mnt/shared:/mnt/shared
    environment:
      - UID=1000
      - GID=1000
      - GIDLIST=${EMBY_GIDLIST:?set in .env}
