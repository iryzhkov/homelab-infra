services:
  gatus:
    image: ghcr.io/twin/gatus:v5.37.0
    container_name: gatus
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${HOST_IP}:3002:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gatus-data:/data

volumes:
  gatus-data:
