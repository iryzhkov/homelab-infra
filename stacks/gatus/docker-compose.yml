services:
  gatus:
    image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    container_name: gatus
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      CHALDEA_PUBLISHER_HEARTBEAT_TOKEN: ${CHALDEA_PUBLISHER_HEARTBEAT_TOKEN:-}
      AKASHA_BACKUP_HEARTBEAT_TOKEN: ${AKASHA_BACKUP_HEARTBEAT_TOKEN:-}
      AKASHA_OFFSITE_HEARTBEAT_TOKEN: ${AKASHA_OFFSITE_HEARTBEAT_TOKEN:-}
      AKASHA_HEALTH_HEARTBEAT_TOKEN: ${AKASHA_HEALTH_HEARTBEAT_TOKEN:-}
    ports:
      - "${HOST_IP}:3002:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gatus-data:/data

volumes:
  gatus-data:
