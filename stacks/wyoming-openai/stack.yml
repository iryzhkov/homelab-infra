# Swarm stack for the Wyoming-to-OpenAI speech-to-text proxy that Home
# Assistant Assist uses (phase 5, batch S2). Replaces docker-compose.yml
# beside it, which stays until the phase 5 cleanup.
#
# Stateless. Home Assistant's Wyoming entry names 192.168.70.223:10300; the
# routing mesh keeps that address answering wherever the task runs, as long as
# homelab is up. The Compose file published on homelab's address only; Swarm
# publishes on every interface of both workers, and the ingress filter keeps
# it off VLAN 60 and the mesh. The key is a placeholder the OpenAI client
# library requires; the backend is unauthenticated.
services:
  wyoming-openai:
    image: ghcr.io/roryeckel/wyoming_openai:latest@sha256:7200ac141cd12594878aca7ce69d7c2159b824a411f25b96ea7431f71d250344
    environment:
      STT_OPENAI_KEY: unused
      STT_OPENAI_URL: https://whisper.ryzhkov.dev/v1
      STT_MODELS: whisper-1
    ports:
      - "10300:10300"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gpu == intel
      resources:
        # Measured working set 43 MiB.
        limits:
          memory: 128M
        reservations:
          memory: 48M
      restart_policy:
        condition: any
      # No mount, so the new task can start before the old one stops.
      update_config:
        order: start-first
