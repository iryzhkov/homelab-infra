---
# Directories the Traefik Compose file bind-mounts, created before the first
# `docker compose up` so that they belong to the deploying user. Docker would
# otherwise create them as root, and roles/traefik, which writes into
# file_provider/ without sudo, could not install the dynamic configuration.
#
# Used by the edge VMs built from the template. public-api's directories
# predate this repository and its stack entry does not name this file.

# The stack root and the stack directory, 0755 as on public-api, rather than
# the 0775 a fresh user's umask gives them.
- name: Keep the stack directories at 0755
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stack_root }}"
    - "{{ stack_dir }}"

- name: Create Traefik's bind-mounted directories
  ansible.builtin.file:
    path: "{{ stack_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - file_provider
    - certs
