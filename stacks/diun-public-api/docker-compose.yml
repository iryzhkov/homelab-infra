services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    hostname: publicAPI
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - diun-data:/data
    environment:
      - DIUN_WATCH_SCHEDULE=0 9 * * 1
      - DIUN_WATCH_FIRSTCHECKNOTIF=true
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      # No notifier. This used to post to webhook-batcher on homelab:8090,
      # which batched the notifications and forwarded them to Discord; that
      # service was archived in the 2026-08-30 cleanup, so the notifications
      # went nowhere from then until 2026-09-06, when the endpoint was removed.
      # Container updates are reported by docker-update-sweep instead, into a
      # T3 thread and the fleet feed.
    restart: unless-stopped

volumes:
  diun-data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.216.4.0/24
