# Observation only. Configuration is prepared on the pinned worker.
services:
  janitorr:
    image: ghcr.io/schaka/janitorr:jvm-v2.2.2@sha256:eecb604b6307f4ba5674bec7e3fc142d7212361571a1a9dc1f39e0fd069a4434
    user: "1000:1000"
    environment:
      # Changing the rendered config replaces the task without exposing keys.
      JANITORR_CONFIG_SHA256: ${JANITORR_CONFIG_SHA256:?set by swarm-prepare.yml}
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/janitorr/application.yml
        target: /config/application.yml
        read_only: true
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.janitorr == true
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 30s
