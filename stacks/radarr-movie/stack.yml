# Radarr as a Swarm stack (phase 5, batch F2). Deployed by
# playbooks/swarm.yml from its entry in inventory/group_vars/swarm/
# stacks-f2.yml; the Compose file beside this one stays until the phase 5
# cleanup. State lives in ${SWARM_STATE_ROOT}/radarr-movie/config on the
# node labelled pin.radarr-movie; the NAS share is mounted at the same path
# on both workers.
#
# The image is the version the Compose project ran at conversion
# (6.4.4.10685-ls318, the digest :latest resolved to then), from lscr.io
# rather than Docker Hub (the same image; Hub's anonymous pull limit was hit
# on normandy on 2026-10-02), so the cutover does not upgrade it.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    # Match the media owner/group on the NFS share; default 911 cannot traverse it.
    environment:
      PUID: "1002"
      PGID: "988"
    ports:
      - "7878:7878"
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/radarr-movie/config
        target: /config
      - type: bind
        source: /mnt/shared
        target: /mnt/shared
      - type: bind
        source: /mnt/shared/media/movies
        target: /movies
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pin.radarr-movie == true
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
