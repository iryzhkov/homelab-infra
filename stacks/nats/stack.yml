# NATS JetStream, one node (docs/nats-jetstream.md). Accounts, users, streams
# and limits: docs/chaldea-infra-foundation.md.
#
# The configuration is ${SWARM_STATE_ROOT}/nats/config/nats.conf, rendered by
# swarm-prepare.yml from templates/nats.conf.j2. It holds only public NKeys,
# so it is a read-only bind mount rather than a Docker secret; its hash
# (NATS_CONFIG_SHA256, inventory/group_vars/swarm/stacks-nats.yml) changes the
# service, and the deploy restarts the broker with it.
services:
  nats:
    image: nats:2.15.1-alpine@sha256:9e47060a6c099ce118566e425245adc5c78139d02e1cc6fc48747b776445c4f8
    user: "1000:1000"
    command: ["-c", "/etc/nats/nats.conf"]
    read_only: true
    ports:
      - target: 9222
        published: 9222
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${SWARM_STATE_ROOT}/nats/data
        target: /data
      - type: bind
        source: ${SWARM_STATE_ROOT}/nats/config/nats.conf
        target: /etc/nats/nats.conf
        read_only: true
    environment:
      NATS_CONFIG_SHA256: ${NATS_CONFIG_SHA256:?set by env_extra}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == homelab
          - node.labels.pin.nats == true
      resources:
        limits: {cpus: "0.5", memory: 512M}
        reservations: {cpus: "0.1", memory: 128M}
      update_config: {order: stop-first}
      rollback_config: {order: stop-first}
      restart_policy: {condition: any, delay: 5s}
