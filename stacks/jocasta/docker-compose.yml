services:
  jocasta:
    image: ${JOCASTA_IMAGE:?set immutable JOCASTA_IMAGE}
    container_name: jocasta
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    ports:
      - "${HOST_IP}:1935:8080"
    environment:
      JOCASTA_LISTEN: ":8080"
      JOCASTA_DB: /data/jocasta.db
      JOCASTA_TOKENS_FILE: /run/secrets/jocasta-tokens.json
      JOCASTA_MAX_STORAGE_BYTES: "10737418240"
      JOCASTA_MIN_FREE_BYTES: "5368709120"
      # Opt-in HTTP MCP, set together by prepare.yml or not at all
      # (docs/jocasta.md). Jocasta treats an empty value as unset.
      JOCASTA_OIDC_ISSUER: ${JOCASTA_OIDC_ISSUER:-}
      JOCASTA_OIDC_AUDIENCE: ${JOCASTA_OIDC_AUDIENCE:-}
      JOCASTA_OIDC_JWKS_URL: ${JOCASTA_OIDC_JWKS_URL:-}
      JOCASTA_MCP_RESOURCE_URL: ${JOCASTA_MCP_RESOURCE_URL:-}
      # Separate optional public operator trust. Empty trio keeps it disabled.
      JOCASTA_OPERATOR_OIDC_ISSUER: ${JOCASTA_OPERATOR_OIDC_ISSUER:-}
      JOCASTA_OPERATOR_OIDC_JWKS_URL: ${JOCASTA_OPERATOR_OIDC_JWKS_URL:-}
      JOCASTA_OPERATOR_OIDC_CLIENT_ID: ${JOCASTA_OPERATOR_OIDC_CLIENT_ID:-}
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=67108864,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
