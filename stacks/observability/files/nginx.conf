worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 16m;
  server {
    listen 8080;
    location = /ready { return 200 "ready\n"; }
    location = /api/v1/write {
      limit_except POST { deny all; }
      auth_basic "homelab ingest";
      auth_basic_user_file /run/secrets/ingest_users;
      set $metrics http://observability_victoriametrics:8428;
      proxy_pass $metrics;
      proxy_set_header Authorization "";
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }
    location = /loki/api/v1/push {
      limit_except POST { deny all; }
      auth_basic "homelab ingest";
      auth_basic_user_file /run/secrets/ingest_users;
      set $logs http://logging_loki:3100;
      proxy_pass $logs;
      proxy_set_header Authorization "";
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }
    location / { return 404; }
  }
}
