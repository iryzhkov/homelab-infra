# Credentials live in secrets/homelab-miniflux.sops.yaml and are rendered into
# .env beside this file. They used to sit here in plain text, which meant the
# Authentik OIDC client secret and both passwords travelled to Backblaze with
# every backup of ~/app.

services:
  miniflux:
    image: miniflux/miniflux:latest
    ports:
      - "5080:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:?set in .env}
      - RUN_MIGRATIONS=1
      - FETCHER_ALLOW_PRIVATE_NETWORKS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=iryzhkov
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set in .env}
      - OAUTH2_PROVIDER=oidc
      - OAUTH2_CLIENT_ID=${OAUTH2_CLIENT_ID:?set in .env}
      - OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET:?set in .env}
      - OAUTH2_REDIRECT_URL=https://rss.ryzhkov.dev/oauth2/oidc/callback
      - OAUTH2_OIDC_DISCOVERY_ENDPOINT=https://auth.ryzhkov.dev/application/o/rss/
      - OAUTH2_USER_CREATION=1
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=miniflux
    volumes:
      - /home/iryzhkov/app/miniflux/data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
