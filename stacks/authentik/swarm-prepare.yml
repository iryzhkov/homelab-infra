---
# Preparation for the authentik Swarm stack, run by roles/swarm (tasks/stack.yml)
# on the bootstrap manager, after the pin label is set and before the Compose
# project is retired and the stack deployed. Twin of
# stacks/miniflux/swarm-prepare.yml; keep the two in step.
#
# The pinned node is the one carrying the label pin.authentik (the inventory's
# `pin` only before the first cutover), so a converge after a move looks on
# the node the stack moved to. Every run refuses to let the stack be deployed
# onto a data directory on that node that holds no database.
#
# A cutover run (-e swarm_cutover=authentik) that finds the Compose project
# also, in this order:
#
#   1. while Compose still serves: pg_dump -Fc of the database into
#      <pool>/snapshots/authentik/cutover/ (shipped to the peer and offsite by
#      the hourly job, never pruned by it), restored into a throwaway Postgres
#      container (same image, tmpfs data directory, no network) whose users,
#      applications and flows are counted against the live database; the
#      container is removed whatever the result, and the run stops if the
#      restore failed;
#   2. stops the Authentik watchdog timer, which would otherwise try to
#      restart containers that are going away (roles/authentik_watchdog
#      removes it at the next site.yml run once this stack is active);
#   3. stops the Compose project: SSO is down from here;
#   4. copies the named volumes authentik_database and authentik_redis and
#      the media, custom-templates and certs directories into
#      /srv/swarm/authentik/{postgres,redis,media,templates,certs} with rsync
#      -a --numeric-ids (Postgres's uid 70, Redis's 999 kept), checks that a
#      second rsync pass finds nothing to change, and writes .swarm-owner.
#
# The volumes and directories are only read, never changed: they are the
# rollback copy (docs/transition/phase5/2026-10-03-P2.md, "Rollback").

# The node is the one holding the pin label, as in every other prepare file
# (stacks/actual/swarm-prepare.yml): after playbooks/swarm-move.yml the label,
# not the inventory's `pin`, says where the state lives. Before the first
# cutover no node carries the label, and the inventory's pin is the answer.
- name: Find the node holding pin.{{ swarm_stack.name }}
  ansible.builtin.command:
    argv: [docker, node, ls, -q, --filter, "node.label=pin.{{ swarm_stack.name }}=true"]
  register: p2_pinned
  changed_when: false
  check_mode: false

- name: Read the pinned node's inventory name
  ansible.builtin.command:
    argv: [docker, node, inspect, --format, "{{ p2_host_format }}", "{{ p2_pinned.stdout_lines[0] }}"]
  vars:
    p2_host_format: !unsafe '{{index .Spec.Labels "host"}}'
  register: p2_pin_host
  changed_when: false
  check_mode: false
  when: p2_pinned.stdout_lines | length == 1

# swarm_prep_pin_override names another node as if it held the label, to
# rehearse a post-move converge without moving anything; check mode only.
- name: Refuse a simulated pin outside check mode
  ansible.builtin.assert:
    that: ansible_check_mode
    fail_msg: swarm_prep_pin_override is for check-mode rehearsals only.
    quiet: true
  when: swarm_prep_pin_override is defined

- name: Remember where the state lives
  ansible.builtin.set_fact:
    p2_node: >-
      {{ swarm_prep_pin_override
         if swarm_prep_pin_override is defined
         else ((p2_pin_host.stdout | trim)
               if p2_pinned.stdout_lines | length == 1 else swarm_stack.pin) }}

- name: Describe the authentik cutover
  ansible.builtin.set_fact:
    p2_dir: "{{ swarm_state_root }}/authentik"
    p2_dump_dir: "{{ hostvars[p2_node].swarm_pool_path }}/snapshots/authentik/cutover"
    p2_project: "{{ swarm_stack.compose.project | default(swarm_stack.name) }}"
    p2_scratch: swarm-restore-check-authentik
    # The stack's own postgresql image (Docker Hub postgres:16.15-alpine, from
    # the Forgejo mirror), already on both workers.
    p2_image: git.ryzhkov.dev/igor/mirror/docker.io/library/postgres@sha256:49c0be96b8c1cc13508a297288dee13b874298bf2ae34a81c392acd9c0f052b7
    p2_database: authentik
    p2_user: authentik
    p2_checks:
      - { name: users, query: "select count(*) from authentik_core_user", compare: exact }
      - { name: applications, query: "select count(*) from authentik_core_application", compare: exact }
      - { name: flows, query: "select count(*) from authentik_flows_flow", compare: exact }
    p2_volumes:
      - { volume: "{{ swarm_stack.compose.project | default(swarm_stack.name) }}_database", dest: postgres }
      - { volume: "{{ swarm_stack.compose.project | default(swarm_stack.name) }}_redis", dest: redis }
    p2_directories:
      - { source: "{{ swarm_stack.compose.dir }}/media", dest: media }
      - { source: "{{ swarm_stack.compose.dir }}/custom-templates", dest: templates }
      - { source: "{{ swarm_stack.compose.dir }}/certs", dest: certs }
    # The file that proves a copied Postgres data directory is not empty.
    p2_marker: postgres/PG_VERSION

- name: Find the Compose project's containers, running or stopped
  ansible.builtin.command:
    argv: [docker, ps, -aq, --filter, "label=com.docker.compose.project={{ p2_project }}"]
  delegate_to: "{{ swarm_stack.compose.host }}"
  register: p2_compose_all
  changed_when: false
  check_mode: false

- name: Find the running Compose database container
  ansible.builtin.command:
    argv: [docker, ps, -q, --filter, "label=com.docker.compose.project={{ p2_project }}",
           --filter, label=com.docker.compose.service=postgresql]
  delegate_to: "{{ swarm_stack.compose.host }}"
  register: p2_compose_db
  changed_when: false
  check_mode: false

- name: Decide what this run does
  ansible.builtin.set_fact:
    p2_cutting_over: >-
      {{ swarm_cutover | default('') == swarm_stack.name
         and p2_compose_all.stdout | trim | length > 0 }}
    p2_db_running: "{{ p2_compose_db.stdout | trim | length > 0 }}"

# The cold copy below is a local rsync, and the dump is written to the pinned
# node's pool: a cutover needs the Compose project on the node holding the pin.
# After the cutover (the Compose project gone) the stack may live anywhere.
- name: Require the Compose project on the pinned node
  ansible.builtin.assert:
    that: swarm_stack.compose.host == p2_node
    fail_msg: >-
      authentik runs under Compose on {{ swarm_stack.compose.host }} but is pinned to
      {{ p2_node }}; this preparation copies locally and cannot cross nodes.
    quiet: true
  when: p2_cutting_over

- name: Create the state directory on {{ p2_node }}
  ansible.builtin.file:
    path: "{{ p2_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ p2_node }}"
  become: true
  when: p2_cutting_over

- name: Say where the state lives
  ansible.builtin.debug:
    msg: "authentik state: {{ p2_dir }} on {{ p2_node }}"

- name: Find the named volumes' directories
  ansible.builtin.command:
    argv: "{{ ['docker', 'volume', 'inspect', '--format', '{{' ~ '.Mountpoint' ~ '}}'] + (p2_volumes | map(attribute='volume') | list) }}"
  delegate_to: "{{ swarm_stack.compose.host }}"
  register: p2_volume_paths
  changed_when: false
  check_mode: false
  when: p2_cutting_over

- name: List everything to copy
  ansible.builtin.set_fact:
    p2_copies: >-
      {%- set copies = [] -%}
      {%- for volume in p2_volumes -%}
      {%-   set _ = copies.append({'source': p2_volume_paths.stdout_lines[loop.index0], 'dest': volume.dest}) -%}
      {%- endfor -%}
      {{ copies + p2_directories }}
  when: p2_cutting_over

- name: Say what the cutover would do
  ansible.builtin.debug:
    msg: >-
      Check mode: the cutover would dump {{ p2_database }}, prove the dump in
      {{ p2_scratch }}, stop authentik-watchdog.timer and the Compose project,
      and copy {{ p2_copies | map(attribute='source') | list }} into {{ p2_dir }}.
  when: ansible_check_mode and p2_cutting_over

# 1. Dump and prove the dump, while Compose still serves ---------------------
# Not in check mode: the commands would be skipped and the checks after them
# (until:, the count comparison) would run against nothing.

- name: Create the cutover dump directory
  ansible.builtin.file:
    path: "{{ p2_dump_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ p2_node }}"
  become: true
  when: p2_cutting_over and not ansible_check_mode

# A re-run after a failure past the stop finds the database stopped; the dump
# the first run made and proved is then the one that stands.
- name: Find an earlier cutover dump
  ansible.builtin.find:
    paths: "{{ p2_dump_dir }}"
    patterns: "{{ p2_database }}_*.dump"
  delegate_to: "{{ p2_node }}"
  become: true
  register: p2_earlier_dumps
  when: p2_cutting_over and not p2_db_running and not ansible_check_mode

- name: Refuse to go on without a proved dump
  ansible.builtin.assert:
    that: p2_earlier_dumps.matched | default(0) > 0
    fail_msg: >-
      The Compose database is stopped and {{ p2_dump_dir }} holds no dump.
      Start the Compose project again (site.yml -l {{ swarm_stack.compose.host }}
      -e only={{ swarm_stack.name }}) and repeat the cutover.
    quiet: true
  when: p2_cutting_over and not p2_db_running and not ansible_check_mode

- name: Dump {{ p2_database }} and prove the dump
  when: p2_cutting_over and p2_db_running and not ansible_check_mode
  block:
    - name: Name the dump
      ansible.builtin.set_fact:
        p2_dump: "{{ p2_dump_dir }}/{{ p2_database }}_{{ lookup('pipe', 'date +%Y-%m-%d_%H%M%S') }}.dump"

    - name: Dump {{ p2_database }} from the running Compose database
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          docker exec {{ p2_compose_db.stdout_lines[0] }} \
              pg_dump -Fc -U {{ p2_user }} {{ p2_database }} > {{ p2_dump }}.partial
          test -s {{ p2_dump }}.partial
          mv {{ p2_dump }}.partial {{ p2_dump }}
          stat -c '%s bytes' {{ p2_dump }}
        executable: /bin/bash
      delegate_to: "{{ swarm_stack.compose.host }}"
      become: true
      changed_when: true

    - name: Count rows in the live database
      ansible.builtin.command:
        argv: [docker, exec, "{{ p2_compose_db.stdout_lines[0] }}", psql, -At, -U, "{{ p2_user }}",
               -d, "{{ p2_database }}", -c, "{{ item.query }}"]
      delegate_to: "{{ swarm_stack.compose.host }}"
      loop: "{{ p2_checks }}"
      loop_control:
        label: "{{ item.name }}"
      register: p2_live_counts
      changed_when: false

    - name: Restore into a scratch Postgres and compare
      block:
        - name: Start the scratch Postgres
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --detach
              - --rm
              - --name
              - "{{ p2_scratch }}"
              - --network
              - none
              # Not the daemon's Loki driver: a blocked Loki push can hang the
              # container's removal (gatus, 2026-10-03).
              - --log-driver
              - local
              # A tmpfs at the image's VOLUME path: no anonymous volume is
              # left behind (the nightly restore check's phase 0 carry).
              - --tmpfs
              - /var/lib/postgresql/data:rw,size=1g
              - --env
              - POSTGRES_USER={{ p2_user }}
              - --env
              - POSTGRES_DB={{ p2_database }}
              - --env
              - POSTGRES_PASSWORD=restore-check
              - "{{ p2_image }}"
          delegate_to: "{{ swarm_stack.compose.host }}"
          changed_when: true

        # Over TCP: the entrypoint's initialisation server listens on the
        # socket only, so this answers once the real server is up.
        - name: Wait for the scratch Postgres
          ansible.builtin.command:
            argv: [docker, exec, "{{ p2_scratch }}", pg_isready, -h, 127.0.0.1, -U, "{{ p2_user }}"]
          delegate_to: "{{ swarm_stack.compose.host }}"
          register: p2_scratch_ready
          until: p2_scratch_ready.rc == 0
          retries: 30
          delay: 2
          changed_when: false

        - name: Restore the dump
          ansible.builtin.shell:
            cmd: >-
              docker exec -i {{ p2_scratch }}
              pg_restore -U {{ p2_user }} -d {{ p2_database }} --exit-on-error --no-owner
              < {{ p2_dump }}
          delegate_to: "{{ swarm_stack.compose.host }}"
          become: true
          changed_when: true

        - name: Count rows in the restored database
          ansible.builtin.command:
            argv: [docker, exec, "{{ p2_scratch }}", psql, -At, -U, "{{ p2_user }}",
                   -d, "{{ p2_database }}", -c, "{{ item.query }}"]
          delegate_to: "{{ swarm_stack.compose.host }}"
          loop: "{{ p2_checks }}"
          loop_control:
            label: "{{ item.name }}"
          register: p2_restored_counts
          changed_when: false

        - name: Compare the restored counts with the live ones
          ansible.builtin.assert:
            that:
              - restored | int > 0
              - (restored | int == live | int) if item.0.compare == 'exact' else (restored | int <= live | int)
            fail_msg: "{{ item.0.name }}: restored {{ restored }}, live {{ live }} ({{ item.0.compare }})"
            success_msg: "{{ item.0.name }}: restored {{ restored }}, live {{ live }}"
          loop: "{{ p2_checks | zip(p2_restored_counts.results, p2_live_counts.results) | list }}"
          loop_control:
            label: "{{ item.0.name }}"
          vars:
            restored: "{{ item.1.stdout | trim }}"
            live: "{{ item.2.stdout | trim }}"

      always:
        - name: Remove the scratch Postgres
          ansible.builtin.command:
            argv: [docker, rm, --force, --volumes, "{{ p2_scratch }}"]
          delegate_to: "{{ swarm_stack.compose.host }}"
          register: p2_scratch_rm
          changed_when: p2_scratch_rm.rc == 0
          failed_when: p2_scratch_rm.rc != 0 and 'No such container' not in p2_scratch_rm.stderr

        - name: Make sure the scratch Postgres is gone
          ansible.builtin.command:
            argv: [docker, ps, -aq, --filter, "name=^{{ p2_scratch }}$"]
          delegate_to: "{{ swarm_stack.compose.host }}"
          register: p2_scratch_left
          changed_when: false
          failed_when: p2_scratch_left.stdout | trim | length > 0

# 2 and 3. Stop the watchdog, then Compose: SSO is down from here -------------

- name: Stop Compose and copy its state
  when: p2_cutting_over and not ansible_check_mode
  block:
    - name: Stop the Authentik watchdog
      ansible.builtin.systemd_service:
        name: authentik-watchdog.timer
        state: stopped
      delegate_to: "{{ swarm_stack.compose.host }}"
      become: true
      failed_when: false

    - name: Record the start of the interruption
      ansible.builtin.debug:
        msg: "authentik interruption starts {{ lookup('pipe', 'date -Is') }}"

    - name: Stop the Compose project, giving Postgres time to shut down cleanly
      ansible.builtin.command:
        argv: [docker, compose, --project-name, "{{ p2_project }}", stop, --timeout, "60"]
        chdir: "{{ swarm_stack.compose.dir }}"
      delegate_to: "{{ swarm_stack.compose.host }}"
      changed_when: true

    - name: Make sure no container of the project still runs
      ansible.builtin.command:
        argv: [docker, ps, -q, --filter, "label=com.docker.compose.project={{ p2_project }}"]
      delegate_to: "{{ swarm_stack.compose.host }}"
      register: p2_still_running
      changed_when: false
      failed_when: p2_still_running.stdout | trim | length > 0

    # 4. Cold copy ----------------------------------------------------------

    - name: Copy the stopped state into {{ p2_dir }}
      ansible.builtin.command:
        argv: [rsync, -a, --numeric-ids, --delete, "{{ item.source }}/", "{{ p2_dir }}/{{ item.dest }}/"]
      delegate_to: "{{ p2_node }}"
      become: true
      loop: "{{ p2_copies }}"
      loop_control:
        label: "{{ item.dest }}"
      changed_when: true

    - name: Check that the copy is exact
      ansible.builtin.command:
        argv: [rsync, -a, --numeric-ids, --delete, --dry-run, --itemize-changes,
               "{{ item.source }}/", "{{ p2_dir }}/{{ item.dest }}/"]
      delegate_to: "{{ p2_node }}"
      become: true
      loop: "{{ p2_copies }}"
      loop_control:
        label: "{{ item.dest }}"
      register: p2_copy_check
      changed_when: false
      failed_when: p2_copy_check.rc != 0 or p2_copy_check.stdout | trim | length > 0

    - name: Make {{ p2_node }} the owner for the hourly snapshot
      ansible.builtin.copy:
        content: "{{ p2_node }}\n"
        dest: "{{ p2_dir }}/.swarm-owner"
        owner: root
        group: root
        mode: "0644"
      delegate_to: "{{ p2_node }}"
      become: true

# Never deploy onto an empty data directory: Postgres would initialise a new
# database and Authentik would run its first-time setup with no users.
# Skipped while the Compose project still exists and no cutover was asked
# for, because the role refuses that run next anyway.
- name: Look for the copied database
  ansible.builtin.stat:
    path: "{{ p2_dir }}/{{ p2_marker }}"
  delegate_to: "{{ p2_node }}"
  become: true
  register: p2_marker_stat
  check_mode: false

- name: Prepare persistent storage for Authentik 2025.12 and later
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - "{{ p2_dir }}/data"
    - "{{ p2_dir }}/data/media"
  delegate_to: "{{ p2_node }}"
  become: true

- name: Refuse to deploy without the copied database
  ansible.builtin.assert:
    that: p2_marker_stat.stat.exists
    fail_msg: >-
      {{ p2_dir }}/{{ p2_marker }} is missing on {{ p2_node }}: the state was never
      copied. Cut over with -e swarm_cutover={{ swarm_stack.name }}, or restore it
      from <pool>/snapshots/authentik/ first.
    quiet: true
  when:
    - not ansible_check_mode
    - p2_cutting_over or p2_compose_all.stdout | trim | length == 0
