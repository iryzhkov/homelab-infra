name: Authentik expiry alert
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare scratch home
        run: |
          export HOME="$GITHUB_WORKSPACE/.cache/authentik-expiry/home"
          export TMPDIR="$HOME/tmp"
          test "$HOME" = "$GITHUB_WORKSPACE/.cache/authentik-expiry/home"
          mkdir -p "$TMPDIR"
          printf 'HOME=%s\nTMPDIR=%s\n' "$HOME" "$TMPDIR" >> "$GITHUB_ENV"
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 scripts/test-authentik-expiry.py
      - name: Alert on declared expiries
        run: python3 scripts/check-authentik-expiry.py
