name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/test-upkeeper-drift.py
      - run: python3 -m py_compile roles/drift_check/files/homelab-drift-check
