name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  drift:
    env:
      TMPDIR: ${{ github.workspace }}/../akasha-cutover-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: [self-hosted, Linux, X64, homelab-infra, agent-a]
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the isolated fixture home
        run: |
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR"
          printf 'HOME=%s\n' "$HOME" >>"$GITHUB_ENV"
          printf 'ANSIBLE_COLLECTIONS_PATH=%s\n' "$HOME/.ansible/collections" >>"$GITHUB_ENV"
      - name: Install ShellCheck in the disposable CI container
        run: apt-get update -qq && apt-get install -y --no-install-recommends shellcheck
      - run: python3 scripts/test-upkeeper-drift.py
      - run: python3 scripts/test-authentik-drift.py
      - run: python3 scripts/test-helper-backups.py
      - run: python3 scripts/test-jocasta-backup.py
      - run: python3 scripts/test-swarm-snapshot.py
      - run: python3 scripts/test-observability-backup.py
      - run: python3 scripts/test-observability-textfile.py
      - run: python3 scripts/test_media_anime_packs.py
      - run: python3 scripts/test-media-connections.py
      - run: python3 scripts/test_media_observability.py
      - run: python3 -m unittest discover -s scripts -p test_seedpool_policy.py
      - name: Install the deployment templating version for guarded role tests
        run: pip install --disable-pip-version-check ansible-core==2.19.13
      - name: Install the Compose module for OV source syntax checks
        run: ansible-galaxy collection install community.docker:5.4.0
      - name: Test bounded web MCP and OV packaging
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/run-web-mcp-ci.py
      - name: Validate the NATS stack
        run: |
          python3 scripts/stack-lint.py stacks/nats/stack.yml
      - name: Test cold-transition, inventory and activation guards
        run: |
          python3 -m unittest discover -s roles/base/tests -v
          python3 -m unittest discover -s roles/legacy_influx_transition/tests -v
          python3 -m unittest discover -s roles/observability_host_metadata/tests -v
          python3 -m unittest discover -s roles/observability_homeassistant_config/tests -v
          python3 -m unittest discover -s roles/observability_hardware/tests -v
          python3 -m unittest discover -s roles/observability_native_gpu/tests -v
          python3 -m unittest discover -s roles/observability_grafana/tests -v
      - run: python3 -m py_compile roles/base/files/homelab-gpu-report roles/observability_pve/files/pve-exporter-launcher.py roles/observability_grafana/library/grafana_observability.py
      - run: python3 -m py_compile roles/backup/files/homelab-swarm-snapshot roles/backup/files/homelab-sqlite-backup
      - run: python3 -m py_compile stacks/jocasta/files/jocasta-backup scripts/jocasta-credentials.py
      - run: shellcheck -S warning stacks/jocasta/files/jocasta-firewall scripts/nats-jetstream-apply.sh
      - run: shellcheck -S warning roles/backup/files/homelab-bulk-backup roles/backup/files/homelab-backup-run roles/backup/files/homelab-restore-verify roles/offsite_phone/files/homelab-offsite-run roles/offsite_phone/files/homelab-offsite-bundle roles/fleet_helpers/files/zigbee-watchdog.sh
      - run: python3 -m py_compile roles/drift_check/files/homelab-drift-check

  authentik-machine-identities:
    runs-on: [self-hosted, Linux, X64, homelab-infra, agent-a]
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    env:
      TMPDIR: ${{ github.workspace }}/../authentik-identities-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the isolated fixture home
        run: |
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR"
          printf 'HOME=%s\\n' "$HOME" >>"$GITHUB_ENV"
      - name: Install the deployment templating version
        run: pip install --disable-pip-version-check ansible-core==2.19.13
      - name: Test machine identities against the isolated HTTPS fixture
        run: python3 -m unittest discover -s roles/authentik_machine_identities/tests -v

  akasha:
    runs-on: [self-hosted, Linux, X64, homelab-infra, agent-a]
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    env:
      TMPDIR: /home/igor/.cache/chaldea-scratch/publisher
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated scratch and test dependencies
        run: |
          export HOME="$TMPDIR/.scratch-home"
          test "$TMPDIR" = /home/igor/.cache/chaldea-scratch/publisher
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR/bin"
          # systemd supplies systemd-analyze for offline unit validation.
          apt-get update -qq && apt-get install -y --no-install-recommends git systemd
          pip install --disable-pip-version-check ansible-core==2.19.13 'nats-py[nkeys]==2.16.0'
      - name: Check copied installer roles against the reviewed fleet pin
        run: |
          export TMPDIR=/home/igor/.cache/chaldea-scratch/audit-role-drift
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = /home/igor/.cache/chaldea-scratch/audit-role-drift/.scratch-home
          mkdir -p "$HOME"
          python3 -B scripts/test-installer-role-drift.py -v
          python3 -B scripts/check-installer-role-drift.py
      - name: Install checksum-pinned disposable broker and CLI
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, tarfile, urllib.request, zipfile
          out = pathlib.Path(os.environ["TMPDIR"]) / "bin"
          assets = [
              ("https://github.com/traefik/traefik/releases/download/v3.7.15/traefik_v3.7.15_linux_amd64.tar.gz",
               "5b9f51199fcb7a3b5f7ae0f9dae8dcf01efadafd92c5fca96ea2822eca81f8e6",
               "traefik", "traefik"),
              ("https://nodejs.org/dist/v26.10.0/node-v26.10.0-linux-x64.tar.xz",
               "ca70e9e349de048b9522abb3adc05b3bd6f43c5ffd3ec57916c7da292f59f022",
               "node-v26.10.0-linux-x64/bin/node", "node"),
              ("https://github.com/nats-io/nats-server/releases/download/v2.15.1/nats-server-v2.15.1-linux-amd64.tar.gz",
               "bf5edc7b1ce98e885c368cb43a886eb148dc5d0551d99f3cf6141fb5e1954c70",
               "nats-server-v2.15.1-linux-amd64/nats-server", "nats-server"),
              ("https://github.com/nats-io/natscli/releases/download/v0.5.0/nats-0.5.0-linux-amd64.zip",
               "d9fc93e9e9ab0310deff7e719a8a0da6f9d66f26d473f039aaee70155507aecc",
               "nats-0.5.0-linux-amd64/nats", "nats"),
          ]
          for url, digest, member, name in assets:
              raw = urllib.request.urlopen(url, timeout=60).read()
              assert hashlib.sha256(raw).hexdigest() == digest, name
              if name in ("nats-server", "node", "traefik"):
                  with tarfile.open(fileobj=io.BytesIO(raw)) as archive:
                      data = archive.extractfile(member).read()
              else:
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      data = archive.read(member)
              target = out / name
              target.write_bytes(data)
              target.chmod(0o755)
          PY
          echo "$TMPDIR/bin" >> "$GITHUB_PATH"
      - name: Test actual NATS ACLs, selected convergence and SQLite restore
        run: |
          export HOME="$TMPDIR/.scratch-home"
          export ROLLOUT_TEST_HOME="$HOME"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME"
          export AKASHA_TEST_HOME="$HOME"
          python3 scripts/test-akasha-infra.py -v
          python3 scripts/test-akasha-ingress.py -v
          export MC_TEST_HOME="$HOME"
          python3 scripts/test-mission-control.py -v
          ansible-playbook playbooks/akasha-ingress.yml --syntax-check
          python3 scripts/test-akasha-backup.py -v
          python3 scripts/test-trust-fetcher.py -v
          python3 scripts/test-trust-rollout.py -v
          python3 scripts/test-chaldea-publisher.py -v
          python3 scripts/test-anchor-reissue.py -v
          ansible-playbook playbooks/chaldea-signer.yml --syntax-check
          # This job only needs SOPS for the heartbeat provisioning syntax check.
          ansible-galaxy collection install community.sops
          ansible-playbook playbooks/chaldea-publisher-heartbeat.yml --syntax-check
          ansible-playbook playbooks/akasha-heartbeat.yml --syntax-check
          ansible-playbook playbooks/akasha-backup.yml --syntax-check
          ansible-playbook playbooks/akasha.yml --syntax-check
          ansible-playbook playbooks/akasha-normandy-consumer-trust.yml --syntax-check
          ansible-playbook playbooks/akasha.yml --list-hosts
