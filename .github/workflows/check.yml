name: Check
on:
  push:
    branches: [main]
  pull_request:
# Keep main-branch checks; only superseded revisions of the same PR cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  drift:
    env:
      TMPDIR: ${{ github.workspace }}/../akasha-cutover-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the isolated fixture home
        run: |
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR"
          printf 'HOME=%s\n' "$HOME" >>"$GITHUB_ENV"
          printf 'ANSIBLE_COLLECTIONS_PATH=%s\n' "$HOME/.ansible/collections" >>"$GITHUB_ENV"
      - name: Install ShellCheck in the disposable CI container
        run: apt-get update -qq && apt-get install -y --no-install-recommends shellcheck git
      - name: Test the pure service-access planner
        run: |
          export HOME="$PWD/.cache/service-access-tests/home"
          export SERVICE_ACCESS_TEST_HOME="$HOME" TMPDIR="$HOME/tmp" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "$PWD/.cache/service-access-tests/home"
          mkdir -p "$TMPDIR"
          python3 -B scripts/test-service-access.py
      - run: python3 scripts/test-upkeeper-drift.py
      - run: python3 scripts/test-authentik-drift.py
      - run: python3 scripts/test-helper-backups.py
      - run: python3 scripts/test-jocasta-backup.py
      - run: python3 scripts/test-swarm-snapshot.py
      - run: python3 scripts/test-observability-backup.py
      - run: python3 scripts/test-observability-textfile.py
      - run: python3 scripts/test_media_anime_packs.py
      - run: python3 scripts/test-media-connections.py
      - run: python3 scripts/test_media_observability.py
      - run: python3 -m unittest discover -s scripts -p test_seedpool_policy.py
      - name: Install the deployment templating version for guarded role tests
        run: pip install --disable-pip-version-check ansible-core==2.19.13 tokenizers==0.22.2
      - name: Test Emby home ownership with a recording backend
        run: |
          export HOME="$PWD/.cache/holonet-executor/p0-tests/home"
          export TMPDIR="$HOME/tmp" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "$PWD/.cache/holonet-executor/p0-tests/home"
          mkdir -p "$HOME" "$TMPDIR"
          python3 scripts/test_emby_home_ownership.py
          python3 scripts/test_holonet_p0_readonly.py
          ansible-playbook playbooks/emby-experience.yml --syntax-check
      - name: Test operator recommendation state and preservation
        run: |
          export HOME="${PWD%/}/.cache/holonet-operator-tests/home"
          export TMPDIR="$HOME/tmp" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "${PWD%/}/.cache/holonet-operator-tests/home"
          mkdir -p "$TMPDIR"
          python3 scripts/test_emby_operator_recommendations.py
          python3 scripts/test_emby_operator_adapter.py
          python3 scripts/test_emby_operator_credential.py
          python3 scripts/test_emby_operator_viewers.py
          python3 scripts/test_emby_operator_socket.py
          ansible-playbook playbooks/emby-operator-viewers.yml --syntax-check
      - name: Test opt-in Jocasta MCP stack configuration
        run: |
          export HOME="$PWD/.cache/jocasta-mcp-tests/home"
          export TMPDIR="$HOME/tmp" PYTHONDONTWRITEBYTECODE=1 JOCASTA_MCP_TEST_HOME="$HOME"
          test "$HOME" = "$PWD/.cache/jocasta-mcp-tests/home"
          mkdir -p "$TMPDIR"
          python3 scripts/test-jocasta-mcp-config.py
      - name: Install the Compose module for OV source syntax checks
        # Exact commit of the verified upstream 5.4.0 tag; avoids its broken Galaxy artifact.
        run: ansible-galaxy collection install git+https://github.com/ansible-collections/community.docker.git,6be1a09bebd60cb5d07e4f4753b2f393e44fe0e2
      - name: Test bounded web MCP and OV packaging
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/run-web-mcp-ci.py
      - name: Test isolated OpenViking upgrade migration
        run: |
          export HOME="$PWD/.cache/ov-selfhost-20261024/home"
          export TMPDIR="$HOME/tmp" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "$PWD/.cache/ov-selfhost-20261024/home"
          mkdir -p "$TMPDIR"
          python3 scripts/test-ov-provider-migration.py
          ansible-playbook playbooks/ov-provider-migration.yml --syntax-check
      - name: Test guarded OpenViking client credential rollover
        # The helper refuses parents owned by another user and sources inside a
        # repository, so the synthetic HOME stays outside the host-owned checkout.
        run: |
          export HOME=/home/job/.cache/ov-selfhost-20261024/client-home
          export TMPDIR="$HOME/tmp" OV_CLIENT_TEST_HOME="$HOME" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = /home/job/.cache/ov-selfhost-20261024/client-home
          install -d -m 0700 /home/job /home/job/.cache /home/job/.cache/ov-selfhost-20261024 "$HOME" "$TMPDIR"
          test "$(realpath -e -- "$HOME")" = "$HOME"
          test "$(stat -c '%u %a' -- /home/job "$HOME" | sort -u)" = "$(id -u) 700"
          python3 scripts/test-ov-client-credentials.py
          ansible-playbook playbooks/ov-client-credentials.yml --syntax-check
      - name: Test bounded OpenViking inference provisioning
        run: |
          export HOME="$PWD/.cache/ov-selfhost-20261024/inference-home"
          export TMPDIR="$HOME/tmp" OPENVIKING_INFERENCE_TEST_HOME="$HOME" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "$PWD/.cache/ov-selfhost-20261024/inference-home"
          mkdir -p "$TMPDIR"
          python3 scripts/test-openviking-inference.py
      - name: Validate the NATS stack
        run: |
          python3 scripts/stack-lint.py stacks/nats/stack.yml
      - name: Test cold-transition, inventory and activation guards
        run: |
          python3 -m unittest discover -s roles/base/tests -v
          python3 -m unittest discover -s roles/legacy_influx_transition/tests -v
          python3 -m unittest discover -s roles/observability_host_metadata/tests -v
          python3 -m unittest discover -s roles/observability_homeassistant_config/tests -v
          python3 -m unittest discover -s roles/observability_hardware/tests -v
          python3 -m unittest discover -s roles/observability_native_gpu/tests -v
          python3 -m unittest discover -s roles/observability_grafana/tests -v
      - run: python3 -m py_compile roles/base/files/homelab-gpu-report roles/observability_pve/files/pve-exporter-launcher.py roles/observability_grafana/library/grafana_observability.py
      - run: python3 -m py_compile roles/backup/files/homelab-swarm-snapshot roles/backup/files/homelab-sqlite-backup
      - run: python3 -m py_compile stacks/jocasta/files/jocasta-backup scripts/jocasta-credentials.py
      - run: shellcheck -S warning stacks/jocasta/files/jocasta-firewall scripts/nats-jetstream-apply.sh
      - run: shellcheck -S warning roles/backup/files/homelab-bulk-backup roles/backup/files/homelab-backup-run roles/backup/files/homelab-restore-verify roles/offsite_phone/files/homelab-offsite-run roles/offsite_phone/files/homelab-offsite-bundle roles/fleet_helpers/files/zigbee-watchdog.sh
      - run: python3 -m py_compile roles/drift_check/files/homelab-drift-check

  openviking-native-providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      # The renderer test uses the runner's CLI read-only, with an absent daemon socket.
      options: --memory=2g --cpus=2 --volume /usr/bin/docker:/usr/local/bin/docker:ro
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated native provider checks
        run: |
          export HOME="$PWD/.cache/ov-selfhost-20261024/native-home"
          test "$HOME" = "$PWD/.cache/ov-selfhost-20261024/native-home"
          mkdir -p "$HOME/tmp"
          printf 'HOME=%s\n' "$HOME" >>"$GITHUB_ENV"
          printf 'TMPDIR=%s/tmp\n' "$HOME" >>"$GITHUB_ENV"
          printf 'OPENVIKING_INFERENCE_TEST_HOME=%s\n' "$HOME" >>"$GITHUB_ENV"
          printf 'OPENVIKING_NATIVE_TEST=1\n' >>"$GITHUB_ENV"
          printf 'PYTHONDONTWRITEBYTECODE=1\n' >>"$GITHUB_ENV"
      - name: Install pinned native provider and deployment schemas
        run: pip install --disable-pip-version-check openviking==0.5.2 ansible-core==2.19.13 tokenizers==0.22.2
      - name: Exercise native inference and actual Swarm rendering
        run: |
          test -x /usr/local/bin/docker
          docker --version
          python3 scripts/test-openviking-inference.py NativeOV SourceContracts.test_actual_docker_stack_config_keeps_supplied_adapter_values -v
      - name: Test lossless physical vector migration with the pinned SDK
        run: |
          export HOME="$PWD/.cache/ov-selfhost-20261024/test-home"
          export TMPDIR="$HOME/scratch" PYTHONDONTWRITEBYTECODE=1
          test "$HOME" = "$PWD/.cache/ov-selfhost-20261024/test-home"
          mkdir -p "$TMPDIR"
          python3 scripts/test-ov-vector-migration.py -v
      - name: Check scoped inference playbooks
        run: |
          ansible-playbook playbooks/ov-inference.yml --syntax-check
          ansible-playbook playbooks/ov-pc-coexistence.yml --syntax-check

  jocasta-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      options: --memory=1g --cpus=2
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the isolated operator fixture home
        run: |
          export HOME="$PWD/.cache/jocasta-operator-tests/home"
          test "$HOME" = "$PWD/.cache/jocasta-operator-tests/home"
          export TMPDIR="$HOME/tmp"
          mkdir -p "$TMPDIR"
          printf 'HOME=%s\nTMPDIR=%s\n' "$HOME" "$TMPDIR" >>"$GITHUB_ENV"
          printf 'MACHINE_IDENTITY_TEST_HOME=%s\nJOCASTA_MCP_TEST_HOME=%s\n' "$HOME" "$HOME" >>"$GITHUB_ENV"
          printf 'PYTHONDONTWRITEBYTECODE=1\n' >>"$GITHUB_ENV"
      - name: Install pinned deployment and upstream importer dependencies
        run: pip install --disable-pip-version-check ansible-core==2.19.13 deepmerge==2.1.0 cryptography==46.0.3 Django==5.2.17 djangorestframework==3.17.1
      - name: Test receipt-bound recovery and pinned importer and mapping-reference semantics
        run: |
          python3 -B roles/authentik_jocasta_operator/tests/test_importer_semantics.py -v
          python3 -B roles/authentik_jocasta_operator/tests/test_operator.py -v
          managed_fixture_home=/root/.cache/webmcp-managed-tests/home
          install -d -m 0700 "$managed_fixture_home" "$managed_fixture_home/tmp"
          env HOME="$managed_fixture_home" TMPDIR="$managed_fixture_home/tmp" WEBMCP_TEST_HOME="$managed_fixture_home" python3 -B scripts/test-webmcp-managed-interactive.py -v
          python3 -B scripts/test-jocasta-mcp-config.py -v

  authentik-machine-identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    env:
      TMPDIR: ${{ github.workspace }}/authentik-identities-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the isolated fixture home
        run: |
          export TMPDIR="$(realpath -m -- "$TMPDIR")"
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR"
          printf 'HOME=%s\nTMPDIR=%s\n' "$HOME" "$TMPDIR" >>"$GITHUB_ENV"
      - name: Install the deployment templating version
        run: pip install --disable-pip-version-check ansible-core==2.19.13
      - name: Test machine identities against the isolated HTTPS fixture
        run: python3 -m unittest discover -s roles/authentik_machine_identities/tests -p test_machine_identities.py -v

  machine-profiles:
    # Keep the long real-role coexistence/cleanup matrix separate from legacy tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    env:
      TMPDIR: ${{ github.workspace }}/machine-profiles-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic web MCP identity profiles in a scratch home
        run: |
          export TMPDIR="$(realpath -m -- "$TMPDIR")"
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR"
          pip install --disable-pip-version-check ansible-core==2.19.13 deepmerge==2.1.0
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s roles/authentik_machine_identities/tests -p test_service_profiles.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s roles/authentik_machine_identities/tests -p test_ov_http_identities.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s roles/authentik_machine_identities/tests -p test_ov_full_rollback.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s roles/authentik_machine_identities/tests -p test_holonet_catalog_identities.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s roles/authentik_machine_identities/tests -p test_holonet_writer_grants.py -v

  akasha:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      options: --memory=512m --cpus=1
      image: python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
    env:
      TMPDIR: /home/igor/.cache/chaldea-scratch/publisher
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated scratch and test dependencies
        run: |
          export HOME="$TMPDIR/.scratch-home"
          test "$TMPDIR" = /home/igor/.cache/chaldea-scratch/publisher
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME" "$TMPDIR/bin"
          # systemd supplies systemd-analyze for offline unit validation.
          apt-get update -qq && apt-get install -y --no-install-recommends git systemd
          pip install --disable-pip-version-check ansible-core==2.19.13 'nats-py[nkeys]==2.16.0'
      - name: Check copied installer roles against the reviewed fleet pin
        run: |
          export TMPDIR=/home/igor/.cache/chaldea-scratch/audit-role-drift
          export HOME="$TMPDIR/.scratch-home"
          test "$HOME" = /home/igor/.cache/chaldea-scratch/audit-role-drift/.scratch-home
          mkdir -p "$HOME"
          python3 -B scripts/test-installer-role-drift.py -v
          python3 -B scripts/check-installer-role-drift.py
      - name: Install checksum-pinned disposable broker and CLI
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, tarfile, urllib.request, zipfile
          out = pathlib.Path(os.environ["TMPDIR"]) / "bin"
          assets = [
              ("https://github.com/traefik/traefik/releases/download/v3.7.15/traefik_v3.7.15_linux_amd64.tar.gz",
               "5b9f51199fcb7a3b5f7ae0f9dae8dcf01efadafd92c5fca96ea2822eca81f8e6",
               "traefik", "traefik"),
              ("https://nodejs.org/dist/v26.10.0/node-v26.10.0-linux-x64.tar.xz",
               "ca70e9e349de048b9522abb3adc05b3bd6f43c5ffd3ec57916c7da292f59f022",
               "node-v26.10.0-linux-x64/bin/node", "node"),
              ("https://github.com/nats-io/nats-server/releases/download/v2.15.1/nats-server-v2.15.1-linux-amd64.tar.gz",
               "bf5edc7b1ce98e885c368cb43a886eb148dc5d0551d99f3cf6141fb5e1954c70",
               "nats-server-v2.15.1-linux-amd64/nats-server", "nats-server"),
              ("https://github.com/nats-io/natscli/releases/download/v0.5.0/nats-0.5.0-linux-amd64.zip",
               "d9fc93e9e9ab0310deff7e719a8a0da6f9d66f26d473f039aaee70155507aecc",
               "nats-0.5.0-linux-amd64/nats", "nats"),
          ]
          for url, digest, member, name in assets:
              raw = urllib.request.urlopen(url, timeout=60).read()
              assert hashlib.sha256(raw).hexdigest() == digest, name
              if name in ("nats-server", "node", "traefik"):
                  with tarfile.open(fileobj=io.BytesIO(raw)) as archive:
                      data = archive.extractfile(member).read()
              else:
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      data = archive.read(member)
              target = out / name
              target.write_bytes(data)
              target.chmod(0o755)
          PY
          echo "$TMPDIR/bin" >> "$GITHUB_PATH"
      - name: Test actual NATS ACLs, selected convergence and SQLite restore
        run: |
          export HOME="$TMPDIR/.scratch-home"
          export ROLLOUT_TEST_HOME="$HOME"
          test "$HOME" = "$TMPDIR/.scratch-home"
          mkdir -p "$HOME"
          export AKASHA_TEST_HOME="$HOME"
          python3 scripts/test-akasha-infra.py -v
          python3 scripts/test-nats-messaging.py -v
          OBJECTSTORE_TEST_HOME="$HOME" python3 -B scripts/test-garage-storage-preflight.py -v
          OBJECTSTORE_TEST_HOME="$HOME" python3 -B scripts/test-garage-storage-native.py -v
          python3 scripts/test-akasha-ingress.py -v
          export MC_TEST_HOME="$HOME"
          python3 scripts/test-mission-control.py -v
          ansible-playbook playbooks/akasha-ingress.yml --syntax-check
          python3 scripts/test-akasha-backup.py -v
          python3 scripts/test-trust-fetcher.py -v
          python3 scripts/test-trust-rollout.py -v
          python3 scripts/test-chaldea-publisher.py -v
          python3 scripts/test-anchor-reissue.py -v
          ansible-playbook playbooks/chaldea-signer.yml --syntax-check
          # This job only needs SOPS for the heartbeat provisioning syntax check.
          ansible-galaxy collection install community.sops
          ansible-playbook playbooks/chaldea-publisher-heartbeat.yml --syntax-check
          ansible-playbook playbooks/emby-operator-credential.yml --syntax-check
          ansible-playbook playbooks/akasha-heartbeat.yml --syntax-check
          ansible-playbook playbooks/akasha-backup.yml --syntax-check
          ansible-playbook playbooks/akasha.yml --syntax-check
          ansible-playbook playbooks/akasha-normandy-consumer-trust.yml --syntax-check
          ansible-playbook playbooks/akasha.yml --list-hosts
